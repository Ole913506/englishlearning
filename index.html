<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordbook — Englisch üben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WORDBOOK — Wörterbuch-Optik: Stein, Tinte, Petrol.
   ============================================================ */
:root{
  --bg:#F3F1EC;
  --card:#FFFFFF;
  --ink:#191A17;
  --ink-2:#5C5D55;
  --ink-3:#93948B;
  --line:#E2DFD6;
  --accent:#0F766E;
  --accent-soft:#E3F0EE;
  --exam:#C2410C;
  --ok:#15803D;
  --no:#C0392B;
  --radius:10px;
  --shadow:0 1px 0 rgba(25,26,23,.05), 0 12px 26px -20px rgba(25,26,23,.6);
  --display:"Fraunces",Georgia,serif;
  --body:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}

.wrap{max-width:1060px;margin:0 auto;padding:0 20px 96px}
.masthead{padding:36px 0 18px;border-bottom:3px double var(--line);margin-bottom:26px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.masthead h1{font-size:clamp(32px,5vw,48px);font-weight:600;letter-spacing:-.01em}
.masthead .tagline{color:var(--ink-2);font-size:14px;margin:8px 0 0;max-width:50ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 12px;
  font-family:var(--mono);font-size:12px;white-space:nowrap}
.chip b{font-weight:500;color:var(--accent)}
.chip.err b{color:var(--no)}

.sect{margin:28px 0 10px;display:flex;align-items:baseline;gap:12px}
.sect h2{font-size:19px;font-weight:600}
.sect span{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.sect i{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.topic{cursor:pointer;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:0 18px 16px;box-shadow:var(--shadow);transition:.14s;border-top:3px solid var(--accent)}
.topic:hover{transform:translateY(-2px);border-color:#CFCBBF;border-top-color:var(--accent)}
.topic .tname{display:block;font-family:var(--display);font-size:18px;font-weight:600;margin:14px 0 5px}
.topic .tdesc{display:block;font-size:13px;color:var(--ink-2)}
.topic.alert{border-top-color:var(--no)}
.topic.exam{border-top-color:var(--exam)}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.back{background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink-2);
  text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.back:hover{color:var(--accent)}
.drill-title{font-size:clamp(22px,3.4vw,30px);font-weight:600}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mode{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:7px 14px;font-size:13px;transition:.12s}
.mode:hover{border-color:var(--ink-3)}
.mode[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mode.examtab[aria-selected="true"]{background:var(--exam);border-color:var(--exam)}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
.subbtn{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 11px;
  font-size:12.5px;color:var(--ink-2);transition:.12s}
.subbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.subbtn[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}
.sheet.exam{border-top:3px solid var(--exam)}
.qmeta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.qtext{font-family:var(--display);font-size:clamp(20px,2.8vw,26px);font-weight:500;line-height:1.4}
.qtext .en{font-style:italic}
.qtext .gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--line);text-align:center;color:var(--accent)}
.qsub{color:var(--ink-2);font-size:14px;margin-top:10px}

.answers{display:grid;gap:9px;margin-top:20px}
.opt{cursor:pointer;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:12px 15px;font-size:16px;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fff}
.opt.right{border-color:var(--ok);background:rgba(21,128,61,.07);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--no);background:rgba(192,57,43,.07);color:var(--no)}

.fields{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.field input{font:inherit;font-size:19px;width:250px;max-width:70vw;background:transparent;border:none;
  border-bottom:2px solid var(--line);padding:7px 2px}
.field input:focus{outline:none;border-bottom-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;
  padding:11px 20px;font-size:15px;font-weight:600;transition:.12s}
.btn:hover{background:#33352F}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.accent:hover{background:#0B5D57}
.btn.exam{background:var(--exam);border-color:var(--exam)}
.btn.exam:hover{background:#9A3412}

.verdict{margin-top:20px;padding:14px 16px;border-radius:6px;font-size:15px;display:none}
.verdict.show{display:block;animation:rise .18s ease-out}
.verdict.ok{background:rgba(21,128,61,.07);color:var(--ok);border:1px solid rgba(21,128,61,.3)}
.verdict.no{background:rgba(192,57,43,.06);color:var(--no);border:1px solid rgba(192,57,43,.3)}
.verdict.almost{background:rgba(194,65,12,.07);color:var(--exam);border:1px solid rgba(194,65,12,.3)}
.verdict b{font-family:var(--mono);font-weight:500}
.verdict .why{display:block;margin-top:7px;color:var(--ink-2);font-size:14px;line-height:1.6}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.slots{min-height:56px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 2px;margin-top:18px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.word{cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 13px;font-size:16px;transition:.12s}
.word:hover{border-color:var(--accent);background:#fff}
.slots .word{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots .empty{color:var(--ink-3);font-size:14px;font-style:italic}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.match .col{display:grid;gap:8px;align-content:start}
.mitem{cursor:pointer;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;font-size:14.5px;transition:.12s}
.mitem:hover:not([data-state="done"]){border-color:var(--ink-3)}
.mitem[data-state="sel"]{border-color:var(--accent);background:var(--accent-soft)}
.mitem[data-state="done"]{border-color:var(--ok);background:rgba(21,128,61,.07);color:var(--ok);cursor:default}
.mitem[data-state="miss"]{border-color:var(--no);background:rgba(192,57,43,.07)}

.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;cursor:pointer}
.flash .front{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:600}
.flash .back{font-size:20px;color:var(--accent);font-weight:600}
.flash .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.flash .extra{font-size:14px;color:var(--ink-2)}

.ref h3{font-size:20px;margin:28px 0 10px;font-weight:600}
.ref h3:first-child{margin-top:0}
.ref p{font-size:15px;color:var(--ink-2);margin:0 0 10px}
.ref .lead{font-size:16.5px;color:var(--ink);margin-bottom:16px;max-width:70ch}
.ref .rule{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:12px 14px;margin:12px 0;font-size:15px}
.ref .rule b{color:var(--ink)}
.ref .ex{font-size:15px;background:#fff;border:1px dashed var(--line);border-radius:6px;padding:11px 13px;margin:10px 0;line-height:1.85}
.ref .ex i{color:var(--accent);font-style:italic}
.ref ol.steps{counter-reset:st;list-style:none;padding:0;margin:14px 0}
.ref ol.steps li{position:relative;padding:2px 0 0 40px;margin:0 0 13px;font-size:15px}
.ref ol.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:25px;height:25px;
  border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;
  display:flex;align-items:center;justify-content:center}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0 14px}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tbl td.e{font-style:italic;color:var(--accent)}
.tbl td.f{font-family:var(--mono);font-size:13.5px}

.progress{display:flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pbar{flex:1;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.pbar.exam i{background:var(--exam)}

.exambar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.exambar .tag{background:rgba(194,65,12,.1);color:var(--exam);border-radius:4px;padding:3px 9px;font-weight:500}
.result{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
.note{font-family:var(--display);font-size:54px;font-weight:700;line-height:1;color:var(--exam)}
.result .meta{font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.9}
.review{border-top:1px solid var(--line);margin-top:10px}
.rev{padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rev .rq{font-weight:600;margin-bottom:5px}
.rev .ra{font-family:var(--mono);font-size:13px}
.rev .ra .mine{color:var(--no)}
.rev .ra .good{color:var(--ok)}
.rev.okrow .rq::before{content:"✓ ";color:var(--ok)}
.rev.norow .rq::before{content:"✗ ";color:var(--no)}
.rev .sol{color:var(--ink-2);font-size:13.5px;margin-top:5px;line-height:1.6}

.foot{margin-top:44px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);text-align:center}
@media (max-width:640px){
  .wrap{padding:0 14px 80px}
  .sheet{padding:20px 18px}
  .match{grid-template-columns:1fr}
  .field input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Zwei Zeiten unterscheiden ---------- */
.duelsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px;margin-top:22px}
.duelt{cursor:pointer;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:11px 13px;transition:.12s}
.duelt:hover{border-color:var(--accent);background:#fff}
.duelt[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent)}
.duelt .dn{display:block;font-weight:600;font-size:14.5px}
.duelt .dk{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin:3px 0 5px}
.duelt .db{display:block;font-size:13px;font-style:italic;color:var(--accent)}
.duelt[aria-selected="true"] .dk{color:var(--accent)}
.duelinfo{align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.subs .pair{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <p class="eyebrow">Wordbook · Grammar &amp; Tenses</p>
      <h1>Englisch üben</h1>
      <p class="tagline">Erklärungen auf Deutsch, Übungen auf Englisch — mit Zeitformen-Trainer, unregelmäßigen Verben und Klassenarbeitsmodus.</p>
    </div>
    <div class="chips">
      <span class="chip">Richtig <b id="statOk">0</b></span>
      <span class="chip">Aufgaben <b id="statAll">0</b></span>
      <span class="chip">Serie <b id="statStreak">0</b></span>
      <span class="chip err" id="errChip" hidden>Fehler <b id="statErr">0</b></span>
    </div>
  </header>

  <section id="home"><div id="topicGrid"></div></section>

  <section id="drill" hidden>
    <div class="bar">
      <button class="back" id="btnBack">← Alle Themen</button>
      <h2 class="drill-title" id="drillTitle"></h2>
    </div>
    <div class="modes" id="modeTabs" role="tablist"></div>
    <div class="subs" id="subTabs" hidden></div>
    <div id="stage"></div>
  </section>

  <p class="foot">Erklärungen auf Deutsch · Beispiele und Aufgaben auf Englisch</p>
</div>
<script>
/* ============================================================
   1. WERKZEUGE
   ============================================================ */
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(p => p[1]);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const en = s => `<span class="en">${s}</span>`;

/* Antwortprüfung: Groß-/Kleinschreibung und Satzzeichen egal,
   fehlender Apostroph zählt als „fast“. */
const normEn = s => String(s == null ? "" : s).toLowerCase()
  .replace(/[’‘´`]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;]+$/g, "");
const loose = s => normEn(s).replace(/['\-]/g, "");
function judge(input, accepted){
  if(!String(input || "").trim()) return "no";
  if(accepted.some(a => normEn(a) === normEn(input))) return "ok";
  if(accepted.some(a => loose(a) === loose(input))) return "almost";
  return "no";
}

/* ============================================================
   2. VERBEN — alle Formen gespeichert, damit nichts falsch abgeleitet wird
   ============================================================ */
const V = (inf,s,ing,past,pp,de,obj,irr) => ({inf,s,ing,past,pp,de,obj,irr:!!irr});
const VERBS = [
 V("go","goes","going","went","gone","gehen","to school",1),
 V("eat","eats","eating","ate","eaten","essen","pizza",1),
 V("drink","drinks","drinking","drank","drunk","trinken","tea",1),
 Object.assign(V("see","sees","seeing","saw","seen","sehen","that film",1),{stat:1}),
 V("take","takes","taking","took","taken","nehmen","the bus",1),
 V("write","writes","writing","wrote","written","schreiben","a letter",1),
 V("read","reads","reading","read","read","lesen","a book",1),
 V("buy","buys","buying","bought","bought","kaufen","new shoes",1),
 V("bring","brings","bringing","brought","brought","mitbringen","some food",1),
 V("think","thinks","thinking","thought","thought","denken","about it",1),
 V("teach","teaches","teaching","taught","taught","unterrichten","English",1),
 V("catch","catches","catching","caught","caught","fangen","the ball",1),
 V("speak","speaks","speaking","spoke","spoken","sprechen","English",1),
 V("break","breaks","breaking","broke","broken","zerbrechen","the window",1),
 V("choose","chooses","choosing","chose","chosen","wählen","a present",1),
 V("drive","drives","driving","drove","driven","fahren","to London",1),
 V("give","gives","giving","gave","given","geben","a present",1),
 Object.assign(V("know","knows","knowing","knew","known","wissen","the answer",1),{stat:1}),
 V("grow","grows","growing","grew","grown","wachsen","tomatoes",1),
 V("throw","throws","throwing","threw","thrown","werfen","the ball",1),
 V("fly","flies","flying","flew","flown","fliegen","to Spain",1),
 V("run","runs","running","ran","run","rennen","in the park",1),
 V("swim","swims","swimming","swam","swum","schwimmen","in the lake",1),
 V("sing","sings","singing","sang","sung","singen","a song",1),
 V("ring","rings","ringing","rang","rung","klingeln","the bell",1),
 V("begin","begins","beginning","began","begun","beginnen","the test",1),
 V("win","wins","winning","won","won","gewinnen","the game",1),
 V("find","finds","finding","found","found","finden","the keys",1),
 V("meet","meets","meeting","met","met","treffen","the others",1),
 V("leave","leaves","leaving","left","left","verlassen","the house",1),
 V("lose","loses","losing","lost","lost","verlieren","the match",1),
 V("send","sends","sending","sent","sent","schicken","an email",1),
 V("spend","spends","spending","spent","spent","verbringen","the weekend with friends",1),
 V("build","builds","building","built","built","bauen","a house",1),
 V("feel","feels","feeling","felt","felt","fühlen","better",1),
 V("keep","keeps","keeping","kept","kept","behalten","the money",1),
 V("sleep","sleeps","sleeping","slept","slept","schlafen","very well",1),
 V("tell","tells","telling","told","told","erzählen","a story",1),
 V("sell","sells","selling","sold","sold","verkaufen","old books",1),
 V("make","makes","making","made","made","machen","breakfast",1),
 V("do","does","doing","did","done","tun","the washing-up",1),
 V("have","has","having","had","had","haben","a shower",1),
 V("wear","wears","wearing","wore","worn","tragen","a jacket",1),
 V("forget","forgets","forgetting","forgot","forgotten","vergessen","the tickets",1),
 Object.assign(V("understand","understands","understanding","understood","understood","verstehen","the question",1),{stat:1}),
 V("play","plays","playing","played","played","spielen","football"),
 V("watch","watches","watching","watched","watched","anschauen","TV"),
 V("study","studies","studying","studied","studied","lernen","for the test"),
 V("live","lives","living","lived","lived","wohnen","in Berlin"),
 V("work","works","working","worked","worked","arbeiten","in a shop"),
 V("stop","stops","stopping","stopped","stopped","anhalten","the car"),
 V("try","tries","trying","tried","tried","versuchen","something new"),
 V("carry","carries","carrying","carried","carried","tragen","the bags"),
 V("visit","visits","visiting","visited","visited","besuchen","the museum"),
 V("clean","cleans","cleaning","cleaned","cleaned","putzen","the kitchen"),
 V("help","helps","helping","helped","helped","helfen","a friend"),
 V("open","opens","opening","opened","opened","öffnen","the door")
];
const IRREG = VERBS.filter(v => v.irr);

const SUBJ = [
 {w:"I",  be:"am", bp:"was",  have:"have", third:false},
 {w:"you",be:"are",bp:"were", have:"have", third:false},
 {w:"he", be:"is", bp:"was",  have:"has",  third:true},
 {w:"she",be:"is", bp:"was",  have:"has",  third:true},
 {w:"we", be:"are",bp:"were", have:"have", third:false},
 {w:"they",be:"are",bp:"were",have:"have", third:false},
 {w:"Tom",be:"is", bp:"was",  have:"has",  third:true},
 {w:"my sister",be:"is",bp:"was",have:"has",third:true},
 {w:"the boys",be:"are",bp:"were",have:"have",third:false}
];

/* ============================================================
   3. ZEITFORMEN-GENERATOR
   Baut aus Subjekt + Verb + Zeitangabe eine Lückensatz-Aufgabe.
   ============================================================ */
const TENSE = {
 present:   {label:"Simple Present",       time:["every day","every morning","on Mondays","twice a week","after school","at the weekend"],
             form:(s,v) => s.third ? v.s : v.inf,
             sol:(s,v) => `Simple Present: ${s.third ? "3. Person Singular, also mit -s → <b>"+v.s+"</b>" : "Grundform → <b>"+v.inf+"</b>"}`},
 progressive:{label:"Present Progressive", time:["at the moment","right now","today","Look!","Look!"],
             form:(s,v) => `${s.be} ${v.ing}`, alt:(s,v) => [`${s.w==="I"?"I'm":""} ${v.ing}`.trim()],
             sol:(s,v) => `Present Progressive: am/is/are + ing-Form → <b>${s.be} ${v.ing}</b>`},
 past:      {label:"Simple Past",          time:["yesterday","last week","two days ago","in 2019","last summer"],
             form:(s,v) => v.past,
             sol:(s,v) => `Simple Past: ${v.irr ? "unregelmäßig" : "regelmäßig mit -ed"} → <b>${v.past}</b>`},
 pastprog:  {label:"Past Progressive",     time:["at eight o'clock yesterday","all evening","when the phone rang","all morning"],
             form:(s,v) => `${s.bp} ${v.ing}`,
             sol:(s,v) => `Past Progressive: was/were + ing-Form → <b>${s.bp} ${v.ing}</b>`},
 perfect:   {label:"Present Perfect",      time:["","","","today","this week","twice","three times","before"],
             form:(s,v) => `${s.have} ${v.pp}`,
             sol:(s,v) => `Present Perfect: have/has + 3. Verbform → <b>${s.have} ${v.pp}</b>`},
 pastperf:  {label:"Past Perfect",         time:["before that","by then","the day before",""],
             form:(s,v) => `had ${v.pp}`,
             sol:(s,v) => `Past Perfect: had + 3. Verbform → <b>had ${v.pp}</b>`},
 will:      {label:"will-future",          time:["tomorrow","next year","in a few days","one day"],
             form:(s,v) => `will ${v.inf}`, alt:(s,v) => [`'ll ${v.inf}`],
             sol:(s,v) => `will-future: will + Grundform → <b>will ${v.inf}</b>`},
 goingto:   {label:"going to-future",      time:["next weekend","tonight","this evening"],
             form:(s,v) => `${s.be} going to ${v.inf}`,
             sol:(s,v) => `going to-future: am/is/are + going to + Grundform → <b>${s.be} going to ${v.inf}</b>`}
};
/* Nicht jedes Verb passt zu jeder Zeit: „The boys find the keys on Mondays"
   ist grammatisch richtig, aber inhaltlich Unsinn. Punktuelle Verben werden
   deshalb aus Gewohnheits- und Verlaufsformen herausgehalten. */
const NO_HAB  = ["find","lose","win","break","forget","catch","choose","begin","throw","send","grow","build","spend","keep","meet"];
const NO_PROG = ["find","lose","win","break","forget","catch","choose","begin","understand","know","see","keep"];
/* Verben, die keinen langen Zeitraum füllen können ("all evening") */
const NO_LONG = ["find","lose","win","break","forget","catch","choose","begin","send","throw","give","tell","leave","take","buy","meet","open","stop","put","see","know","understand"];
const DURATIV = v => !["find","lose","win","break","forget","catch","choose","begin","send","throw","give","tell"].includes(v.inf);

function genTense(id, only){
  const t = TENSE[id];
  const prog = ["progressive","pastprog"].includes(id);
  return {id:"form_"+id, label:t.label+" bilden", make(){
    let pool = only || VERBS;
    if(id === "present") pool = pool.filter(x => !NO_HAB.includes(x.inf));
    if(prog)             pool = pool.filter(x => !NO_PROG.includes(x.inf) && !x.stat);
    const s = pick(SUBJ), v = pick(pool);
    let tm = pick(t.time);
    if(id === "present" && v.stat) tm = "";                               // He knows the answer.
    if(prog && /^all /.test(tm) && NO_LONG.includes(v.inf)) tm = "when the phone rang";
    const form = t.form(s,v);
    const a = [form].concat(t.alt ? t.alt(s,v) : []);
    const S0 = s.w.charAt(0).toUpperCase()+s.w.slice(1);
    const sentence = /^(Look|Listen)!$/.test(tm)
      ? `${tm} ${S0} ___ (${v.inf}) ${v.obj}.`
      : `${S0} ___ (${v.inf}) ${v.obj}${tm ? " " + tm : ""}.`;
    return {t:"fill", q:en(sentence), label:"Verbform", hint:`${t.label} · ${v.de}`,
            a, sol:t.sol(s,v)};
  }};
}
const genIrreg = {id:"irregular", label:"Unregelmäßige Verben", make(){
  const v = pick(IRREG);
  return {t:"fields", q:`Wie lauten die zweite und dritte Form von ${en(v.inf)}?`, hint:v.de,
    fields:[{label:"Simple Past", a:[v.past]},{label:"Past Participle", a:[v.pp]}],
    sol:`${v.inf} — <b>${v.past}</b> — <b>${v.pp}</b>  (${v.de})`};
}};
const genIrregDe = {id:"irregular_de", label:"Verbformen auf Deutsch", make(){
  const v = pick(IRREG);
  return {t:"fill", q:`Wie heißt „${v.de}“ auf Englisch (Grundform)?`, label:"Infinitiv",
    a:[v.inf], sol:`<b>${v.inf}</b> — ${v.past} — ${v.pp}`};
}};

/* Steigerung von Adjektiven */
const ADJ = [
 ["big","bigger","biggest","groß"],["hot","hotter","hottest","heiß"],["thin","thinner","thinnest","dünn"],
 ["sad","sadder","saddest","traurig"],["fat","fatter","fattest","dick"],
 ["easy","easier","easiest","einfach"],["happy","happier","happiest","glücklich"],["funny","funnier","funniest","lustig"],
 ["early","earlier","earliest","früh"],["busy","busier","busiest","beschäftigt"],
 ["small","smaller","smallest","klein"],["cold","colder","coldest","kalt"],["young","younger","youngest","jung"],
 ["cheap","cheaper","cheapest","billig"],["fast","faster","fastest","schnell"],["long","longer","longest","lang"],
 ["expensive","more expensive","most expensive","teuer"],["interesting","more interesting","most interesting","interessant"],
 ["beautiful","more beautiful","most beautiful","schön"],["difficult","more difficult","most difficult","schwierig"],
 ["important","more important","most important","wichtig"],["popular","more popular","most popular","beliebt"],
 ["good","better","best","gut"],["bad","worse","worst","schlecht"],["far","farther","farthest","weit"],
 ["little","less","least","wenig"],["many","more","most","viele"]
];
const genComp = {id:"comparison", label:"Steigerung bilden", make(){
  const a = pick(ADJ);
  return {t:"fields", q:`Steigere ${en(a[0])}.`, hint:a[3],
    fields:[{label:"Comparative", a:[a[1], "the "+a[1]]},{label:"Superlative", a:[a[2], "the "+a[2]]}],
    sol:`${a[0]} — <b>${a[1]}</b> — <b>${a[2]}</b>${a[1].startsWith("more") ? " (lange Adjektive mit more/most)" : ""}`};
}};
</script>

T({id:"present", kat:"Zeitformen", title:"Simple Present", desc:"Gewohnheiten und Tatsachen — mit dem -s in der 3. Person.",
expl:`<p class="lead">Das Simple Present benutzt man für alles, was <b>regelmäßig</b> passiert oder <b>allgemein gilt</b> — nicht für das, was gerade jetzt geschieht.</p>
<h3>Wann?</h3>
<table class="tbl">
<tr><td>Gewohnheiten</td><td class="e">I get up at seven every morning.</td></tr>
<tr><td>Tatsachen</td><td class="e">Water boils at 100 degrees.</td></tr>
<tr><td>Fahrpläne</td><td class="e">The train leaves at 8.15.</td></tr>
</table>
<div class="rule"><b>Signalwörter:</b> always, often, usually, sometimes, never, every day, on Mondays.</div>
<h3>Die Form</h3>
<ol class="steps">
<li>Grundform des Verbs — bei <b>he, she, it</b> kommt ein <b>-s</b> dran: <i>he plays</i>.</li>
<li>Nach s, sh, ch, x, o wird es <b>-es</b>: <i>he watches, she goes, he does</i>.</li>
<li>Konsonant + y wird zu <b>-ies</b>: study → <i>studies</i>, fly → <i>flies</i>. Aber Vokal + y bleibt: play → <i>plays</i>.</li>
<li>Sonderformen: have → <b>has</b>, be → <b>is</b>.</li>
</ol>
<div class="rule"><b>He, she, it — das -s muss mit!</b> Das ist der häufigste Fehler überhaupt im Englischunterricht.</div>
<h3>Verneinung und Frage mit do/does</h3>
<div class="ex">Aussage: <i>She plays tennis.</i><br>
Verneinung: <i>She <b>doesn't play</b> tennis.</i><br>
Frage: <i><b>Does</b> she <b>play</b> tennis?</i></div>
<div class="rule"><b>Merke:</b> Wenn do/does im Satz steht, wandert das -s dorthin — das Hauptverb bleibt in der Grundform.
Nicht <i>doesn't plays</i>, sondern <i>doesn't play</i>.</div>`,
gens:[genTense("present")],
subs:{

  {t:"mc",q:`${en("My brother ___ football every Saturday.")}`,opts:["play","plays","playes","is play"],ai:1,
   sol:"my brother = he → Grundform + -s: <b>plays</b>."},
  {t:"mc",q:`${en("She ___ TV in the evening.")}`,opts:["watch","watchs","watches","watchies"],ai:2,
   sol:"Nach -ch kommt <b>-es</b>: watches. Genauso: goes, does, misses, fixes."},
  {t:"mc",q:`${en("Tom ___ hard for his tests.")}`,opts:["studys","studies","study","studyes"],ai:1,
   sol:"Konsonant + y wird zu -ies: study → <b>studies</b>. Aber play → plays (Vokal + y)."},

  {t:"mc",q:`${en("He ___ live in London.")}`,opts:["doesn't","don't","isn't","not"],ai:0,

  {t:"mc",q:"Welcher Satz ist richtig?",opts:["She doesn't likes tea.","She don't like tea.","She doesn't like tea.","She not likes tea."],ai:2,

 "Signalwörter":[

T({id:"progressive", kat:"Zeitformen", title:"Present Progressive", desc:"Was gerade jetzt passiert — und der Unterschied zum Simple Present.",
expl:`<p class="lead">Das Present Progressive (auch Present Continuous) beschreibt, was <b>gerade in diesem Moment</b> abläuft — oder was gerade vorübergehend gilt.</p>
<h3>Die Form</h3>
<div class="ex"><b>am / is / are + ing-Form</b><br>
<i>I am working. · He is working. · They are working.</i></div>
<ol class="steps">
<li>am bei <b>I</b>, is bei <b>he/she/it</b>, are bei <b>you/we/they</b>.</li>
<li>ing anhängen. Stummes -e fällt weg: make → <i>making</i>.</li>
<li>Kurzer betonter Vokal + einzelner Konsonant → Konsonant verdoppeln: sit → <i>sitting</i>, run → <i>running</i>, swim → <i>swimming</i>.</li>
<li>-ie wird zu -y: lie → <i>lying</i>.</li>
</ol>
<h3>Simple Present oder Progressive?</h3>
<table class="tbl">
<tr><th>Simple Present</th><th>Present Progressive</th></tr>
<tr><td>immer, regelmäßig</td><td>gerade jetzt, vorübergehend</td></tr>
<tr><td class="e">She works in a bank.</td><td class="e">She is working in the garden now.</td></tr>
<tr><td>always, often, every day</td><td>now, at the moment, Look!, Listen!</td></tr>
</table>
<div class="rule"><b>Verben, die kein Progressive bilden:</b> like, love, hate, want, need, know, understand, believe,
belong, see, hear. Sie beschreiben Zustände, keine Handlungen. Also nicht <i>I am knowing</i>, sondern <b>I know</b>.</div>`,
gens:[genTense("progressive")],

  {t:"mc",q:"Wie lautet die ing-Form von make?",opts:["makeing","makking","making","makings"],ai:2,
   sol:"Stummes -e fällt weg: <b>making</b>. Genauso: writing, having, coming."},
  {t:"fill",q:`${en("I ___ (do) my homework at the moment.")}`,a:["am doing","'m doing"],label:"Verbform",

 "Simple Present oder Progressive?":[

  {t:"mc",q:`${en("I ___ what you mean.")}`,opts:["am understanding","understand","understands","am understand"],ai:1,
   sol:"understand ist ein Zustandsverb und bildet kein Progressive: <b>I understand</b>."},
  {t:"mc",q:`${en("She ___ this song.")}`,opts:["is liking","likes","is like","like"],ai:1,
   sol:"like bildet kein Progressive → <b>likes</b>."},

T({id:"past", kat:"Zeitformen", title:"Simple Past", desc:"Abgeschlossene Handlungen in der Vergangenheit.",
expl:`<p class="lead">Das Simple Past beschreibt, was zu einem <b>bestimmten Zeitpunkt in der Vergangenheit</b> passiert ist — und jetzt abgeschlossen ist.</p>
<h3>Die Form</h3>
<ol class="steps">
<li>Regelmäßige Verben: Grundform + <b>-ed</b> — <i>work → worked</i>.</li>
<li>Endet das Verb auf -e, kommt nur ein -d dazu: <i>live → lived</i>.</li>
<li>Konsonant + y wird zu -ied: <i>study → studied</i>. Aber play → played.</li>
<li>Kurzer betonter Vokal + Konsonant → verdoppeln: <i>stop → stopped</i>.</li>
<li>Unregelmäßige Verben haben eigene Formen: go → <b>went</b>, see → <b>saw</b>, buy → <b>bought</b>.</li>
</ol>
<div class="rule"><b>Signalwörter:</b> yesterday, last week, two days ago, in 2019, when I was young.</div>
<h3>Verneinung und Frage mit did</h3>
<div class="ex">Aussage: <i>She went to London.</i><br>
Verneinung: <i>She <b>didn't go</b> to London.</i><br>
Frage: <i><b>Did</b> she <b>go</b> to London?</i></div>
<div class="rule"><b>Achtung:</b> Sobald did im Satz steht, steht das Hauptverb in der <b>Grundform</b>.
Nicht <i>didn't went</i>, sondern <b>didn't go</b>. Die Vergangenheit steckt bereits in did.</div>`,
gens:[genTense("past")],
subs:{

  {t:"mc",q:"Wie lautet das Simple Past von stop?",opts:["stoped","stopped","stopt","stopped up"],ai:1,

  {t:"mc",q:"Wie lautet das Simple Past von carry?",opts:["carryed","carried","carreid","carryd"],ai:1,

   sol:"<i>I didn't see him yesterday.</i> — deutsches Perfekt, aber mit „gestern“ → Simple Past."}],
 "Unregelmäßige Verben":[
  {t:"mc",q:`${en("He ___ a new phone last week.")}`,opts:["buyed","bought","buys","did bought"],ai:1,
   sol:"buy — <b>bought</b> — bought."},
  {t:"mc",q:`${en("I ___ my keys this morning.")}`,opts:["losed","lost","loosed","lose"],ai:1,
   sol:"lose — <b>lost</b> — lost."},
  {t:"card",front:"go · see · take · come",back:"went · saw · took · came",

T({id:"pastprog", kat:"Zeitformen", title:"Past Progressive", desc:"Was gerade lief, als etwas anderes passierte.",
expl:`<p class="lead">Das Past Progressive beschreibt eine Handlung, die in der Vergangenheit <b>gerade im Gange war</b>. Meistens bildet es den Hintergrund für ein anderes Ereignis.</p>
<h3>Die Form</h3>
<div class="ex"><b>was / were + ing-Form</b><br>
<i>I was reading. · You were reading. · She was reading. · They were reading.</i></div>
<h3>Das typische Zusammenspiel</h3>
<div class="rule">Die <b>längere</b> Handlung im Hintergrund steht im Past Progressive, das <b>kurze</b> Ereignis, das dazwischenkommt,
im Simple Past:<br>
<i>I <b>was watching</b> TV when the phone <b>rang</b>.</i></div>
<ol class="steps">
<li><b>while</b> leitet meistens die lange Handlung ein → Past Progressive.</li>
<li><b>when</b> leitet meistens das kurze Ereignis ein → Simple Past.</li>
<li>Laufen zwei Handlungen gleichzeitig, stehen beide im Past Progressive:
<i>While I was cooking, she was setting the table.</i></li>
</ol>
<div class="rule">Auch hier gilt: Zustandsverben wie know, like, want bilden kein Progressive.</div>`,

T({id:"perfect", kat:"Zeitformen", title:"Present Perfect", desc:"Vergangenheit mit Bezug zur Gegenwart — und der Unterschied zum Simple Past.",
expl:`<p class="lead">Das Present Perfect verbindet Vergangenheit und Gegenwart: Etwas ist passiert, aber <b>wann</b> ist unwichtig — wichtig ist das Ergebnis <b>jetzt</b>.</p>
<h3>Die Form</h3>
<div class="ex"><b>have / has + 3. Verbform (past participle)</b><br>
<i>I have seen it. · She has seen it.</i> — Kurzformen: <i>I've, she's</i></div>
<h3>Wann?</h3>
<table class="tbl">
<tr><td>Ergebnis zählt jetzt</td><td class="e">I have lost my keys. (Ich habe sie immer noch nicht.)</td></tr>
<tr><td>Erfahrungen ohne Zeitangabe</td><td class="e">Have you ever been to London?</td></tr>
<tr><td>Etwas, das noch andauert</td><td class="e">We have lived here since 2020.</td></tr>
</table>
<div class="rule"><b>Signalwörter:</b> just, already, yet, ever, never, so far, recently, since, for.</div>
<h3>since oder for?</h3>
<div class="ex"><b>since</b> + Zeit<u>punkt</u>: since 2020, since Monday, since I was six<br>
<b>for</b> + Zeit<u>raum</u>: for two years, for a week, for ages</div>
<h3>Present Perfect oder Simple Past?</h3>
<div class="rule">Die Entscheidung hängt an einer einzigen Frage: <b>Steht eine abgeschlossene Zeitangabe im Satz?</b><br>
<i>I <b>have seen</b> that film.</i> (wann, ist egal)<br>
<i>I <b>saw</b> that film <u>yesterday</u>.</i> (yesterday → Simple Past)<br>
Sobald yesterday, last week, in 2019 oder ago auftaucht, ist Simple Past Pflicht.</div>
<div class="rule"><b>Vorsicht, Falle:</b> Das deutsche Perfekt ist <u>keine</u> Übersetzungshilfe.
„Ich habe ihn gestern gesehen“ heißt <i>I saw him yesterday</i>.</div>`,
gens:[genTense("perfect")],
subs:{
 "Bildung":[

T({id:"perfectprog", kat:"Zeitformen", title:"Present Perfect Progressive", desc:"Wie lange etwas schon läuft.",
expl:`<p class="lead">Diese Form betont, dass eine Handlung <b>schon eine Weile andauert</b> — und meistens noch nicht zu Ende ist.</p>
<h3>Die Form</h3>
<div class="ex"><b>have / has been + ing-Form</b><br><i>I have been waiting for an hour.</i></div>
<h3>Unterschied zum Present Perfect</h3>
<table class="tbl">
<tr><th>Present Perfect</th><th>Present Perfect Progressive</th></tr>
<tr><td>Das <b>Ergebnis</b> zählt</td><td>Die <b>Dauer</b> zählt</td></tr>
<tr><td class="e">I have written three emails.</td><td class="e">I have been writing emails all morning.</td></tr>
<tr><td>Wie viele? Was ist fertig?</td><td>Wie lange schon?</td></tr>
</table>
<div class="rule"><b>Typische Frage:</b> <i>How long have you been learning English?</i><br>
<b>Signalwörter:</b> how long, all day, since, for, lately.</div>
<div class="rule">Zustandsverben (know, like, be, have im Sinne von besitzen) benutzt man auch hier nicht im Progressive:
<i>I have known her for years</i> — nicht <i>I have been knowing</i>.</div>`,
subs:{
 "Bildung & Gebrauch":[
  {t:"mc",q:`${en("I ___ for you for two hours!")}`,opts:["have waited","have been waiting","am waiting","was waiting"],ai:1,
   sol:"Die Dauer wird betont → <b>have been waiting</b>."},
  {t:"mc",q:`${en("How long ___ you ___ English?")}`,opts:["have / learned","have / been learning","did / learn","are / learning"],ai:1,
   sol:"How long fragt nach der Dauer → <b>have you been learning</b>."},
  {t:"mc",q:`${en("She ___ three cakes for the party.")}`,opts:["has been baking","has baked","is baking","bakes"],ai:1,
   sol:"Eine feste Anzahl (three cakes) → Ergebnis zählt → <b>has baked</b>."},
  {t:"fill",q:`${en("It ___ (rain) all day.")}`,a:["has been raining","'s been raining"],label:"Verbform",
   sol:"all day betont die Dauer → <b>has been raining</b>."},
  {t:"trans",q:"Wir warten schon seit einer Stunde.",a:["we have been waiting for an hour","we've been waiting for an hour"],
   sol:"<i>We have been waiting for an hour.</i>"}]}});

T({id:"pastperf", kat:"Zeitformen", title:"Past Perfect", desc:"Die Vorvergangenheit — was noch davor passiert war.",
expl:`<p class="lead">Erzählt man von etwas Vergangenem und will sagen, was <b>noch davor</b> geschehen war, braucht man das Past Perfect.</p>
<h3>Die Form</h3>
<div class="ex"><b>had + 3. Verbform</b> — für alle Personen gleich<br><i>I had left. · She had left. · They had left.</i></div>
<h3>Der Zeitstrahl</h3>
<div class="rule"><i>When I <b>arrived</b> at the station, the train <b>had already left</b>.</i><br>
Zuerst fuhr der Zug ab (Past Perfect), danach kam ich an (Simple Past). Die frühere Handlung bekommt <b>had</b>.</div>
<ol class="steps">
<li>Zwei Ereignisse in der Vergangenheit erkennen.</li>
<li>Welches war zuerst? Dieses steht im <b>Past Perfect</b>.</li>
<li>Das spätere steht im <b>Simple Past</b>.</li>
</ol>
<div class="rule"><b>Signalwörter:</b> already, just, before, after, by the time, when.<br>
Auch in der indirekten Rede wird aus dem Simple Past ein Past Perfect.</div>`,
gens:[genTense("pastperf")],
subs:{
 "Bildung & Zeitfolge":[
  {t:"mc",q:`${en("When we arrived, the film ___ already ___ .")}`,opts:["has / started","had / started","was / starting","did / start"],ai:1,
   sol:"Der Film begann zuerst → <b>had started</b>."},
  {t:"mc",q:`${en("She ___ the book before she saw the film.")}`,opts:["read","has read","had read","was reading"],ai:2,
   sol:"before zeigt die frühere Handlung an → <b>had read</b>."},
  {t:"mc",q:`${en("After he ___ his homework, he went out.")}`,opts:["finished","had finished","has finished","was finishing"],ai:1,
   sol:"Zuerst fertig, danach raus → <b>had finished</b>."},
  {t:"fill",q:`${en("I couldn't get in because I ___ (lose) my key.")}`,a:["had lost","'d lost"],label:"Verbform",
   sol:"Der Schlüsselverlust war vorher → <b>had lost</b>."},
  {t:"trans",q:"Der Zug war schon abgefahren, als wir ankamen.",
   a:["the train had already left when we arrived","the train had already gone when we arrived"],
   sol:"<i>The train had already left when we arrived.</i>"}]}});

T({id:"future", kat:"Zeitformen", title:"Zukunft: will & going to", desc:"Drei Wege, über die Zukunft zu sprechen.",
expl:`<p class="lead">Englisch hat kein einzelnes Futur. Welche Form du nimmst, hängt davon ab, <b>warum</b> du über die Zukunft sprichst.</p>
<table class="tbl">
<tr><th>Form</th><th>Wofür</th><th>Beispiel</th></tr>
<tr><td class="f">will + Grundform</td><td>spontane Entscheidung, Vorhersage, Versprechen</td><td class="e">I'll help you. · It will rain tomorrow.</td></tr>
<tr><td class="f">going to + Grundform</td><td>feste Absicht, oder es gibt Anzeichen dafür</td><td class="e">I'm going to buy a car. · Look at those clouds — it's going to rain.</td></tr>
<tr><td class="f">Present Progressive</td><td>fest verabredeter Termin</td><td class="e">I'm meeting Tom at six.</td></tr>
</table>
<h3>will oder going to?</h3>
<ol class="steps">
<li>Hast du dich <b>gerade eben</b> entschieden? → will. <i>The phone is ringing. — I'll get it.</i></li>
<li>Hast du es <b>schon vorher</b> geplant? → going to. <i>I'm going to visit my aunt next week.</i></li>
<li>Gibt es <b>sichtbare Anzeichen</b>? → going to. <i>She's going to have a baby.</i></li>
<li>Ist es eine reine <b>Vorhersage</b> ohne Beweis? → will. <i>I think our team will win.</i></li>
</ol>
<div class="rule"><b>Nach if und when steht kein will!</b> Dort kommt das Simple Present:
<i>If it <b>rains</b>, we'll stay at home.</i></div>`,
gens:[genTense("will"), genTense("goingto")],
subs:{
 "will":[
  {t:"mc",q:`${en("The phone is ringing! — Don't worry, I ___ it.")}`,opts:["get","am getting","will get","am going to get"],ai:2,
   sol:"Spontane Entscheidung → <b>will get</b>."},
  {t:"mc",q:`${en("I think our team ___ the match.")}`,opts:["is winning","will win","is going to win","wins"],ai:1,
   sol:"Vermutung mit I think → <b>will win</b>."},
  {t:"order",de:"Ich verspreche, dass ich dir helfen werde.",a:["I","promise","I","will","help","you"],end:"."}],
 "going to":[
  {t:"mc",q:`${en("Look at those clouds! It ___ .")}`,opts:["will rain","is going to rain","rains","is raining"],ai:1,
   sol:"Sichtbare Anzeichen → <b>is going to rain</b>."},
  {t:"mc",q:`${en("We ___ a new car next month — we've already chosen one.")}`,opts:["will buy","are buying","are going to buy","buy"],ai:2,
   sol:"Feste Absicht, vorher geplant → <b>are going to buy</b>."},
  {t:"trans",q:"Ich werde nächstes Jahr Spanisch lernen.",
   a:["i'm going to learn spanish next year","i am going to learn spanish next year","i will learn spanish next year"],
   sol:"<i>I'm going to learn Spanish next year.</i> — Absicht, also going to."}],
 "if & when":[
  {t:"mc",q:`${en("If it ___ tomorrow, we'll stay at home.")}`,opts:["will rain","rains","is raining","would rain"],ai:1,
   sol:"Nach if steht kein will → <b>rains</b>."},
  {t:"mc",q:`${en("I'll call you when I ___ home.")}`,opts:["will get","get","am getting","got"],ai:1,
   sol:"Nach when (Zeitangabe) steht das Simple Present → <b>get</b>."},
  {t:"card",front:"Nach if und when …",back:"… steht nie will, sondern das Simple Present.",

T({id:"tensemix", kat:"Zeitformen", title:"Zeitformen gemischt", desc:"Alle Zeiten durcheinander — wie in der Klassenarbeit.",
expl:`<p class="lead">In der Klassenarbeit steht selten dabei, welche Zeit gemeint ist. Du erkennst sie an den <b>Signalwörtern</b> und am Zusammenhang.</p>
<table class="tbl">
<tr><th>Signalwort</th><th>Zeit</th></tr>
<tr><td class="f">always, every day, usually</td><td>Simple Present</td></tr>
<tr><td class="f">now, at the moment, Look!</td><td>Present Progressive</td></tr>
<tr><td class="f">yesterday, last week, ago, in 2019</td><td>Simple Past</td></tr>
<tr><td class="f">while, when (lange Handlung)</td><td>Past Progressive</td></tr>
<tr><td class="f">just, already, yet, ever, never, since, for</td><td>Present Perfect</td></tr>
<tr><td class="f">how long … ?, all day</td><td>Present Perfect Progressive</td></tr>
<tr><td class="f">before, after, by the time (frühere Handlung)</td><td>Past Perfect</td></tr>
<tr><td class="f">tomorrow, next week</td><td>will / going to</td></tr>
</table>
<div class="rule"><b>Drei Prüffragen, die fast immer reichen:</b><br>
1. Steht eine abgeschlossene Zeitangabe da (yesterday, last …, ago)? → Simple Past.<br>
2. Geht es um jetzt gerade? → Progressive.<br>
3. Zählt das Ergebnis für die Gegenwart, ohne Zeitpunkt? → Present Perfect.</div>`,
gens:[genTense("present"),genTense("progressive"),genTense("past"),genTense("pastprog"),

T({id:"irregular", kat:"Grammatik", title:"Unregelmäßige Verben", desc:"Die drei Formen — endlos abgefragt.",
expl:`<p class="lead">Etwa 180 englische Verben bilden ihre Vergangenheit nicht mit -ed. Man lernt sie in drei Formen, weil man alle drei braucht.</p>
<table class="tbl">
<tr><th>1. Form</th><th>2. Form</th><th>3. Form</th></tr>
<tr><td>Infinitiv</td><td>Simple Past</td><td>Past Participle</td></tr>
<tr><td class="e">go</td><td class="e">went</td><td class="e">gone</td></tr>
</table>
<div class="rule"><b>Wofür welche Form?</b><br>
1. Form: Grundform, nach to, nach will, nach do/does/did, nach Modalverben.<br>
2. Form: Simple Past.<br>
3. Form: Present Perfect, Past Perfect und Passiv.</div>
<h3>Gruppen, die das Lernen erleichtern</h3>
<table class="tbl">
<tr><td class="f">alle drei gleich</td><td class="e">cut – cut – cut · put – put – put · let – let – let · read – read – read</td></tr>
<tr><td class="f">2. und 3. gleich</td><td class="e">buy – bought – bought · think – thought – thought · make – made – made</td></tr>
<tr><td class="f">i – a – u</td><td class="e">sing – sang – sung · drink – drank – drunk · begin – began – begun</td></tr>
<tr><td class="f">alle drei verschieden</td><td class="e">write – wrote – written · speak – spoke – spoken · take – took – taken</td></tr>
</table>
<div class="rule"><b>read</b> ist die fieseste: geschrieben immer gleich, gesprochen [riːd] – [red] – [red].</div>`,
gens:[genIrreg, genIrregDe],
subs:{
 "Formen zuordnen":[
  {t:"mc",q:"Welche Reihe ist richtig?",opts:["swim – swam – swum","swim – swum – swam","swim – swimmed – swum","swim – swam – swam"],ai:0,
   sol:"<b>swim – swam – swum</b>, wie sing – sang – sung."},
  {t:"mc",q:"Welche Reihe ist richtig?",opts:["write – wrote – wrote","write – writed – written","write – wrote – written","write – wrought – written"],ai:2,
   sol:"<b>write – wrote – written</b>."},
  {t:"match",title:"Simple Past finden",pairs:[["think","thought"],["catch","caught"],["teach","taught"],["bring","brought"],["fight","fought"],["buy","bought"]]},
  {t:"match",title:"Past Participle finden",pairs:[["speak","spoken"],["break","broken"],["choose","chosen"],["drive","driven"],["give","given"],["take","taken"]]}]}});

T({id:"modals", kat:"Grammatik", title:"Modalverben & Ersatzformen", desc:"can, must, should — und was man in anderen Zeiten sagt.",
expl:`<p class="lead">Modalverben verändern die Aussage eines Satzes: Sie sagen, ob etwas möglich, nötig oder erlaubt ist.</p>
<h3>Die Regeln für alle Modalverben</h3>
<ol class="steps">
<li>Kein <b>-s</b> in der 3. Person: <i>he can</i>, nicht <i>he cans</i>.</li>
<li>Danach folgt die <b>Grundform ohne to</b>: <i>She must go.</i></li>
<li>Frage und Verneinung <b>ohne do</b>: <i>Can you swim? · He can't swim.</i></li>
</ol>
<h3>Bedeutungen</h3>
<table class="tbl">
<tr><td class="f">can</td><td>können, dürfen</td><td class="f">must</td><td>müssen</td></tr>
<tr><td class="f">may</td><td>dürfen, könnte sein</td><td class="f">mustn't</td><td>nicht dürfen (Verbot)</td></tr>
<tr><td class="f">should</td><td>sollte (Rat)</td><td class="f">needn't</td><td>nicht müssen</td></tr>
</table>
<div class="rule"><b>Die klassische Falle:</b> <i>mustn't</i> heißt <u>nicht</u> „nicht müssen“, sondern <b>„nicht dürfen“</b>.<br>
<i>You mustn't smoke here.</i> = Du darfst hier nicht rauchen.<br>
<i>You needn't come.</i> / <i>You don't have to come.</i> = Du musst nicht kommen.</div>
<h3>Ersatzformen</h3>
<p>Modalverben haben keine eigenen Formen für alle Zeiten. Dafür gibt es Ersatzformen:</p>
<table class="tbl">
<tr><th></th><th>Gegenwart</th><th>Vergangenheit</th><th>Zukunft</th></tr>
<tr><td>können</td><td class="e">can</td><td class="e">could / was able to</td><td class="e">will be able to</td></tr>
<tr><td>müssen</td><td class="e">must / have to</td><td class="e">had to</td><td class="e">will have to</td></tr>
<tr><td>dürfen</td><td class="e">may / be allowed to</td><td class="e">was allowed to</td><td class="e">will be allowed to</td></tr>
</table>`,
subs:{
 "Bedeutung":[
  {t:"mc",q:`${en("You ___ smoke here — it's forbidden.")}`,opts:["needn't","mustn't","don't have to","shouldn't have"],ai:1,
   sol:"Verbot → <b>mustn't</b>."},
  {t:"mc",q:`${en("You ___ come if you don't want to.")}`,opts:["mustn't","needn't","can't","may not"],ai:1,
   sol:"„nicht müssen“ → <b>needn't</b> oder don't have to."},
  {t:"mc",q:`${en("You look tired. You ___ go to bed earlier.")}`,opts:["should","must","may","can"],ai:0,
   sol:"Rat → <b>should</b>."},
  {t:"mc",q:`${en("___ I open the window?")}`,opts:["Must","May","Should have","Am I able"],ai:1,
   sol:"Höfliche Bitte um Erlaubnis → <b>May I …?</b> (auch Can I …?)"}],
 "Form & Ersatzformen":[
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["He cans swim.","He can swims.","He can swim.","He can to swim."],ai:2,
   sol:"Kein -s, kein to: <b>He can swim.</b>"},
  {t:"mc",q:`${en("Yesterday I ___ stay at home because I was ill.")}`,opts:["must","had to","have to","musted"],ai:1,
   sol:"must hat keine Vergangenheit → <b>had to</b>."},
  {t:"mc",q:`${en("Next year she ___ drive a car.")}`,opts:["will can","can will","will be able to","cans"],ai:2,
   sol:"Zukunft von can → <b>will be able to</b>."},
  {t:"trans",q:"Ich musste gestern lange arbeiten.",a:["i had to work late yesterday","i had to work a long time yesterday"],
   sol:"<i>I had to work late yesterday.</i>"},
  {t:"card",front:"mustn't vs. needn't",back:"mustn't = nicht dürfen · needn't = nicht müssen",
   extra:"You mustn't tell him. (Verbot) — You needn't tell him. (nicht nötig)"}]}});

T({id:"conditional", kat:"Grammatik", title:"If-Sätze", desc:"Typ 1, 2 und 3 sicher auseinanderhalten.",
expl:`<p class="lead">If-Sätze bestehen immer aus zwei Teilen: der Bedingung (if-Satz) und der Folge. Der Typ hängt davon ab, wie wahrscheinlich die Sache ist.</p>
<table class="tbl">
<tr><th>Typ</th><th>if-Satz</th><th>Hauptsatz</th><th>Bedeutung</th></tr>
<tr><td class="f">I</td><td class="e">Simple Present</td><td class="e">will + Grundform</td><td>möglich, realistisch</td></tr>
<tr><td class="f">II</td><td class="e">Simple Past</td><td class="e">would + Grundform</td><td>unwahrscheinlich, gedacht</td></tr>
<tr><td class="f">III</td><td class="e">Past Perfect</td><td class="e">would have + 3. Form</td><td>zu spät, Vergangenheit</td></tr>
</table>
<div class="ex">I: <i>If it <b>rains</b>, we <b>will stay</b> at home.</i><br>
II: <i>If I <b>had</b> more time, I <b>would visit</b> you.</i><br>
III: <i>If I <b>had known</b>, I <b>would have helped</b> you.</i></div>
<h3>So gehst du vor</h3>
<ol class="steps">
<li>Frage dich: Kann das noch passieren? → Typ I.</li>
<li>Ist es gedacht oder unwahrscheinlich? → Typ II.</li>
<li>Ist es vorbei und nicht mehr zu ändern? → Typ III.</li>
<li>Dann die passenden Formen einsetzen — der if-Satz bekommt <u>nie</u> will oder would.</li>
</ol>
<div class="rule"><b>Die Regel, die alles rettet:</b> Im if-Satz steht nie <i>will</i> und nie <i>would</i>.<br>
Nicht <i>If I will have time</i>, sondern <b>If I have time</b>.</div>
<div class="rule">Steht der if-Satz vorne, kommt ein Komma. Steht er hinten, nicht:
<i>If I see him, I'll tell him.</i> — <i>I'll tell him if I see him.</i></div>`,
subs:{
 "Typ I":[
  {t:"mc",q:`${en("If the weather ___ nice, we will go to the beach.")}`,opts:["will be","is","would be","was"],ai:1,
   sol:"Typ I: if + Simple Present → <b>is</b>."},
  {t:"mc",q:`${en("If you don't hurry, you ___ the bus.")}`,opts:["miss","will miss","would miss","missed"],ai:1,
   sol:"Folge im Typ I → <b>will miss</b>."},
  {t:"trans",q:"Wenn ich Zeit habe, helfe ich dir.",a:["if i have time, i will help you","if i have time i will help you","if i have time, i'll help you","if i have time i'll help you"],
   sol:"<i>If I have time, I will help you.</i>"}],
 "Typ II":[
  {t:"mc",q:`${en("If I ___ rich, I would travel around the world.")}`,opts:["am","was","were","will be"],ai:2,
   sol:"Typ II mit be → <b>were</b> für alle Personen (If I were you …). was gilt umgangssprachlich, were ist die Schulform."},
  {t:"mc",q:`${en("If we had a car, we ___ to the mountains.")}`,opts:["will drive","would drive","drove","would have driven"],ai:1,
   sol:"Typ II: <b>would drive</b>."},
  {t:"trans",q:"Wenn ich du wäre, würde ich ihn fragen.",a:["if i were you, i would ask him","if i were you i would ask him","if i were you, i'd ask him"],
   sol:"<i>If I were you, I would ask him.</i>"}],
 "Typ III":[
  {t:"mc",q:`${en("If I ___ about the test, I would have learned more.")}`,opts:["knew","had known","would know","have known"],ai:1,
   sol:"Typ III: if + Past Perfect → <b>had known</b>."},
  {t:"mc",q:`${en("If she had left earlier, she ___ the train.")}`,opts:["would catch","would have caught","had caught","catches"],ai:1,
   sol:"Folge im Typ III → <b>would have caught</b>."},
  {t:"mc",q:"Welcher Satz ist falsch?",opts:["If I have time, I'll come.","If I had time, I would come.","If I would have time, I would come.","If I had had time, I would have come."],ai:2,
   sol:"Im if-Satz steht nie would: <b>If I would have time</b> ist falsch."}]}});

T({id:"passive", kat:"Grammatik", title:"Passiv", desc:"Wenn wichtig ist, was passiert — nicht wer es tut.",
expl:`<p class="lead">Im Aktiv steht im Mittelpunkt, <b>wer</b> handelt. Im Passiv steht im Mittelpunkt, <b>was</b> mit etwas geschieht.</p>
<h3>Die Form</h3>
<div class="ex"><b>form of be + 3. Verbform (past participle)</b><br>
<i>The house <b>is built</b>. · The house <b>was built</b>. · The house <b>has been built</b>. · The house <b>will be built</b>.</i></div>
<h3>Vom Aktiv zum Passiv</h3>
<ol class="steps">
<li>Das <b>Objekt</b> des Aktivsatzes wird zum <b>Subjekt</b>.</li>
<li>Das Verb wird zu <b>be + 3. Form</b> — in derselben Zeit wie vorher.</li>
<li>Wer es tut, hängt man mit <b>by</b> hinten an — oder lässt es weg.</li>
</ol>
<div class="ex">Aktiv: <i>Shakespeare wrote this play.</i><br>Passiv: <i>This play <b>was written</b> by Shakespeare.</i></div>
<h3>Die Zeit steckt im be</h3>
<table class="tbl">
<tr><td>Simple Present</td><td class="e">is / are done</td></tr>
<tr><td>Simple Past</td><td class="e">was / were done</td></tr>
<tr><td>Present Perfect</td><td class="e">has / have been done</td></tr>
<tr><td>will-future</td><td class="e">will be done</td></tr>
<tr><td>mit Modalverb</td><td class="e">must / can be done</td></tr>
</table>
<div class="rule"><b>Zwei Objekte, zwei Passivsätze:</b> Aus <i>They gave me a present</i> wird entweder
<i>I was given a present</i> oder <i>A present was given to me</i>. Die Personenvariante ist im Englischen die üblichere.</div>`,
subs:{
 "Bildung":[
  {t:"mc",q:`${en("The rooms ___ every day.")}`,opts:["are cleaned","is cleaned","are cleaning","clean"],ai:0,
   sol:"Plural + Simple Present → <b>are cleaned</b>."},
  {t:"mc",q:`${en("This bridge ___ in 1890.")}`,opts:["is built","was built","has built","was build"],ai:1,
   sol:"1890 → Simple Past Passiv: <b>was built</b>. Achtung: 3. Form built, nicht build."},
  {t:"mc",q:`${en("The letters ___ already ___ .")}`,opts:["have / sent","have / been sent","are / been sent","has / been sent"],ai:1,
   sol:"Present Perfect Passiv: <b>have been sent</b>."},
  {t:"mc",q:`${en("The work ___ tomorrow.")}`,opts:["will finished","will be finished","is finish","will being finished"],ai:1,
   sol:"will-future Passiv: <b>will be finished</b>."}],
 "Umformen":[
  {t:"mc",q:"Aktiv: They speak English here. → Passiv:",opts:["English is spoken here.","English speaks here.","English was spoken here.","English is speaking here."],ai:0,
   sol:"<b>English is spoken here.</b>"},
  {t:"order",de:"Das Auto wurde letzte Woche repariert.",a:["The","car","was","repaired","last","week"],end:"."},
  {t:"trans",q:"Diese Bücher wurden von Kindern geschrieben.",a:["these books were written by children"],
   sol:"<i>These books were written by children.</i>"},
  {t:"trans",q:"Mir wurde ein Buch geschenkt.",a:["i was given a book","a book was given to me"],
   sol:"<i>I was given a book.</i> — im Englischen kann die Person Subjekt des Passivsatzes werden."}]}});

T({id:"reported", kat:"Grammatik", title:"Indirekte Rede", desc:"Wiedergeben, was jemand gesagt hat.",
expl:`<p class="lead">Gibt man wieder, was jemand gesagt hat, ändern sich drei Dinge: die <b>Zeit</b>, die <b>Personen</b> und die <b>Zeitangaben</b>.</p>
<h3>Der Backshift</h3>
<div class="rule">Steht das einleitende Verb in der Vergangenheit (<i>he said, she told me</i>), rutschen alle Zeiten eine Stufe zurück:</div>
<table class="tbl">
<tr><th>direkte Rede</th><th>indirekte Rede</th></tr>
<tr><td class="e">Simple Present</td><td class="e">Simple Past</td></tr>
<tr><td class="e">Present Progressive</td><td class="e">Past Progressive</td></tr>
<tr><td class="e">Simple Past / Present Perfect</td><td class="e">Past Perfect</td></tr>
<tr><td class="e">will</td><td class="e">would</td></tr>
<tr><td class="e">can</td><td class="e">could</td></tr>
<tr><td class="e">must</td><td class="e">had to</td></tr>
</table>
<div class="ex"><i>"I <b>am</b> tired."</i> → <i>He said he <b>was</b> tired.</i><br>
<i>"I <b>will</b> come."</i> → <i>She said she <b>would</b> come.</i></div>
<h3>Fragen und Aufforderungen</h3>
<ol class="steps">
<li><b>Ja/Nein-Frage</b> → mit <b>if</b> oder <b>whether</b>: <i>He asked <b>if</b> I was ready.</i></li>
<li><b>Frage mit Fragewort</b> → Fragewort bleibt: <i>She asked <b>where</b> I lived.</i></li>
<li>In beiden Fällen: <b>keine Frageform mehr</b> — kein do/does/did, keine Umstellung, kein Fragezeichen.</li>
<li><b>Aufforderung</b> → <b>to + Grundform</b>: <i>"Wait!" → He told me <b>to wait</b>.</i> Verneint: <i>not to wait</i>.</li>
</ol>
<h3>Zeit- und Ortsangaben</h3>
<div class="ex">now → then · today → that day · yesterday → the day before · tomorrow → the next day · here → there · this → that</div>`,
subs:{
 "Backshift":[
  {t:"mc",q:`${en('"I am hungry." → He said he ___ hungry.')}`,opts:["is","was","has been","would be"],ai:1,
   sol:"Simple Present wird zu Simple Past → <b>was</b>."},
  {t:"mc",q:`${en('"I have finished." → She said she ___ .')}`,opts:["has finished","had finished","finished","would finish"],ai:1,
   sol:"Present Perfect wird zu Past Perfect → <b>had finished</b>."},
  {t:"mc",q:`${en('"We will help you." → They said they ___ help me.')}`,opts:["will","would","had","could"],ai:1,
   sol:"will wird zu <b>would</b>."},
  {t:"mc",q:`${en('"I saw him yesterday." → He said he had seen him ___ .')}`,opts:["yesterday","the day before","that day","tomorrow"],ai:1,
   sol:"yesterday wird zu <b>the day before</b>."}],
 "Fragen & Aufforderungen":[
  {t:"mc",q:`${en('"Are you coming?" → She asked ___ .')}`,
   opts:["if I was coming","if was I coming","am I coming","do I come"],ai:0,
   sol:"Ja/Nein-Frage → <b>if</b> + normale Satzstellung."},
  {t:"mc",q:`${en('"Where do you live?" → He asked me where ___ .')}`,
   opts:["do I live","did I live","I lived","I live"],ai:2,
   sol:"Kein do mehr, normale Wortstellung, Backshift → <b>I lived</b>."},
  {t:"mc",q:`${en("“Don't be late!” → She told me ___ late.")}`,opts:["not to be","to not be","don't be","not being"],ai:0,
   sol:"Verneinte Aufforderung → <b>not to be</b>."},
  {t:"trans",q:"Er sagte, dass er müde sei.",a:["he said he was tired","he said that he was tired"],
   sol:"<i>He said (that) he was tired.</i>"}]}});

T({id:"relative", kat:"Grammatik", title:"Relativsätze", desc:"who, which, that — und wann man sie weglassen darf.",
expl:`<p class="lead">Ein Relativsatz erklärt genauer, wer oder was gemeint ist. Er hängt direkt hinter dem Wort, auf das er sich bezieht.</p>
<table class="tbl">
<tr><td class="f">who</td><td>für Personen</td><td class="e">the man who lives next door</td></tr>
<tr><td class="f">which</td><td>für Dinge und Tiere</td><td class="e">the book which is on the table</td></tr>
<tr><td class="f">that</td><td>für beides, im notwendigen Relativsatz</td><td class="e">the film that we saw</td></tr>
<tr><td class="f">whose</td><td>dessen, deren</td><td class="e">the girl whose bike is broken</td></tr>
<tr><td class="f">where</td><td>Ort</td><td class="e">the town where I was born</td></tr>
</table>
<h3>Contact clauses — das Weglassen</h3>
<div class="rule">Ist das Relativpronomen im Nebensatz <b>Objekt</b>, darf es wegfallen:<br>
<i>The film (that) we saw was great.</i> — nach dem Pronomen folgt ein Subjekt (we), also darf es weg.<br>
Ist es <b>Subjekt</b>, muss es stehen bleiben:<br>
<i>The man <b>who</b> lives next door</i> — hier folgt direkt ein Verb.</div>
<h3>Notwendig oder nicht?</h3>
<ol class="steps">
<li><b>Notwendig</b> (defining): Ohne den Nebensatz weiß man nicht, wer gemeint ist. Kein Komma.
<i>The girl who won the race is my sister.</i></li>
<li><b>Nicht notwendig</b> (non-defining): Zusatzinfo, die man weglassen könnte. <b>Mit Kommas</b>, und <b>nie mit that</b>.
<i>My sister, who lives in Berlin, is a nurse.</i></li>
</ol>`,
subs:{
 "who, which, whose":[
  {t:"mc",q:`${en("That's the woman ___ helped me.")}`,opts:["which","who","whose","where"],ai:1,sol:"Person → <b>who</b>."},
  {t:"mc",q:`${en("This is the bike ___ I bought last week.")}`,opts:["who","which","whose","what"],ai:1,sol:"Sache → <b>which</b> (oder that)."},
  {t:"mc",q:`${en("She's the girl ___ father is a doctor.")}`,opts:["who","which","whose","who's"],ai:2,sol:"„deren“ → <b>whose</b>."},
  {t:"mc",q:`${en("That's the café ___ we first met.")}`,opts:["which","where","who","when"],ai:1,sol:"Ort → <b>where</b>."}],
 "Weglassen & Kommas":[
  {t:"mc",q:"In welchem Satz darf das Relativpronomen wegfallen?",
   opts:["The man who called you was my uncle.","The book which is on the table is mine.","The film which we watched was boring.","The girl who won is my friend."],ai:2,
   sol:"Nur wenn ein Subjekt folgt (we watched) ist es Objekt → <b>The film we watched was boring.</b>"},
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["My brother, that lives in York, is 20.","My brother, who lives in York, is 20.","My brother who lives in York, is 20.","My brother which lives in York is 20."],ai:1,
   sol:"Zusatzinfo → Kommas und <b>who</b>, niemals that."},
  {t:"order",de:"Das ist der Mann, der mir geholfen hat.",a:["This","is","the","man","who","helped","me"],end:"."},
  {t:"trans",q:"Der Film, den wir gesehen haben, war langweilig.",
   a:["the film we watched was boring","the film that we watched was boring","the film which we watched was boring","the film we saw was boring"],
   sol:"<i>The film (that) we watched was boring.</i>"}]}});

T({id:"gerund", kat:"Grammatik", title:"Gerundium & Infinitiv", desc:"Wann -ing, wann to + Grundform.",
expl:`<p class="lead">Steht ein zweites Verb im Satz, muss man wissen, welche Form es bekommt: <b>-ing</b> oder <b>to + Grundform</b>. Das hängt vom ersten Verb ab.</p>
<h3>Mit -ing (Gerund)</h3>
<div class="ex">enjoy · like · love · hate · mind · finish · stop · start · practise · avoid · suggest<br>
<i>I enjoy <b>reading</b>. · She finished <b>doing</b> her homework.</i></div>
<div class="rule">Auch <b>nach jeder Präposition</b> steht die ing-Form:<br>
<i>He's good <b>at swimming</b>. · Thanks <b>for helping</b> me. · instead <b>of going</b></i></div>
<div class="rule">Und am <b>Satzanfang</b>, wenn eine Tätigkeit das Subjekt ist:
<i><b>Smoking</b> is bad for you.</i></div>
<h3>Mit to + Grundform</h3>
<div class="ex">want · would like · hope · decide · promise · learn · try · offer · need · forget · agree<br>
<i>I want <b>to go</b> home. · She decided <b>to stay</b>.</i></div>
<h3>Beides möglich — mit anderer Bedeutung</h3>
<table class="tbl">
<tr><td class="e">stop smoking</td><td>mit dem Rauchen aufhören</td></tr>
<tr><td class="e">stop to smoke</td><td>anhalten, um zu rauchen</td></tr>
<tr><td class="e">remember posting the letter</td><td>sich erinnern, ihn eingeworfen zu haben</td></tr>
<tr><td class="e">remember to post the letter</td><td>daran denken, ihn einzuwerfen</td></tr>
</table>`,
subs:{
 "Welche Form?":[
  {t:"mc",q:`${en("I enjoy ___ books.")}`,opts:["to read","reading","read","to reading"],ai:1,sol:"Nach enjoy immer <b>-ing</b>."},
  {t:"mc",q:`${en("She wants ___ a doctor.")}`,opts:["becoming","to become","become","to becoming"],ai:1,sol:"Nach want steht <b>to + Grundform</b>."},
  {t:"mc",q:`${en("He's good at ___ .")}`,opts:["cook","to cook","cooking","cooks"],ai:2,sol:"Nach einer Präposition (at) steht die <b>ing-Form</b>."},
  {t:"mc",q:`${en("___ is my favourite sport.")}`,opts:["To swim","Swimming","Swim","The swim"],ai:1,sol:"Tätigkeit als Subjekt → <b>Swimming</b>."},
  {t:"mc",q:`${en("They decided ___ at home.")}`,opts:["staying","to stay","stay","to staying"],ai:1,sol:"Nach decide → <b>to stay</b>."}],
 "Bedeutungsunterschied":[
  {t:"mc",q:"Was heißt „Er hörte auf zu rauchen“?",opts:["He stopped to smoke.","He stopped smoking.","He stopped smoke.","He stopped for smoking."],ai:1,
   sol:"<b>stop + ing</b> = mit etwas aufhören. stop to smoke = anhalten, um zu rauchen."},
  {t:"mc",q:`${en("Remember ___ the door when you leave!")}`,opts:["locking","to lock","lock","locked"],ai:1,
   sol:"Daran denken, etwas noch zu tun → <b>remember to</b>."},
  {t:"trans",q:"Danke, dass du mir geholfen hast.",a:["thank you for helping me","thanks for helping me"],
   sol:"<i>Thanks for helping me.</i> — nach for steht die ing-Form."}]}});

T({id:"comparison", kat:"Grammatik", title:"Adjektive, Adverbien & Steigerung", desc:"Vergleiche richtig bilden.",
expl:`<p class="lead">Adjektive beschreiben Dinge (<i>a fast car</i>), Adverbien beschreiben Handlungen (<i>he drives fast</i>).</p>
<h3>Adverbien bilden</h3>
<div class="rule">Adjektiv + <b>-ly</b>: slow → slowly, careful → carefully.<br>
Endet es auf -y: happy → <b>happily</b>. Endet es auf -le: simple → <b>simply</b>.<br>
<b>Unregelmäßig:</b> good → <b>well</b>, fast → fast, hard → hard, late → late.</div>
<h3>Steigerung</h3>
<ol class="steps">
<li><b>Kurze Adjektive</b> (ein, oft zwei Silben): <b>-er / -est</b> — cheap, cheaper, cheapest.</li>
<li>Endet auf -y: <b>-ier / -iest</b> — happy, happier, happiest.</li>
<li>Kurzer Vokal + Konsonant: verdoppeln — big, bi<b>gg</b>er, biggest.</li>
<li><b>Lange Adjektive</b> (zwei oder mehr Silben): <b>more / most</b> — more expensive, most expensive.</li>
<li><b>Unregelmäßig:</b> good – better – best · bad – worse – worst · much/many – more – most · little – less – least.</li>
</ol>
<div class="rule"><b>Nie beides gleichzeitig:</b> nicht <i>more bigger</i>, nicht <i>most easiest</i>.</div>
<h3>Vergleichen</h3>
<table class="tbl">
<tr><td class="e">as … as</td><td>genauso … wie</td><td class="e">She is as tall as me.</td></tr>
<tr><td class="e">not as … as</td><td>nicht so … wie</td><td class="e">It's not as cold as yesterday.</td></tr>
<tr><td class="e">-er than</td><td>… als</td><td class="e">He is older than his brother.</td></tr>
<tr><td class="e">the … est of / in</td><td>der/die/das …ste</td><td class="e">the best player in the team</td></tr>
</table>
<div class="rule"><b>Nach dem Komparativ steht than</b>, nicht as: <i>bigger <b>than</b></i>. Verwechslung mit „als/wie“ ist ein Klassiker.</div>`,
gens:[genComp],
subs:{
 "Steigerung":[
  {t:"mc",q:`${en("This exercise is ___ than the last one.")}`,opts:["more easy","easier","easyer","more easier"],ai:1,
   sol:"Kurzes Adjektiv auf -y → <b>easier</b>."},
  {t:"mc",q:`${en("It was the ___ day of my life.")}`,opts:["most bad","worst","baddest","more bad"],ai:1,
   sol:"bad – worse – <b>worst</b>."},
  {t:"mc",q:`${en("Your phone is ___ than mine.")}`,opts:["expensiver","more expensive","most expensive","more expensiver"],ai:1,
   sol:"Langes Adjektiv → <b>more expensive</b>."},
  {t:"mc",q:`${en("She sings ___ than her sister.")}`,opts:["good","better","gooder","best"],ai:1,
   sol:"Nach einem Verb steht das Adverb: well – <b>better</b> – best."}],
 "Vergleichen":[
  {t:"mc",q:`${en("He is as tall ___ his father.")}`,opts:["than","as","like","that"],ai:1,sol:"as … <b>as</b>."},
  {t:"mc",q:`${en("Today is colder ___ yesterday.")}`,opts:["as","than","then","that"],ai:1,sol:"Nach dem Komparativ steht <b>than</b>."},
  {t:"trans",q:"Das ist der interessanteste Film, den ich kenne.",
   a:["this is the most interesting film i know","that is the most interesting film i know"],
   sol:"<i>This is the most interesting film I know.</i>"}],
 "Adverbien":[
  {t:"mc",q:`${en("She speaks English very ___ .")}`,opts:["good","well","goodly","best"],ai:1,sol:"Adverb zu good ist <b>well</b>."},
  {t:"mc",q:`${en("He drives too ___ .")}`,opts:["fastly","fast","faster","fastily"],ai:1,sol:"fast bleibt <b>fast</b> — kein -ly."},
  {t:"mc",q:"Wie lautet das Adverb zu happy?",opts:["happyly","happily","happy","happier"],ai:1,sol:"-y wird zu -i + ly → <b>happily</b>."}]}});

T({id:"pronouns", kat:"Grammatik", title:"Pronomen", desc:"I/me, my/mine, myself — und there is / it is.",
expl:`<p class="lead">Pronomen ersetzen Namen und Dinge. Welche Form du brauchst, hängt von der Rolle im Satz ab.</p>
<table class="tbl">
<tr><th>Subjekt</th><th>Objekt</th><th>Possessivbegleiter</th><th>Possessivpronomen</th><th>Reflexiv</th></tr>
<tr><td class="e">I</td><td class="e">me</td><td class="e">my</td><td class="e">mine</td><td class="e">myself</td></tr>
<tr><td class="e">you</td><td class="e">you</td><td class="e">your</td><td class="e">yours</td><td class="e">yourself</td></tr>
<tr><td class="e">he</td><td class="e">him</td><td class="e">his</td><td class="e">his</td><td class="e">himself</td></tr>
<tr><td class="e">she</td><td class="e">her</td><td class="e">her</td><td class="e">hers</td><td class="e">herself</td></tr>
<tr><td class="e">it</td><td class="e">it</td><td class="e">its</td><td class="e">—</td><td class="e">itself</td></tr>
<tr><td class="e">we</td><td class="e">us</td><td class="e">our</td><td class="e">ours</td><td class="e">ourselves</td></tr>
<tr><td class="e">they</td><td class="e">them</td><td class="e">their</td><td class="e">theirs</td><td class="e">themselves</td></tr>
</table>
<div class="rule"><b>Begleiter oder Pronomen?</b> Der Begleiter steht <u>vor</u> einem Nomen (<i>my book</i>),
das Pronomen steht <u>allein</u> (<i>This book is mine</i>).</div>
<div class="rule"><b>its oder it's?</b> <i>its</i> = sein/ihr (Begleiter). <i>it's</i> = it is oder it has.
Der Apostroph steht nur für ausgelassene Buchstaben.</div>
<h3>there is / there are vs. it is</h3>
<div class="rule"><b>there is/are</b> = „es gibt“: <i>There are two cats in the garden.</i><br>
<b>it is</b> = „es ist“ (Wetter, Zeit, Beschreibung): <i>It is cold today.</i></div>`,
subs:{
 "Formen":[
  {t:"mc",q:`${en("Can you help ___ , please?")}`,opts:["I","me","my","mine"],ai:1,sol:"Objekt → <b>me</b>."},
  {t:"mc",q:`${en("Is this book ___ ?")}`,opts:["your","yours","you","yourself"],ai:1,sol:"Allein stehend → <b>yours</b>."},
  {t:"mc",q:`${en("The dog hurt ___ .")}`,opts:["it","its","itself","him"],ai:2,sol:"Rückbezug auf das Subjekt → <b>itself</b>."},
  {t:"mc",q:`${en("___ car is parked outside.")}`,opts:["Their","There","They're","Theirs"],ai:0,
   sol:"Vor einem Nomen → <b>Their</b>. there = dort, they're = they are."},
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["Its raining.","It's raining.","Its' raining.","It is'nt raining."],ai:1,
   sol:"it's = it is → <b>It's raining.</b>"}],
 "there is / it is":[
  {t:"mc",q:`${en("___ a lot of people in the shop.")}`,opts:["It is","There is","There are","They are"],ai:2,
   sol:"„es gibt“ + Plural → <b>There are</b>."},
  {t:"mc",q:`${en("___ very cold today.")}`,opts:["There is","It is","There are","It has"],ai:1,sol:"Wetter → <b>It is</b>."},
  {t:"trans",q:"Es gibt einen Supermarkt in der Nähe.",a:["there is a supermarket near here","there's a supermarket near here","there is a supermarket nearby"],
   sol:"<i>There is a supermarket near here.</i>"}]}});

T({id:"articles", kat:"Grammatik", title:"Artikel & Mengen", desc:"a/an/the, some/any, much/many.",
expl:`<p class="lead">Ob ein Wort zählbar ist oder nicht, entscheidet über fast alles: über den Artikel, über some/any und über much/many.</p>
<h3>a, an oder the?</h3>
<ol class="steps">
<li><b>a / an</b> bei etwas Unbestimmtem, das zum ersten Mal genannt wird: <i>I saw a dog.</i></li>
<li><b>an</b> vor einem Vokal<u>laut</u>: an apple, an hour (h stumm) — aber <i>a university</i> (klingt wie „ju“).</li>
<li><b>the</b>, wenn klar ist, welches gemeint ist: <i>The dog was black.</i></li>
<li><b>Kein Artikel</b> bei allgemeinen Aussagen im Plural (<i>Dogs are friendly</i>), bei Sprachen, Ländern,
Mahlzeiten und Schulfächern (<i>I like maths · at school · after breakfast</i>).</li>
</ol>
<h3>some und any</h3>
<div class="rule"><b>some</b> in Aussagesätzen, <b>any</b> in Verneinung und Frage:<br>
<i>I have some money. · I don't have any money. · Do you have any money?</i><br>
Ausnahme: <b>some</b> in Bitten und Angeboten — <i>Would you like some tea?</i></div>
<h3>much, many, a lot of</h3>
<table class="tbl">
<tr><td class="f">many</td><td>zählbar</td><td class="e">many books, many people</td></tr>
<tr><td class="f">much</td><td>nicht zählbar</td><td class="e">much time, much money</td></tr>
<tr><td class="f">a lot of</td><td>beides, vor allem in Aussagesätzen</td><td class="e">a lot of books, a lot of time</td></tr>
<tr><td class="f">a few / a little</td><td>ein paar (zählbar) / ein bisschen (nicht zählbar)</td><td class="e">a few friends, a little sugar</td></tr>
</table>
<div class="rule">Nicht zählbar sind unter anderem: <i>information, advice, news, money, furniture, homework, bread, water</i>.
Sie stehen nie im Plural: nicht <i>informations</i>, sondern <b>information</b>.</div>`,
subs:{
 "a / an / the":[
  {t:"mc",q:`${en("She is ___ honest person.")}`,opts:["a","an","the","—"],ai:1,sol:"h ist stumm, es klingt wie ein Vokal → <b>an</b>."},
  {t:"mc",q:`${en("He goes to ___ university in London.")}`,opts:["a","an","the","—"],ai:0,
   sol:"university klingt wie „juːniversity“ → <b>a</b>."},
  {t:"mc",q:`${en("I like ___ dogs.")}`,opts:["a","the","—","an"],ai:2,sol:"Allgemeine Aussage im Plural → <b>kein Artikel</b>."},
  {t:"mc",q:`${en("We have English ___ school.")}`,opts:["at","at the","in the","on"],ai:0,sol:"<b>at school</b> ohne Artikel."}],
 "some / any / much / many":[
  {t:"mc",q:`${en("There isn't ___ milk in the fridge.")}`,opts:["some","any","many","a"],ai:1,sol:"Verneinung → <b>any</b>."},
  {t:"mc",q:`${en("How ___ money do you need?")}`,opts:["many","much","lot","few"],ai:1,sol:"money ist nicht zählbar → <b>much</b>."},
  {t:"mc",q:`${en("There were too ___ people at the concert.")}`,opts:["much","many","a lot","little"],ai:1,sol:"people ist zählbar → <b>many</b>."},
  {t:"mc",q:`${en("Would you like ___ tea?")}`,opts:["any","some","many","a"],ai:1,sol:"Angebot → <b>some</b>."},
  {t:"trans",q:"Ich habe nicht viel Zeit.",a:["i don't have much time","i haven't got much time","i do not have much time"],
