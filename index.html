T({id:"trigo", kl:10, title:"Trigonometrie", desc:"Sinus, Kosinus, Tangens — auch im allgemeinen Dreieck.",
expl:`<p class="lead">Im rechtwinkligen Dreieck hängen Winkel und Seitenverhältnisse fest zusammen. Drei Verhältnisse bekommen eigene Namen.</p>
<h3>Die drei Grundformeln</h3>
<div class="ex">sin α = ${frac("Gegenkathete","Hypotenuse")} · cos α = ${frac("Ankathete","Hypotenuse")} · tan α = ${frac("Gegenkathete","Ankathete")}</div>
<div class="rule"><b>Merkspruch:</b> GAGA HHAG — <b>G</b>egenkathete durch <b>H</b>ypotenuse, <b>A</b>nkathete durch
<b>H</b>ypotenuse, <b>G</b>egenkathete durch <b>A</b>nkathete.<br>
<b>Gegenkathete</b> liegt dem Winkel gegenüber, die <b>Ankathete</b> liegt an ihm an (und ist nicht die Hypotenuse).</div>
<h3>So gehst du vor</h3>
<ol class="steps">
<li>Rechten Winkel und den gefragten Winkel markieren.</li>
<li>Die drei Seiten benennen: Hypotenuse (gegenüber vom rechten Winkel), Gegen- und Ankathete.</li>
<li>Die Formel wählen, in der beide bekannten Größen und die gesuchte vorkommen.</li>
<li>Nach der gesuchten Größe umstellen und rechnen.</li>
</ol>
<div class="rule"><b>Winkel gesucht?</b> Dann die Umkehrfunktionen benutzen: sin<sup>−1</sup>, cos<sup>−1</sup>, tan<sup>−1</sup>
(auf dem Taschenrechner meist über die Shift-Taste). Und prüfen, ob der Rechner auf <b>DEG</b> steht.</div>
<h3>Im allgemeinen Dreieck</h3>
<table class="tbl">
<tr><td class="f">Sinussatz</td><td>${frac("a","sin α")} = ${frac("b","sin β")} = ${frac("c","sin γ")}</td><td>zwei Winkel und eine Seite</td></tr>
<tr><td class="f">Kosinussatz</td><td>c² = a² + b² − 2ab · cos γ</td><td>zwei Seiten und der Zwischenwinkel</td></tr>
</table>
<p>Der Kosinussatz ist der Satz des Pythagoras mit Korrekturglied: Bei γ = 90° ist cos γ = 0 und übrig bleibt c² = a² + b².</p>`,
gens:[
 {id:"seite", label:"Seite berechnen", make(){
   const a = R(20,70), c = R(4,25);
   const art = pick(["sin","cos","tan"]);
   const v = art === "sin" ? c*Math.sin(a*Math.PI/180)
           : art === "cos" ? c*Math.cos(a*Math.PI/180)
                           : c*Math.tan(a*Math.PI/180);
   const txt = art === "sin" ? `Die Hypotenuse ist ${m(c+" cm")} lang. Berechne die Gegenkathete von α`
             : art === "cos" ? `Die Hypotenuse ist ${m(c+" cm")} lang. Berechne die Ankathete von α`
                             : `Die Ankathete von α ist ${m(c+" cm")} lang. Berechne die Gegenkathete`;
   return {q:`In einem rechtwinkligen Dreieck ist ${m("α = "+a+"°")}. ${txt} (2 Nachkommastellen).`,
     num:v, unit:"cm", dec:2,
     sol:`${art} ${a}° = ${fmt(Math[art === "tan" ? "tan" : art](a*Math.PI/180),4)} → ${c} · ${fmt(Math[art==="tan"?"tan":art](a*Math.PI/180),4)} = <b>${fmt(v,2)} cm</b>`};
 }},
 {id:"winkel", label:"Winkel berechnen", make(){
   const g = R(3,20), h = g + R(2,15);
   const a = Math.asin(g/h)*180/Math.PI;
   return {q:`In einem rechtwinkligen Dreieck ist die Gegenkathete ${m(g+" cm")} und die Hypotenuse ${m(h+" cm")} lang. Berechne den Winkel α (2 Nachkommastellen).`,
     num:a, unit:"°", dec:2,
     sol:`sin α = ${g}/${h} = ${fmt(g/h,4)} → α = sin<sup>−1</sup>(${fmt(g/h,4)}) = <b>${fmt(a,2)}°</b>`};
 }},
 {id:"sinussatz", label:"Sinussatz", make(){
   const A = R(30,80); let B = R(30, 150-A); if(B === A) B = A + 7; const a = R(5,25);
   const b = a*Math.sin(B*Math.PI/180)/Math.sin(A*Math.PI/180);
   return {q:`In einem Dreieck sind ${m("α = "+A+"°")}, ${m("β = "+B+"°")} und ${m("a = "+a+" cm")}. Berechne b (2 Nachkommastellen).`,
     num:b, unit:"cm", dec:2,
     sol:`b = a · sin β : sin α = ${a} · ${fmt(Math.sin(B*Math.PI/180),4)} : ${fmt(Math.sin(A*Math.PI/180),4)} = <b>${fmt(b,2)} cm</b>`};
 }},
 {id:"kosinussatz", label:"Kosinussatz", make(){
   const a = R(4,20), b = R(4,20), g = R(25,140);
   const c = Math.sqrt(a*a + b*b - 2*a*b*Math.cos(g*Math.PI/180));
   return {q:`In einem Dreieck sind ${m("a = "+a+" cm")}, ${m("b = "+b+" cm")} und der Zwischenwinkel ${m("γ = "+g+"°")}. Berechne c (2 Nachkommastellen).`,
     num:c, unit:"cm", dec:2,
     sol:`c² = ${a}² + ${b}² − 2·${a}·${b}·cos ${g}° = ${fmt(a*a+b*b-2*a*b*Math.cos(g*Math.PI/180),3)} → c = <b>${fmt(c,2)} cm</b>`};
 }}]});

T({id:"koerper3", kl:10, title:"Pyramide, Kegel & Kugel", desc:"Spitze Körper und die Kugel.",
expl:`<p class="lead">Bei spitzen Körpern steckt in der Formel immer ein Drittel — sie fassen genau ein Drittel des Körpers mit derselben Grundfläche und Höhe.</p>
<h3>Die Formeln</h3>
<table class="tbl">
<tr><td class="f">Pyramide</td><td class="f">V = ⅓ · G · h</td><td>G ist die Grundfläche (Quadrat, Rechteck, Dreieck …)</td></tr>
<tr><td class="f">Kegel</td><td class="f">V = ⅓ · π · r² · h</td><td>Mantel: M = π · r · s</td></tr>
<tr><td class="f">Kugel</td><td class="f">V = ${frac(4,3)} · π · r³</td><td>Oberfläche: O = 4 · π · r²</td></tr>
</table>
<div class="rule"><b>h oder s?</b> Die <b>Höhe h</b> steht senkrecht auf der Grundfläche, die <b>Mantellinie s</b>
läuft schräg von der Spitze zum Rand. Beide hängen über den Pythagoras zusammen: s² = r² + h².
Für das Volumen brauchst du h, für den Mantel s.</div>
<h3>So gehst du vor</h3>
<ol class="steps">
<li>Aufschreiben, was gegeben ist — und ob es h oder s ist.</li>
<li>Fehlt eine der beiden Größen, zuerst mit Pythagoras umrechnen.</li>
<li>Formel einsetzen, erst am Ende runden.</li>
</ol>`,
gens:[
 {id:"pyramide", label:"Pyramide", make(){
   const a = R(3,20), h = R(4,25);
   return {q:`Eine Pyramide hat eine quadratische Grundfläche mit der Seite ${m(a+" cm")} und die Höhe ${m(h+" cm")}. Berechne das Volumen (2 Nachkommastellen).`,
     num:a*a*h/3, unit:"cm³", dec:2,
     sol:`G = ${a}² = ${a*a} cm² → V = ⅓ · ${a*a} · ${h} = <b>${fmt(a*a*h/3,2)} cm³</b>`};
 }},
 {id:"kegelV", label:"Kegel", make(){
   const r = R(2,15), h = R(3,25);
   return {q:`Ein Kegel hat den Radius ${m(r+" cm")} und die Höhe ${m(h+" cm")}. Berechne das Volumen (2 Nachkommastellen).`,
     num:Math.PI*r*r*h/3, unit:"cm³", dec:2,
     sol:`V = ⅓ · π · ${r}² · ${h} = <b>${fmt(Math.PI*r*r*h/3,2)} cm³</b>`};
 }},
 {id:"mantel", label:"Mantellinie & Mantel", make(){
   const r = R(3,12), h = R(4,20);
   const s = Math.sqrt(r*r + h*h);
   return {q:`Ein Kegel hat den Radius ${m(r+" cm")} und die Höhe ${m(h+" cm")}. Berechne die Mantellinie s und die Mantelfläche (je 2 Nachkommastellen).`,
     fields:[{label:"s", num:s, unit:"cm", dec:2},{label:"Mantelfläche", num:Math.PI*r*s, unit:"cm²", dec:2}],
     sol:`s = √(${r}² + ${h}²) = √${r*r+h*h} = ${fmt(s,2)} cm → M = π · ${r} · ${fmt(s,2)} = <b>${fmt(Math.PI*r*s,2)} cm²</b>`};
 }},
 {id:"kugel", label:"Kugel", make(){
   const r = R(2,15);
   return {q:`Eine Kugel hat den Radius ${m(r+" cm")}. Berechne Volumen und Oberfläche (je 2 Nachkommastellen).`,
     fields:[{label:"Volumen", num:4/3*Math.PI*r**3, unit:"cm³", dec:2},{label:"Oberfläche", num:4*Math.PI*r*r, unit:"cm²", dec:2}],
     sol:`V = 4/3 · π · ${r}³ = <b>${fmt(4/3*Math.PI*r**3,2)} cm³</b> · O = 4 · π · ${r}² = <b>${fmt(4*Math.PI*r*r,2)} cm²</b>`};
 }}]});

T({id:"wachstum", kl:10, title:"Exponentielles Wachstum & Logarithmus", desc:"Wachstumsfaktor, Halbwertszeit, Gleichungen mit x im Exponenten.",
expl:`<p class="lead">Linear heißt: <b>plus</b> jedes Mal derselbe Betrag. Exponentiell heißt: <b>mal</b> jedes Mal derselbe Faktor. Genau das macht den Unterschied so dramatisch.</p>
<h3>Die Formel</h3>
<div class="ex">N(t) = N<sub>0</sub> · q<sup>t</sup></div>
<table class="tbl">
<tr><td class="f">N₀</td><td>Anfangswert</td></tr>
<tr><td class="f">q</td><td>Wachstumsfaktor pro Zeitschritt</td></tr>
<tr><td class="f">t</td><td>Anzahl der Zeitschritte</td></tr>
</table>
<div class="rule"><b>Vom Prozentsatz zum Faktor:</b> +5 % → q = 1,05 · −5 % → q = 0,95 · Verdopplung → q = 2 ·
Halbierung → q = 0,5.<br>q &gt; 1 bedeutet Wachstum, 0 &lt; q &lt; 1 bedeutet Abnahme.</div>
<h3>Wenn die Zeit gesucht ist</h3>
<p>Dann steht x im Exponenten, und man braucht den <b>Logarithmus</b>. Er beantwortet die Frage:
„Mit welchem Exponenten muss ich die Basis potenzieren?"</p>
<div class="ex">log<sub>2</sub>(32) = 5, denn 2⁵ = 32</div>
<ol class="steps">
<li>Gleichung so umstellen, dass die Potenz allein steht: q<sup>t</sup> = Wert.</li>
<li>Logarithmieren: t = ${frac("log(Wert)","log(q)")} — mit lg oder ln, die Basis ist egal, solange sie oben und unten gleich ist.</li>
<li>Ergebnis sinnvoll runden und im Sachzusammenhang deuten (oft aufrunden: „nach dem 8. Jahr").</li>
</ol>
<div class="ex">1000 · 1,05<sup>t</sup> = 2000 → 1,05<sup>t</sup> = 2 → t = log 2 : log 1,05 ≈ <b>14,2 Jahre</b></div>
<div class="rule"><b>Halbwertszeit</b> ist die Zeit, nach der die Hälfte übrig ist, <b>Verdopplungszeit</b> die Zeit
bis zum doppelten Wert. Beide hängen nicht vom Startwert ab.</div>`,
gens:[
 {id:"faktor", label:"Wachstumsfaktor", make(){
   const p = pick([2,3,4,5,7,10,15,20,25,30]), rauf = Math.random() < .5;
   return {q:`Ein Bestand ${rauf?"wächst":"fällt"} jährlich um ${m(p+" %")}. Wie groß ist der Wachstumsfaktor q?`,
     num: rauf ? 1+p/100 : 1-p/100, dec:4, label:"q",
     sol:`q = 1 ${rauf?"+":"−"} ${fmt(p/100)} = <b>${fmt(rauf?1+p/100:1-p/100)}</b>`};
 }},
 {id:"wert", label:"Wert nach t Schritten", make(){
   const n0 = R(2,40)*100, p = pick([3,5,8,10,12,20]), t = R(2,10), rauf = Math.random() < .6;
   const q = rauf ? 1+p/100 : 1-p/100;
   const v = n0 * q**t;
   return {q:`Ein Bestand von ${m(n0)} ${rauf?"wächst":"sinkt"} jährlich um ${m(p+" %")}. Wie groß ist er nach ${m(t+" Jahren")} (2 Nachkommastellen)?`,
     num:v, dec:2,
     sol:`N = ${n0} · ${fmt(q)}<sup>${t}</sup> = <b>${fmt(v,2)}</b>`};
 }},
 {id:"log", label:"Logarithmus", make(){
   const b = pick([2,3,5,10]), e = R(2,6);
   return {q:`Löse: ${m(`${b}^x = ${b**e}`)}`, num:e, label:"x",
     sol:`${b}<sup>${e}</sup> = ${b**e} → x = log<sub>${b}</sub>(${b**e}) = <b>${e}</b>`};
 }},
 {id:"zeit", label:"Zeit berechnen", make(){
   const p = pick([3,4,5,6,8,10]), ziel = pick([2,3]);
   const q = 1+p/100;
   const t = Math.log(ziel)/Math.log(q);
   return {q:`Ein Kapital wächst jährlich um ${m(p+" %")}. Nach wie vielen Jahren hat es sich ${ziel===2?"verdoppelt":"verdreifacht"} (2 Nachkommastellen)?`,
     num:t, unit:"Jahre", dec:2,
     sol:`${fmt(q)}<sup>t</sup> = ${ziel} → t = log ${ziel} : log ${fmt(q)} = <b>${fmt(t,2)} Jahre</b>`};
 }},
 {id:"halbwert", label:"Halbwertszeit", make(){
   const hw = pick([5,8,10,12,20,30]), t = hw*R(1,4);
   const rest = 100 * 0.5**(t/hw);
   return {q:`Ein Stoff hat die Halbwertszeit ${m(hw+" Jahre")}. Wie viel Prozent sind nach ${m(t+" Jahren")} noch übrig?`,
     num:round(rest,2), unit:"%", dec:2,
     sol:`${t} : ${hw} = ${t/hw} Halbwertszeiten → 100 % · 0,5<sup>${t/hw}</sup> = <b>${fmt(round(rest,2))} %</b>`};
 }}]});

T({id:"statistik", kl:10, title:"Statistik", desc:"Kennwerte, Quartile, Boxplot, Standardabweichung.",
expl:`<p class="lead">Eine Datenreihe wird durch wenige Kennzahlen beschrieben: wo die Mitte liegt und wie stark die Werte streuen.</p>
<h3>Lagemaße</h3>
<table class="tbl">
<tr><td class="f">Mittelwert</td><td>Summe : Anzahl — reagiert stark auf Ausreißer</td></tr>
<tr><td class="f">Median</td><td>der mittlere Wert der sortierten Reihe — unempfindlich gegen Ausreißer</td></tr>
<tr><td class="f">Modalwert</td><td>der am häufigsten vorkommende Wert</td></tr>
</table>
<h3>Streumaße</h3>
<ol class="steps">
<li><b>Spannweite</b> = größter minus kleinster Wert.</li>
<li><b>Quartile</b>: Der Median teilt die sortierte Reihe in zwei Hälften. Das untere Quartil Q₁ ist der Median
der unteren Hälfte, das obere Quartil Q₃ der Median der oberen.</li>
<li><b>Interquartilsabstand</b> = Q₃ − Q₁. In diesem Bereich liegen die mittleren 50 % der Daten.</li>
<li><b>Standardabweichung</b> s: mittlerer Abstand vom Mittelwert. Je größer s, desto stärker streuen die Werte.</li>
</ol>
<h3>Boxplot</h3>
<div class="rule">Fünf Zahlen genügen für die Zeichnung: Minimum, Q₁, Median, Q₃, Maximum.
Die Box reicht von Q₁ bis Q₃ und enthält die mittleren 50 % der Daten, der Strich darin ist der Median,
die Antennen gehen bis zum kleinsten und größten Wert.</div>
<div class="rule"><b>Warum reicht der Mittelwert nicht?</b> Zwei Klassen können denselben Notendurchschnitt haben —
in der einen liegen alle bei 3, in der anderen die Hälfte bei 1 und die Hälfte bei 5. Erst die Streuung zeigt den Unterschied.</div>`,
gens:[
 {id:"kennwerte", label:"Mittelwert & Median", make(){
   const n = pick([7,8,9]), v = Array.from({length:n}, () => R(1,20));
   const s = [...v].sort((a,b)=>a-b);
   const sum = v.reduce((a,b)=>a+b,0);
   const med = n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;
   return {q:`Gegeben: ${m(v.join("; "))}<br>Berechne Mittelwert und Median.`,
     fields:[{label:"Mittelwert", num:sum/n, dec:2},{label:"Median", num:med, dec:2}],
     sol:`Sortiert: ${s.join("; ")} · Summe ${sum} : ${n} = <b>${fmt(sum/n,2)}</b> · Median <b>${fmt(med)}</b>`};
 }},
 {id:"quartile", label:"Quartile", make(){
   const v = Array.from({length:8}, () => R(1,30));
   const s = [...v].sort((a,b)=>a-b);
   const q1 = (s[1]+s[2])/2, med = (s[3]+s[4])/2, q3 = (s[5]+s[6])/2;
   return {q:`Gegeben: ${m(v.join("; "))}<br>Bestimme unteres Quartil, Median und oberes Quartil.`,
     fields:[{label:"Q₁", num:q1, dec:2},{label:"Median", num:med, dec:2},{label:"Q₃", num:q3, dec:2}],
     sol:`Sortiert: ${s.join("; ")} → Q₁ = <b>${fmt(q1)}</b>, Median = <b>${fmt(med)}</b>, Q₃ = <b>${fmt(q3)}</b>`};
 }},
 {id:"iqr", label:"Interquartilsabstand", make(){
   const v = Array.from({length:8}, () => R(1,40));
   const s = [...v].sort((a,b)=>a-b);
   const q1 = (s[1]+s[2])/2, q3 = (s[5]+s[6])/2;
   return {q:`Gegeben: ${m(v.join("; "))}<br>Wie groß ist der Interquartilsabstand?`,
     num:q3-q1, dec:2,
     sol:`Q₃ = ${fmt(q3)}, Q₁ = ${fmt(q1)} → Q₃ − Q₁ = <b>${fmt(q3-q1)}</b>`};
 }},
 {id:"standard", label:"Standardabweichung", make(){
   const v = Array.from({length:5}, () => R(2,20));
   const mw = v.reduce((a,b)=>a+b,0)/5;
   const s = Math.sqrt(v.reduce((a,b)=>a+(b-mw)**2,0)/5);
   return {q:`Gegeben: ${m(v.join("; "))}<br>Berechne die Standardabweichung (2 Nachkommastellen).`,
     num:s, dec:2,
     sol:`Mittelwert ${fmt(mw,2)} → mittlere quadratische Abweichung ${fmt(s*s,3)} → s = <b>${fmt(s,2)}</b>`};
 }}]});
</script>
<script>
/* ============================================================
   3. APP
   ============================================================ */
const $ = s => document.querySelector(s);
const stage = $("#stage");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KLASSEN = [5,6,7,8,9,10];

/* Gemischte Themen pro Klasse — ziehen aus allen Themen der Stufe */
KLASSEN.forEach(k => TOPICS.push({id:"mix"+k, kl:k, mixOf:k, title:`Klasse ${k} — gemischt`,
  desc:`Aufgaben aus allen Themen der Klasse ${k}. Ideal als Klassenarbeit vor der Arbeit.`, gens:[]}));
TOPICS.forEach(t => { if(t.mixOf) t.gens = TOPICS.filter(x => x.kl === t.mixOf && !x.mixOf).flatMap(x => x.gens.map(g => ({...g, _t:x}))); });

const TOPIC_BY_ID = {}; TOPICS.forEach(t => TOPIC_BY_ID[t.id] = t);
const GEN_BY_KEY = {};
TOPICS.forEach(t => t.gens.forEach(g => { if(!g._t) GEN_BY_KEY[t.id+":"+g.id] = {t, g}; }));

function makeTask(t, g){
  const src = g._t || t;
  const task = g.make.call(g);
  task.key = src.id + ":" + g.id;
  task.gl = g.label;
  task.tt = src.title;
  return task;
}

/* ---------- Lernstand ---------- */
const SKEY = "rechenheft-v1";
const Store = {
  load(){ try { return JSON.parse(localStorage.getItem(SKEY)) || null; } catch(e){ return null; } },
  save(d){ try { localStorage.setItem(SKEY, JSON.stringify(d)); } catch(e){} }
};
const MEM = Object.assign({gens:{}, exams:{}}, Store.load() || {});
const saveMEM = () => Store.save(MEM);
const rec = k => MEM.gens[k] || (MEM.gens[k] = {r:0, w:0, s:0});
function mark(key, ok){
  if(!key || !GEN_BY_KEY[key]) return false;
  const e = rec(key);
  if(!ok){ e.w++; e.s = 0; return false; }
  e.r++; e.s++;
  if(e.s >= 2 && e.w > 0){ e.w = 0; return true; }
  return false;
}
const openErrors = () => Object.keys(MEM.gens).filter(k => MEM.gens[k].w > 0 && GEN_BY_KEY[k]);
function weight(key){
  const e = MEM.gens[key];
  if(!e) return 2;
  if(e.w === 0 && e.r >= 2) return 0.6;
  if(e.w > e.r) return 4;
  return e.w > 0 ? 3 : 1.2;
}

const stats = {ok:0, all:0, streak:0};
let S = {topic:null, mode:"ueben", sub:null, queue:[], idx:0, cleared:false, exam:null, timer:null};

/* ---------- Aufgaben ziehen ---------- */
function genList(t){
  if(S.sub){ const g = t.gens.find(x => x.id === S.sub || (x._t && x._t.id+":"+x.id === S.sub)); return g ? [g] : t.gens; }
  return t.gens;
}
/* Jeder Aufgabentyp kommt mindestens einmal dran, danach zählt die Gewichtung:
   Was zuletzt falsch war, wird häufiger gezogen. */
function drawTasks(t, n){
  const gs = genList(t);
  const base = shuffle(gs), out = [];
  for(let i = 0; i < n; i++){
    let g;
    if(i < base.length) g = base[i];
    else {
      const ws = gs.map(x => weight((x._t || t).id + ":" + x.id));
      let r = Math.random() * ws.reduce((a,b) => a+b, 0), k = 0;
      while(k < gs.length-1 && r > ws[k]){ r -= ws[k]; k++; }
      g = gs[k];
    }
    out.push(makeTask(t, g));
  }
  return shuffle(out);
}

/* ---------- Startseite ---------- */
function renderHome(){
  $("#home").hidden = false; $("#drill").hidden = true; $("#subTabs").hidden = true;
  stopTimer();
  const n = openErrors().length;
  let html = "";
  if(n) html += `<div class="klasse"><h2>Wiederholen</h2><span>${n} offene Fehler</span><i class="rule"></i></div>
    <div class="grid"><button class="topic alert" data-act="topic" data-id="fehler">
      <span class="tname">Deine Fehler (${n})</span>
      <span class="tdesc">Aufgabenarten, bei denen es zuletzt gehakt hat — mit neuen Zahlen.</span></button></div>`;
  KLASSEN.forEach(k => {
    const ts = TOPICS.filter(t => t.kl === k && !t.mixOf);
    const mx = TOPICS.find(t => t.mixOf === k);
    html += `<div class="klasse"><h2>Klasse ${k}</h2><span>${ts.length} Themen</span><i class="rule"></i></div><div class="grid">` +
      ts.map(t => `<button class="topic" data-act="topic" data-id="${t.id}">
        <span class="tname">${t.title}</span><span class="tdesc">${t.desc}</span></button>`).join("") +
      `<button class="topic exam" data-act="topic" data-id="${mx.id}">
        <span class="tname">${mx.title}</span><span class="tdesc">${mx.desc}</span></button></div>`;
  });
  $("#topicGrid").innerHTML = html;
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- Themenansicht ---------- */
const ERR_TOPIC = {id:"fehler", title:"Deine Fehler", desc:"", gens:[], isErr:true};
function modesOf(t){
  if(t.isErr) return [["ueben","Wiederholen"]];
  const ms = [];
  if(t.expl) ms.push(["expl","Erklärung"]);
  ms.push(["ueben","Üben"], ["exam","Klassenarbeit"]);
  return ms;
}
function openTopic(id){
  S.topic = id === "fehler" ? ERR_TOPIC : TOPIC_BY_ID[id];
  S.sub = null; S.exam = null;
  const ms = modesOf(S.topic);
  S.mode = ms[0][0];
  $("#home").hidden = true; $("#drill").hidden = false;
  $("#drillTitle").textContent = S.topic.title;
  renderModeTabs(ms);
  renderSubTabs();
  startMode();
  window.scrollTo({top:0, behavior:"instant"});
}
function renderModeTabs(ms){
  $("#modeTabs").innerHTML = ms.length < 2 ? "" : ms.map(([id,label]) =>
    `<button class="mode${id==="exam"?" examtab":""}" data-act="mode" data-m="${id}" aria-selected="${S.mode===id}">${label}</button>`).join("");
}
function renderSubTabs(){
  const el = $("#subTabs");
  if(S.mode !== "ueben" || S.topic.isErr || S.topic.gens.length < 2 || S.topic.mixOf){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<button class="sub" data-act="sub" data-s="" aria-selected="${!S.sub}">Alle Aufgabentypen</button>` +
    S.topic.gens.map(g => `<button class="sub" data-act="sub" data-s="${g.id}" aria-selected="${S.sub===g.id}">${g.label}</button>`).join("");
}
function setMode(mo){
  S.mode = mo; S.sub = null; stopTimer();
  [...document.querySelectorAll("#modeTabs .mode")].forEach(b => b.setAttribute("aria-selected", b.dataset.m === mo));
  renderSubTabs(); startMode();
}
function startMode(){
  if(S.mode === "expl"){ stage.innerHTML = `<div class="sheet ref">${S.topic.expl}</div>`; return; }
  if(S.mode === "exam"){ startExam(); return; }
  if(S.topic.isErr){
    const keys = shuffle(openErrors()).slice(0,12);
    S.queue = keys.map(k => { const {t,g} = GEN_BY_KEY[k]; return makeTask(t,g); });
  } else {
    S.queue = drawTasks(S.topic, 12);
  }
  S.idx = 0; renderTask();
}

/* ---------- Eingabefelder ---------- */
function inputsHTML(task){
  return `<div class="fields">${fieldsOf(task).map((f,i) => `
    <div class="field"><label>${f.label || "Ergebnis"}</label>
      <div class="row"><input id="in${i}" autocomplete="off" spellcheck="false" placeholder="…">
        ${f.unit ? `<span class="unit">${f.unit}</span>` : ""}</div></div>`).join("")}</div>`;
}
const readInputs = task => fieldsOf(task).map((f,i) => ($("#in"+i) || {}).value || "");
function bindEnter(fn){
  document.querySelectorAll(".field input").forEach((el,i,arr) => {
    el.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      e.preventDefault();
      if(i < arr.length-1) arr[i+1].focus(); else fn();
    });
  });
  const first = $("#in0"); if(first) first.focus();
}

/* ---------- Übungsmodus ---------- */
function renderTask(){
  if(S.idx >= S.queue.length){
    if(!S.queue.length){
      stage.innerHTML = `<div class="sheet"><div class="qmeta">Nichts offen</div>
        <div class="qtext">Deine Fehlerliste ist leer.</div>
        <p class="qsub">Alles, was du falsch hattest, konntest du danach zweimal richtig.</p>
        <div class="actions"><button class="btn accent" data-act="home">Zu den Themen</button></div></div>`;
      return;
    }
    stage.innerHTML = `<div class="sheet"><div class="qmeta">Durchgang beendet</div>
      <div class="qtext">${S.runOk} von ${S.queue.length} richtig.</div>
      <p class="qsub">Der nächste Durchgang würfelt neue Zahlen. Was du falsch hattest, kommt häufiger dran.</p>
      <div class="actions"><button class="btn accent" data-act="again">Weiter üben</button>
        <button class="btn ghost" data-act="home">Anderes Thema</button></div></div>`;
    return;
  }
  if(S.idx === 0) S.runOk = 0;
  const t = S.queue[S.idx];
  const meta = `${S.topic.isErr || S.topic.mixOf ? t.tt + " · " : ""}${t.gl}`;
  const body = t.opts
    ? `<div class="answers">${t.opts.map((o,i) => `<button class="opt" data-act="opt" data-i="${i}">${o}</button>`).join("")}</div>`
    : inputsHTML(t) + `<div class="actions"><button class="btn accent" data-act="check">Prüfen</button></div>`;
  stage.innerHTML = `<div class="sheet"><div class="qmeta">${meta}</div>
    <div class="qtext">${t.q}</div>
    ${t.hint ? `<div class="qsub">Tipp: ${t.hint}</div>` : ""}
    ${body}<div class="verdict" id="verdict"></div>
    <div class="progress"><span>${S.idx+1} / ${S.queue.length}</span>
      <span class="pbar"><i style="width:${Math.round(S.idx/S.queue.length*100)}%"></i></span></div></div>`;
  if(!t.opts) bindEnter(checkTaskInput);
}
function finishTask(ok, t, mine){
  stats.all++; if(ok){ stats.ok++; stats.streak++; S.runOk++; } else stats.streak = 0;
  S.cleared = mark(t.key, ok);
  saveMEM(); updateStats();
  const note = S.topic.isErr ? `<span class="why">${ok ? (S.cleared ? "Aus der Fehlerliste gestrichen." : "Noch einmal richtig, dann ist die Aufgabenart raus.") : "Bleibt in der Fehlerliste."}</span>` : "";
  const v = $("#verdict");
  v.className = "verdict show " + (ok ? "ok" : "no");
  v.innerHTML = (ok ? "Richtig." : `Richtig wäre: <b>${esc(solutionOf(t))}</b>${mine ? ` — du hattest <b>${esc(mine)}</b>` : ""}`) +
    `<span class="why">${t.sol}</span>${note}
    <div class="actions"><button class="btn accent" data-act="next">Weiter</button></div>`;
}
function checkTaskInput(){
  const t = S.queue[S.idx];
  if($("#verdict").classList.contains("show")) return;
  const ins = readInputs(t);
  finishTask(checkTask(t, ins), t, ins.join(" · "));
}

/* ---------- Klassenarbeit ---------- */
function startExam(){
  const n = S.topic.mixOf ? 14 : 10;
  S.exam = {tasks:drawTasks(S.topic, n), idx:0, answers:[], t0:Date.now(), done:false};
  renderExam();
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }
function examBar(){
  const e = S.exam, total = e.tasks.length;
  return `<div class="exambar"><span class="tag">Klassenarbeit</span>
    <span>Aufgabe ${e.idx+1} von ${total}</span><span id="clock">00:00</span>
    <span>keine Rückmeldung bis zum Schluss</span></div>`;
}
function renderExam(){
  const e = S.exam;
  if(e.idx >= e.tasks.length) return renderExamResult();
  const t = e.tasks[e.idx];
  const body = t.opts
    ? `<div class="answers">${t.opts.map((o,i) => `<button class="opt" data-act="examopt" data-i="${i}">${o}</button>`).join("")}</div>`
    : inputsHTML(t) + `<div class="actions"><button class="btn exam" data-act="examnext">${e.idx === e.tasks.length-1 ? "Abgeben" : "Weiter"}</button>
        <button class="btn ghost" data-act="examskip">Überspringen</button></div>`;
  stage.innerHTML = `<div class="sheet exam">${examBar()}
    <div class="qmeta">${S.topic.mixOf ? t.tt + " · " : ""}${t.gl}</div>
    <div class="qtext">${t.q}</div>
    ${t.hint ? `<div class="qsub">Tipp: ${t.hint}</div>` : ""}
    ${body}
    <div class="progress"><span>${e.idx+1} / ${e.tasks.length}</span>
      <span class="pbar exam"><i style="width:${Math.round(e.idx/e.tasks.length*100)}%"></i></span></div></div>`;
  if(!t.opts) bindEnter(() => examNext());
  stopTimer();
  S.timer = setInterval(() => {
    const el = $("#clock"); if(!el) return stopTimer();
    const s = Math.floor((Date.now()-e.t0)/1000);
    el.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  }, 1000);
}
function examNext(ans){
  const e = S.exam, t = e.tasks[e.idx];
  e.answers[e.idx] = ans !== undefined ? ans : readInputs(t);
  e.idx++;
  renderExam();
}
const NOTEN = [[87,"1"],[73,"2"],[59,"3"],[45,"4"],[18,"5"],[0,"6"]];
function renderExamResult(){
  stopTimer();
  const e = S.exam;
  let pts = 0, max = 0;
  const rows = e.tasks.map((t,i) => {
    const p = fieldsOf(t).length > 1 ? 2 : 1;
    max += p;
    const ans = e.answers[i];
    const ok = t.opts ? ans === t.ai : (Array.isArray(ans) && checkTask(t, ans));
    if(ok) pts += p;
    mark(t.key, ok);
    const mine = t.opts ? (ans == null ? "—" : t.opts[ans]) : (Array.isArray(ans) ? ans.filter(Boolean).join(" · ") || "—" : "—");
    const good = t.opts ? t.opts[t.ai] : solutionOf(t);
    return `<div class="rev ${ok?"okrow":"norow"}"><div class="rq">${t.q}</div>
      <div class="ra">Deine Antwort: <span class="${ok?"good":"mine"}">${esc(mine)}</span>${ok?"":` · richtig: <span class="good">${esc(good)}</span>`} <span style="color:var(--ink-3)">(${ok?p:0}/${p} P.)</span></div>
      ${ok ? "" : `<div class="sol">${t.sol}</div>`}</div>`;
  }).join("");
  const proz = Math.round(pts/max*1000)/10;
  const note = NOTEN.find(([g]) => proz >= g)[1];
  const secs = Math.floor((Date.now()-e.t0)/1000);
  const zeit = `${Math.floor(secs/60)} min ${secs%60} s`;
  const best = MEM.exams[S.topic.id];
  if(best == null || proz > best) MEM.exams[S.topic.id] = proz;
  saveMEM(); updateStats();
  stage.innerHTML = `<div class="sheet exam">
    <div class="qmeta">Klassenarbeit · ${S.topic.title}</div>
    <div class="result"><div class="note">${note}</div>
      <div class="meta">${pts} von ${max} Punkten · ${fmt(proz,1)} %<br>Zeit: ${zeit}${best != null ? `<br>Bisher beste: ${fmt(best,1)} %` : ""}</div></div>
    <div class="qsub">Notenschlüssel: ab 87 % → 1 · 73 % → 2 · 59 % → 3 · 45 % → 4 · 18 % → 5</div>
    <div class="actions"><button class="btn exam" data-act="examagain">Neue Arbeit schreiben</button>
      <button class="btn ghost" data-act="home">Zu den Themen</button></div>
    <div class="review">${rows}</div></div>`;
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- Statistik oben ---------- */
function updateStats(){
  $("#statOk").textContent = stats.ok;
  $("#statAll").textContent = stats.all;
  $("#statStreak").textContent = stats.streak;
  const n = openErrors().length;
  $("#statErr").textContent = n;
  $("#errChip").hidden = !n;
}

/* ---------- Klicks ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;
  if(a === "topic")  return openTopic(el.dataset.id);
  if(a === "mode")   return setMode(el.dataset.m);
  if(a === "sub"){ S.sub = el.dataset.s || null; renderSubTabs(); startMode(); return; }
  if(a === "home")   return renderHome();
  if(a === "again"){ startMode(); return; }
  if(a === "next"){ S.idx++; renderTask(); return; }
  if(a === "check")  return checkTaskInput();
  if(a === "opt"){
    const t = S.queue[S.idx], i = +el.dataset.i;
    if($("#verdict").classList.contains("show")) return;
    document.querySelectorAll(".opt").forEach((b,k) => {
      b.disabled = true;
      if(k === t.ai) b.classList.add("right"); else if(k === i) b.classList.add("wrong");
    });
    return finishTask(i === t.ai, t, t.opts[i]);
  }
  if(a === "examnext")  return examNext();
  if(a === "examskip")  return examNext([]);
  if(a === "examopt")   return examNext(+el.dataset.i);
  if(a === "examagain"){ startExam(); return; }
});
$("#btnBack").addEventListener("click", renderHome);

renderHome();
updateStats();

/* ============================================================
   Lernstand liegt im localStorage (Schlüssel rechenheft-v1):
   Fehlerspeicher pro Aufgabenart und beste Klassenarbeit je
   Thema. Für geräteübergreifende Speicherung Store.load/save
   gegen Supabase tauschen.
   ============================================================ */
</script>
</body>
</html>
