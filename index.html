T({id:"questions", kat:"Grammatik", title:"Fragen & Question Tags", desc:"Fragen bilden und Bestätigung einholen.",
expl:`<p class="lead">Englische Fragen brauchen fast immer ein Hilfsverb — und zwar an zweiter Stelle, direkt nach dem Fragewort.</p>
<h3>Die Wortstellung</h3>
<div class="ex"><b>(Fragewort) – Hilfsverb – Subjekt – Verb – Rest</b><br>
<i>Where <b>do</b> you live? · What <b>are</b> you doing? · When <b>did</b> she leave?</i></div>
<ol class="steps">
<li>Ist ein Hilfsverb schon da (be, have, will, can)? Dann rückt es einfach nach vorn: <i>She is coming → Is she coming?</i></li>
<li>Sonst braucht man <b>do / does / did</b>: <i>He plays → Does he play?</i></li>
<li>Das Hauptverb steht danach in der <b>Grundform</b>.</li>
</ol>
<div class="rule"><b>Subjektfragen brauchen kein do!</b> Wenn man nach dem Subjekt fragt, bleibt der Satz normal:<br>
<i><b>Who</b> broke the window?</i> — nicht <i>Who did break …</i></div>
<h3>Question Tags</h3>
<div class="rule">Das kurze Anhängsel am Satzende („… oder?“). Zwei Regeln genügen:<br>
1. Positiver Satz → <b>negativer</b> Tag, negativer Satz → <b>positiver</b> Tag.<br>
2. Im Tag wiederholt man das Hilfsverb und das Subjekt als Pronomen.</div>
<div class="ex"><i>You are coming, <b>aren't you</b>? · She doesn't smoke, <b>does she</b>? ·
He can swim, <b>can't he</b>? · They went home, <b>didn't they</b>?</i></div>
<div class="rule">Sonderfall: <i>I am … , <b>aren't I</b>?</i></div>`,
subs:{
 "Fragen bilden":[
  {t:"mc",q:"Welche Frage ist richtig?",opts:["Where you live?","Where do you live?","Where you do live?","Where lives you?"],ai:1,
   sol:"Fragewort – Hilfsverb – Subjekt – Verb: <b>Where do you live?</b>"},
  {t:"mc",q:`${en("___ broke the window?")}`,opts:["Who did","Who","Whom did","What did"],ai:1,
   sol:"Subjektfrage → kein do: <b>Who broke the window?</b>"},
  {t:"order",de:"Wann hat der Film angefangen?",a:["When","did","the","film","start"],end:"?"},
  {t:"order",de:"Wie lange lernst du schon Englisch?",a:["How","long","have","you","been","learning","English"],end:"?"}],
 "Question Tags":[
  {t:"mc",q:`${en("You're coming with us, ___ ?")}`,opts:["are you","aren't you","don't you","isn't it"],ai:1,
   sol:"Positiver Satz → negativer Tag: <b>aren't you</b>."},
  {t:"mc",q:`${en("She doesn't like coffee, ___ ?")}`,opts:["does she","doesn't she","is she","did she"],ai:0,
   sol:"Negativer Satz → positiver Tag: <b>does she</b>."},
  {t:"mc",q:`${en("They went home early, ___ ?")}`,opts:["did they","didn't they","don't they","weren't they"],ai:1,
   sol:"Simple Past → <b>didn't they</b>."},
  {t:"card",front:"Question Tag bilden",back:"Gegenteil des Satzes + Hilfsverb + Pronomen",
   extra:"He can swim, can't he? · You have finished, haven't you? · I'm right, aren't I?"}]}});
</script>
<script>
/* ---------------- WÖRTER & SATZBAU ---------------- */

T({id:"wordorder", kat:"Wörter & Satzbau", title:"Wortstellung", desc:"SVO, Häufigkeitsadverbien, Ort vor Zeit.",
expl:`<p class="lead">Englisch hat eine viel strengere Wortstellung als Deutsch. Man kann Satzteile nicht einfach nach vorn ziehen.</p>
<h3>Die Grundordnung</h3>
<div class="ex"><b>Subjekt – Verb – Objekt</b><br><i>I</i> · <i>bought</i> · <i>a new bike</i></div>
<div class="rule"><b>Subjekt und Verb bleiben zusammen.</b> Zwischen sie darf kein Objekt und keine Zeitangabe.
Nicht <i>I bought yesterday a bike</i>, sondern <b>I bought a bike yesterday</b>.</div>
<h3>Ort vor Zeit</h3>
<div class="ex"><i>We went <b>to the cinema</b> (Ort) <b>last night</b> (Zeit).</i></div>
<p>Die Zeitangabe darf auch ganz an den Anfang: <i>Last night we went to the cinema.</i> — nur nicht in die Mitte.</p>
<h3>Häufigkeitsadverbien</h3>
<ol class="steps">
<li>always, often, usually, sometimes, never, already stehen <b>vor dem Vollverb</b>: <i>She <b>often</b> plays tennis.</i></li>
<li>Aber <b>nach be</b>: <i>He <b>is always</b> late.</i></li>
<li>Bei mehreren Verben: nach dem ersten Hilfsverb — <i>I have <b>never</b> been to London.</i></li>
</ol>
<div class="rule"><b>Merksatz:</b> „Mid-position“: mitten ins Verb hinein — hinter das erste Hilfsverb oder hinter be,
sonst direkt vor das Vollverb.</div>`,
subs:{
 "Satzstellung":[
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["I like very much this film.","I like this film very much.","Very much I like this film.","I very much like this film."],ai:1,
   sol:"Objekt direkt hinter das Verb: <b>I like this film very much.</b>"},
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["We go every Sunday to church.","We go to church every Sunday.","Every Sunday go we to church.","We to church go every Sunday."],ai:1,
   sol:"Ort vor Zeit: <b>to church every Sunday</b>."},
  {t:"order",de:"Ich habe gestern einen Brief geschrieben.",a:["I","wrote","a","letter","yesterday"],end:"."},
  {t:"order",de:"Wir fahren jeden Sommer nach Italien.",a:["We","go","to","Italy","every","summer"],end:"."},
  {t:"order",de:"Sie hat mir gestern eine E-Mail geschickt.",a:["She","sent","me","an","email","yesterday"],end:"."}],
 "Häufigkeitsadverbien":[
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["She goes never to bed early.","She never goes to bed early.","Never she goes to bed early.","She goes to bed never early."],ai:1,
   sol:"never steht vor dem Vollverb: <b>She never goes …</b>"},
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["He always is friendly.","He is always friendly.","Always he is friendly.","He is friendly always."],ai:1,
   sol:"Nach be: <b>He is always friendly.</b>"},
  {t:"order",de:"Ich bin noch nie in London gewesen.",a:["I","have","never","been","to","London"],end:"."},
  {t:"trans",q:"Sie kommt oft zu spät.",a:["she is often late","she's often late","she often comes late"],
   sol:"<i>She is often late.</i> — nach be steht das Adverb."}]}});

T({id:"prepositions", kat:"Wörter & Satzbau", title:"Präpositionen", desc:"in, on, at — Zeit, Ort und feste Wendungen.",
expl:`<p class="lead">Präpositionen lassen sich nicht übersetzen, sondern nur in Wendungen lernen. Für Zeit und Ort gibt es aber ein klares System.</p>
<h3>Zeit: in, on, at</h3>
<table class="tbl">
<tr><td class="f">at</td><td>Uhrzeit und feste Punkte</td><td class="e">at 6 o'clock, at night, at the weekend, at Christmas</td></tr>
<tr><td class="f">on</td><td>Tage und Daten</td><td class="e">on Monday, on 3rd May, on my birthday</td></tr>
<tr><td class="f">in</td><td>längere Zeiträume</td><td class="e">in May, in 2026, in summer, in the morning</td></tr>
</table>
<div class="rule"><b>Vom Kleinen zum Großen:</b> at (Punkt) → on (Tag) → in (Zeitraum).<br>
Merkwürdig, aber so: <i>in the morning</i>, aber <i><b>at</b> night</i>. Und britisch: <i><b>at</b> the weekend</i>.</div>
<h3>Ort: in, on, at</h3>
<table class="tbl">
<tr><td class="f">in</td><td>innerhalb</td><td class="e">in the box, in London, in bed</td></tr>
<tr><td class="f">on</td><td>auf einer Fläche</td><td class="e">on the table, on the wall, on the bus</td></tr>
<tr><td class="f">at</td><td>an einem Punkt oder Ereignis</td><td class="e">at the door, at school, at the party</td></tr>
</table>
<h3>Bewegung</h3>
<div class="ex">to (zu, nach) · into (hinein) · out of (heraus) · through (durch) · across (über … hinüber) ·
along (entlang) · from … to …<br>
<b>Aber:</b> <i>go <b>home</b></i> — ohne to!</div>
<div class="rule"><b>since und for:</b> since + Zeitpunkt (since Monday), for + Zeitraum (for two hours).</div>`,
subs:{
 "Zeit":[
  {t:"mc",q:`${en("The film starts ___ 8 o'clock.")}`,opts:["in","on","at","to"],ai:2,sol:"Uhrzeit → <b>at</b>."},
  {t:"mc",q:`${en("My birthday is ___ 12th June.")}`,opts:["in","on","at","of"],ai:1,sol:"Datum → <b>on</b>."},
  {t:"mc",q:`${en("We often go skiing ___ winter.")}`,opts:["in","on","at","by"],ai:0,sol:"Jahreszeit → <b>in</b>."},
  {t:"mc",q:`${en("What do you do ___ the weekend?")}`,opts:["in","on","at","by"],ai:2,sol:"Britisches Englisch: <b>at the weekend</b> (amerikanisch: on the weekend)."},
  {t:"match",title:"Zeitangaben zuordnen",pairs:[["at","7.30"],["on","Friday"],["in","2026"],["at","night"],["in","the morning"],["on","New Year's Day"]]}],
 "Ort & Bewegung":[
  {t:"mc",q:`${en("Your book is ___ the table.")}`,opts:["in","on","at","to"],ai:1,sol:"Fläche → <b>on</b>."},
  {t:"mc",q:`${en("She is waiting ___ the bus stop.")}`,opts:["in","on","at","by"],ai:2,sol:"Punkt/Ort → <b>at</b>."},
  {t:"mc",q:`${en("I'm going ___ home now.")}`,opts:["to","at","in","—"],ai:3,sol:"<b>go home</b> steht ohne Präposition."},
  {t:"match",title:"Bewegung",pairs:[["in etwas hinein","into"],["aus etwas heraus","out of"],["durch","through"],["über … hinüber","across"],["entlang","along"],["um … herum","around"]]}],
 "Feste Wendungen":[
  {t:"match",title:"Verb + Präposition",pairs:[["auf jdn warten","wait for"],["nach etwas fragen","ask for"],["auf etwas achten","look after"],["sich freuen auf","look forward to"],["Angst haben vor","be afraid of"],["gut sein in","be good at"]]},
  {t:"mc",q:`${en("I'm looking forward ___ the holidays.")}`,opts:["for","to","at","on"],ai:1,
   sol:"look forward <b>to</b> — und danach die ing-Form: looking forward to seeing you."},
  {t:"mc",q:`${en("She's waiting ___ her friend.")}`,opts:["on","for","at","to"],ai:1,sol:"wait <b>for</b> somebody."},
  {t:"trans",q:"Ich freue mich auf die Ferien.",a:["i'm looking forward to the holidays","i am looking forward to the holidays"],
   sol:"<i>I'm looking forward to the holidays.</i>"}]}});

T({id:"phrasal", kat:"Wörter & Satzbau", title:"Phrasal Verbs", desc:"Verb plus kleines Wort — mit ganz neuer Bedeutung.",
expl:`<p class="lead">Ein Phrasal Verb ist ein Verb mit einer Partikel. Zusammen bedeuten sie oft etwas völlig anderes als das Verb allein.</p>
<div class="ex"><i>look</i> = schauen · <i>look after</i> = sich kümmern um · <i>look for</i> = suchen ·
<i>look forward to</i> = sich freuen auf · <i>look up</i> = nachschlagen</div>
<div class="rule"><b>Deshalb kann man sie nicht zusammensetzen</b> — man muss sie als eigene Vokabel lernen,
so wie im Deutschen „aufgeben“ und „angeben“ nichts miteinander zu tun haben.</div>
<h3>Trennbar oder nicht?</h3>
<ol class="steps">
<li>Viele sind <b>trennbar</b>: <i>turn <b>on</b> the light</i> = <i>turn the light <b>on</b></i>.</li>
<li>Steht ein <b>Pronomen</b> als Objekt, muss es dazwischen: <i>turn <b>it</b> on</i> — nicht <i>turn on it</i>.</li>
<li>Andere sind <b>untrennbar</b>: <i>look after the children</i> — nie <i>look the children after</i>.</li>
</ol>`,
subs:{
 "Bedeutung":[
  {t:"match",title:"Häufige Phrasal Verbs",pairs:[["suchen","look for"],["sich kümmern um","look after"],["nachschlagen","look up"],["anziehen","put on"],["ausziehen","take off"],["aufgeben","give up"]]},
  {t:"match",title:"Noch mehr",pairs:[["herausfinden","find out"],["sich gut verstehen mit","get on with"],["anrufen","ring up"],["aufwachsen","grow up"],["absagen","call off"],["sich um etw. kümmern / erledigen","deal with"]]},
  {t:"mc",q:`${en("Can you ___ this word in the dictionary?")}`,opts:["look after","look for","look up","look forward"],ai:2,
   sol:"nachschlagen → <b>look up</b>."},
  {t:"mc",q:`${en("She has to ___ her little brother tonight.")}`,opts:["look for","look after","look up","look at"],ai:1,
   sol:"sich kümmern um → <b>look after</b>."},
  {t:"mc",q:`${en("Don't ___ ! You can do it.")}`,opts:["give up","give in","give away","give out"],ai:0,sol:"aufgeben → <b>give up</b>."}],
 "Stellung":[
  {t:"mc",q:"Welcher Satz ist richtig?",opts:["Turn on it.","Turn it on.","Turn on the it.","It turn on."],ai:1,
   sol:"Pronomen stehen immer dazwischen: <b>Turn it on.</b>"},
  {t:"mc",q:"Welcher Satz ist falsch?",opts:["Put on your jacket.","Put your jacket on.","Put it on.","Put on it."],ai:3,
   sol:"<b>Put on it</b> ist falsch — bei Pronomen wird getrennt."},
  {t:"trans",q:"Zieh deine Schuhe aus!",a:["take off your shoes","take your shoes off"],
   sol:"<i>Take off your shoes.</i> oder <i>Take your shoes off.</i> — beides geht."}]}});

T({id:"confusables", kat:"Wörter & Satzbau", title:"Typische Fehler & False Friends", desc:"Wörter, die im Deutschen anders funktionieren.",
expl:`<p class="lead">Die meisten Fehler in Klassenarbeiten sind keine Grammatikfehler, sondern Wörter, die man aus dem Deutschen falsch überträgt.</p>
<h3>False Friends</h3>
<table class="tbl">
<tr><th>Deutsch</th><th>falsch</th><th>richtig</th></tr>
<tr><td>bekommen</td><td class="e">become</td><td class="e">get</td></tr>
<tr><td>Chef</td><td class="e">chef (= Koch)</td><td class="e">boss</td></tr>
<tr><td>Gift</td><td class="e">gift (= Geschenk)</td><td class="e">poison</td></tr>
<tr><td>eventuell</td><td class="e">eventually (= schließlich)</td><td class="e">possibly, maybe</td></tr>
<tr><td>Handy</td><td class="e">handy (= praktisch)</td><td class="e">mobile phone</td></tr>
<tr><td>sensibel</td><td class="e">sensible (= vernünftig)</td><td class="e">sensitive</td></tr>
<tr><td>bald</td><td class="e">bald (= kahl)</td><td class="e">soon</td></tr>
<tr><td>Rat / Ratschlag</td><td class="e">advices</td><td class="e">advice (nie Plural)</td></tr>
</table>
<h3>Wörter, die man leicht verwechselt</h3>
<table class="tbl">
<tr><td class="f">say / tell</td><td>say something · tell somebody something</td></tr>
<tr><td class="f">make / do</td><td>make = herstellen · do = tun, erledigen</td></tr>
<tr><td class="f">borrow / lend</td><td>borrow = sich leihen · lend = verleihen</td></tr>
<tr><td class="f">learn / teach</td><td>learn = lernen · teach = unterrichten</td></tr>
<tr><td class="f">its / it's</td><td>its = sein/ihr · it's = it is</td></tr>
<tr><td class="f">their / there / they're</td><td>ihr · dort · they are</td></tr>
</table>
<div class="rule"><b>Kein Plural:</b> information, advice, news, furniture, homework, money.
<i>The news <b>is</b> good.</i> — trotz -s ein Singular.</div>`,
subs:{
 "False Friends":[
  {t:"mc",q:"Wie heißt „Ich habe ein Geschenk bekommen“?",
   opts:["I became a gift.","I got a present.","I become a present.","I got a gift from becoming."],ai:1,
   sol:"become heißt „werden“. Bekommen = <b>get</b>."},
  {t:"mc",q:"Wie heißt „Mein Chef ist nett“?",opts:["My chef is nice.","My boss is nice.","My chief is nice.","My cook is nice."],ai:1,
   sol:"chef ist der Koch. Chef = <b>boss</b>."},
  {t:"mc",q:`${en("He gave me some good ___ .")}`,opts:["advices","advice","advise","advices'"],ai:1,
   sol:"advice hat keinen Plural: <b>some good advice</b>."},
  {t:"match",title:"False Friends",pairs:[["bekommen","get"],["Gift","poison"],["Handy","mobile phone"],["sensibel","sensitive"],["eventuell","possibly"],["bald","soon"]]}],
 "Verwechslungsgefahr":[
  {t:"mc",q:`${en("She ___ me a story.")}`,opts:["said","told","says","spoke"],ai:1,
   sol:"tell + Person: <b>told me</b>. say ohne Person: she said something."},
  {t:"mc",q:`${en("Can I ___ your pen?")}`,opts:["lend","borrow","rent","give"],ai:1,
   sol:"Sich etwas leihen → <b>borrow</b>. Jemandem etwas leihen → lend."},
  {t:"mc",q:`${en("My mother ___ maths at our school.")}`,opts:["learns","teaches","studies","learned"],ai:1,
   sol:"unterrichten → <b>teaches</b>."},
  {t:"mc",q:`${en("___ going to be late.")}`,opts:["Their","There","They're","Theirs"],ai:2,sol:"they are → <b>They're</b>."},
  {t:"trans",q:"Kannst du mir helfen, meine Hausaufgaben zu machen?",
   a:["can you help me do my homework","can you help me with my homework","could you help me do my homework"],
   sol:"<i>Can you help me do my homework?</i> — homework ohne Plural-s."}]}});

T({id:"connectors", kat:"Wörter & Satzbau", title:"Bindewörter & Textbausteine", desc:"Sätze verbinden und einen Text gliedern.",
expl:`<p class="lead">Ein guter Text besteht nicht aus schwierigen Wörtern, sondern aus Sätzen, die sichtbar zusammenhängen.</p>
<h3>Verbinden</h3>
<table class="tbl">
<tr><td class="f">and · but · or · so</td><td>und · aber · oder · also</td></tr>
<tr><td class="f">because · as · since</td><td>weil · da</td></tr>
<tr><td class="f">although · even though</td><td>obwohl</td></tr>
<tr><td class="f">however · nevertheless</td><td>jedoch · trotzdem</td></tr>
<tr><td class="f">while · whereas</td><td>während (Gegensatz)</td></tr>
</table>
<div class="rule"><b>because oder so?</b> <i>I stayed at home <b>because</b> it was raining.</i> (Grund)<br>
<i>It was raining, <b>so</b> I stayed at home.</i> (Folge) — die beiden Hälften tauschen die Plätze.</div>
<h3>Einen Text gliedern</h3>
<table class="tbl">
<tr><td class="f">first of all · to begin with</td><td>zuerst</td></tr>
<tr><td class="f">secondly · furthermore · in addition</td><td>zweitens · außerdem</td></tr>
<tr><td class="f">on the one hand … on the other hand</td><td>einerseits … andererseits</td></tr>
<tr><td class="f">for example · for instance</td><td>zum Beispiel</td></tr>
<tr><td class="f">in my opinion · I think</td><td>meiner Meinung nach</td></tr>
<tr><td class="f">all in all · to sum up · finally</td><td>alles in allem · zusammenfassend</td></tr>
</table>
<div class="rule"><b>Für Erörterungen:</b> Einleitung → Argument mit Beispiel → Gegenargument (<i>on the other hand</i>) →
Fazit (<i>all in all</i>). Vier Bausteine, die immer funktionieren.</div>`,
subs:{
 "Bindewörter":[
  {t:"mc",q:`${en("It was raining, ___ we stayed at home.")}`,opts:["because","so","although","but so"],ai:1,
   sol:"Folge → <b>so</b>."},
  {t:"mc",q:`${en("___ it was raining, we went for a walk.")}`,opts:["Because","So","Although","However"],ai:2,
   sol:"Gegensatz → <b>Although</b>."},
  {t:"mc",q:`${en("I like tea. ___ , I prefer coffee in the morning.")}`,opts:["Although","However","Because","So"],ai:1,
   sol:"Am Satzanfang mit Komma → <b>However</b>."},
  {t:"match",title:"Bindewörter",pairs:[["weil","because"],["obwohl","although"],["jedoch","however"],["außerdem","in addition"],["deshalb","therefore"],["während (Gegensatz)","whereas"]]}],
 "Textbausteine":[
  {t:"match",title:"Einen Text gliedern",pairs:[["zuerst","first of all"],["zweitens","secondly"],["zum Beispiel","for example"],["einerseits","on the one hand"],["andererseits","on the other hand"],["alles in allem","all in all"]]},
  {t:"card",front:"Aufbau einer Stellungnahme",back:"Einleitung · Argumente mit Beispiel · Gegenargument · Fazit",

/* Passt das Verb überhaupt in diese Zeit? Sonst wäre die falsche
   Antwort schon an der Verbform zu erkennen und man lernt nichts. */
function duelVerbOk(v, t){
  if(t === "present") return !NO_HAB.includes(v.inf) && !v.stat;
  if(t === "progressive" || t === "pastprog" || t === "perfectprog")
    return !NO_PROG.includes(v.inf) && !v.stat;
  return true;
}
const duelKtx = (a, b) => (DUEL_KTX[a] || []).filter(k => !k.auch.includes(b));

function duelSatz(k, s, v, form){
  const gross = !k.vor || /[.!?]\s*$/.test(k.vor);
  const sub = gross ? s.w.charAt(0).toUpperCase() + s.w.slice(1) : s.w;
  const mitte = form ? `<b>${form}</b>` : `___ (${v.inf})`;
  return `${k.vor || ""}${sub} ${mitte} ${v.obj}${k.nach || ""}.`;
}

/* ------------------------------------------------------------

------------------------------------------------------------- */
function duelGen(a, b){
  const A = DUEL_DT[a], B = DUEL_DT[b];
  const hand = DUEL_HAND[a + "|" + b] || [];
  const kA = duelKtx(a, b), kB = duelKtx(b, a);
  const autoOk = kA.length && kB.length;
  return {
    id:"duel_" + a + "_" + b, label:A.label + " ↔ " + B.label,
    za:a, zb:b, hand:hand.length, autoOk:!!autoOk, bag:[],

    handTask(){
      if(!this.bag.length) this.bag = shuffle(hand.slice());
      const it = Object.assign({}, this.bag.pop());
      if(it.opts && it.opts.length === 2 && Math.random() < .5){
        it.opts = [it.opts[1], it.opts[0]];
        it.ai = 1 - it.ai;
      }
      return it;
    },

    make(){
      /* Ohne brauchbare Kontexte auf beiden Seiten gibt es nur
         Handaufgaben — sonst wäre die Antwort vorhersagbar. */
      if(!autoOk) return this.handTask();
      if(hand.length && Math.random() < .4) return this.handTask();

      const ziel  = Math.random() < .5 ? a : b;
      const gegen = ziel === a ? b : a;
      const ks = ziel === a ? kA : kB;

      let k, s, v, fz, fg, n = 0;
      do {
        k = pick(ks);
        const basis = VERBS.filter(x => duelVerbOk(x, ziel) && duelVerbOk(x, gegen));
        let pool = basis;
        if(k.vb)       pool = basis.filter(x => DUEL_VG[k.vb].includes(x.inf));
        else if(k.dur) pool = basis.filter(DURATIV);
        if(!pool.length) pool = basis;
        s = pick(SUBJ); v = pick(pool);
        fz = DUEL_DT[ziel].form(s, v);
        fg = DUEL_DT[gegen].form(s, v);
        n++;
      } while(fz === fg && n < 12);          // z. B. read/read: dann wären beide Optionen gleich

      const satz = duelSatz(k, s, v, null);
      const loes = duelSatz(k, s, v, fz);
      const grund = `${DUEL_DT[ziel].label} — ${k.warum}<br>Richtig: <i>${loes}</i>`;

      /* Zwei Aufgabenarten: die reine Entscheidung und die Entscheidung
         samt Form. Bei gleicher Form bleibt nur die Entscheidung. */
      if(fz === fg || Math.random() < .5){
        const o = shuffle([{txt:DUEL_DT[ziel].label, ok:1}, {txt:DUEL_DT[gegen].label, ok:0}]);
        return {t:"mc", q:en(satz), hint:`${v.de} — welche Zeitform passt?`,
                opts:o.map(x => x.txt), ai:o.findIndex(x => x.ok), sol:grund};
      }
      const o = shuffle([{txt:fz, ok:1}, {txt:fg, ok:0}]);
      return {t:"mc", q:en(satz), hint:`${v.de} — welche Form passt?`,
              opts:o.map(x => x.txt), ai:o.findIndex(x => x.ok), sol:grund};
    }
  };
}

const DUEL_PAARE = [];
for(let i = 0; i < DUEL_T.length; i++)

/* Die Paare, die in Klassenarbeiten wirklich drankommen */
const DUEL_KLASSIKER = [
 ["present","progressive"], ["past","perfect"], ["past","pastprog"],

T({id:"tenseduel", kat:"Zeitformen", duel:true,
title:"Zwei Zeiten unterscheiden",
desc:"Du wählst zwei Zeitformen — und entscheidest dann Satz für Satz, welche von beiden passt.",
expl:`<p class="lead">Die Formen zu bilden ist das eine. Das andere — und das, woran es in der Klassenarbeit
hängt — ist die Entscheidung: <b>welche</b> Zeit gehört hier hin? Dieser Modus übt nur das.
Du suchst dir zwei Zeiten aus, und danach kommen Sätze, in denen genau eine der beiden richtig ist.</p>

<h3>Die Frage, die fast immer entscheidet</h3>
<p>Nicht „was ist passiert?“, sondern <b>„was will der Satz über die Zeit sagen?“</b>
Vier Fragen reichen meistens:</p>
<ol class="steps">
<li><b>Regelmäßig oder gerade jetzt?</b> → Simple Present gegen Present Progressive.</li>
<li><b>Abgeschlossen oder bis jetzt?</b> → Simple Past gegen Present Perfect.
  Faustregel: Sobald ein Zeitpunkt genannt wird, der vorbei ist (<i>yesterday, in 2019, last week</i>),
  geht nur Simple Past.</li>
<li><b>Ergebnis oder Dauer?</b> → Present Perfect gegen Present Perfect Progressive.
  Steht eine Zahl im Satz („three emails“), zählt das Ergebnis.</li>
<li><b>Vorhersage oder Plan?</b> → will gegen going to. Spontan und vermutet → will.
  Vorher entschieden oder jetzt schon absehbar → going to.</li>
</ol>

<h3>Signalwörter — aber mit Vorsicht</h3>
<table class="tbl">
<tr><th>Zeit</th><th>typische Signale</th></tr>
<tr><td>Simple Present</td><td class="e">every day, on Mondays, usually, always, twice a week</td></tr>
<tr><td>Present Progressive</td><td class="e">now, right now, at the moment, Look!, Listen!</td></tr>
<tr><td>Simple Past</td><td class="e">yesterday, last week, … ago, in 2019, When …?</td></tr>
<tr><td>Past Progressive</td><td class="e">while, when … (das andere lief schon)</td></tr>
<tr><td>Present Perfect</td><td class="e">already, yet, just, ever, never, so far, this week</td></tr>
<tr><td>Present Perfect Progressive</td><td class="e">How long …?, for, since — und es läuft noch</td></tr>
<tr><td>Past Perfect</td><td class="e">after, before, by the time, … already (in der Vergangenheit)</td></tr>
<tr><td>will-future</td><td class="e">I think, I'm sure, perhaps, probably, I promise</td></tr>
<tr><td>going to-future</td><td class="e">ein Plan, eine Absicht, sichtbare Anzeichen</td></tr>
</table>
<div class="rule"><b>Signalwörter sind Hinweise, keine Beweise.</b>
<i>for</i> und <i>since</i> stehen bei beiden Perfect-Formen, <i>when</i> bei Simple Past und
Past Progressive. Entscheidend bleibt der Sinn des Satzes.</div>

<h3>Die drei Fallen für Deutschsprachige</h3>
<ol class="steps">
<li><b>„Ich habe es gestern gemacht“ ist nicht <i>I have done it yesterday</i>.</b>
  Das deutsche Perfekt ist kein englisches Present Perfect. Mit <i>yesterday</i> nur Simple Past.</li>
<li><b>Zustandsverben kennen keine Verlaufsform.</b>
  <i>know, understand, like, want, believe, need, see, hear</i> — nie mit -ing.</li>
<li><b>Nach <i>When …?</i> als Frage steht Simple Past.</b>
  <i>When did you buy it?</i> — nie <i>When have you bought it?</i></li>
</ol>

<h3>So läuft der Modus</h3>
<p>Zwei Zeiten auswählen, dann 12 Aufgaben pro Durchgang. Mal stehen die beiden
<b>Namen</b> der Zeitformen zur Wahl, mal die beiden fertigen <b>Verbformen</b>.
Unter jeder Lösung steht, woran man es erkennt. Was du falsch hattest, landet in der
Fehlerliste auf der Startseite und kommt häufiger dran — zweimal richtig, und es ist wieder raus.
Über „Klassenarbeit“ bekommst du dasselbe Paar ohne Rückmeldung und mit Note am Ende.</p>`,
gens: DUEL_GENS,
mixGens: DUEL_KLASSIKER.map(([a,b]) => DUEL_BY_ID["duel_" + a + "_" + b])
});

function duelStand(g){
  const e = MEM.gens["tenseduel:" + g.id];
  if(!e || !(e.r + e.w)) return "noch nicht geübt";
  return `${e.r} richtig${e.w ? " · " + e.w + " offen" : ""}`;
}

    <div class="grid">${DUEL_KLASSIKER.map(([a,b]) => {
      const g = DUEL_BY_ID["duel_" + a + "_" + b];

        <span class="tname">${g.label}</span>

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el || !S.topic || !S.topic.duel) return;
  const a = el.dataset.act;

  if(a === "duelsel"){
    const z = el.dataset.z, sel = S.duelSel || (S.duelSel = []);

    if(i >= 0) sel.splice(i, 1);

    S.sub = g.id;

    return;
  }
  if(a === "duelback"){
    S.sub = null; stopTimer();
    renderSubTabs(); startMode();
    return;
  }
});


const $ = s => document.querySelector(s);
const stage = $("#stage");
const KATS = ["Zeitformen","Grammatik","Wörter & Satzbau"];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* Aus den Aufgabenlisten je Unterthema werden Generatoren, die
   ohne Wiederholung ziehen. Echte Generatoren kommen dahinter. */
TOPICS.forEach(t => {
  const extra = t.gens || [];
  const out = [];
  Object.keys(t.subs || {}).forEach(name => {
    out.push({id:slug(name), label:name, items:t.subs[name], bag:[],
      make(){ if(!this.bag.length) this.bag = shuffle(this.items.slice()); return Object.assign({}, this.bag.pop()); }});
  });
  extra.forEach(g => out.push(g));
  t.gens = out;
});
/* Gemischte Themen je Bereich */
KATS.forEach(k => TOPICS.push({id:"mix-"+slug(k), kat:k, mixOf:k, title:k + " — gemischt",
  desc:`Aufgaben aus allen Themen des Bereichs ${k}. Gut als Klassenarbeit.`, gens:[]}));
/* mixGens: Themen dürfen für die gemischte Arbeit eine kleinere Auswahl angeben. */
TOPICS.forEach(t => { if(t.mixOf) t.gens = TOPICS.filter(x => x.kat === t.mixOf && !x.mixOf).flatMap(x => (x.mixGens || x.gens).map(g => Object.assign({}, g, {_t:x}))); });

const TOPIC_BY_ID = {}; TOPICS.forEach(t => TOPIC_BY_ID[t.id] = t);
const GEN_BY_KEY = {};
TOPICS.forEach(t => t.gens.forEach(g => { if(!g._t) GEN_BY_KEY[t.id+":"+g.id] = {t, g}; }));

function makeTask(t, g){
  const src = g._t || t;
  const task = g.make.call(g);
  task.key = src.id + ":" + g.id;
  task.gl = g.label;
  task.tt = src.title;
  if(!task.t) task.t = task.opts ? "mc" : "fill";
  return task;
}
const fieldsOf = task => task.fields || [{label:task.label || "Antwort", a:task.a}];
/* Übersetzungen als richtigen Satz anzeigen, nicht in Kleinschreibung */
const EN_NAMEN = ["rome","london","paris","spanish","english","french","german","ireland","america",
  "monday","tuesday","wednesday","thursday","friday","saturday","sunday","york","berlin"];
const prettyEn = (s, q) => {
  let out = String(s).replace(/\bi\b/g, "I");
  EN_NAMEN.forEach(n => {
    out = out.replace(new RegExp("\\b" + n + "\\b", "gi"), n.charAt(0).toUpperCase() + n.slice(1));
  });
  out = out.replace(/(^|[.!?]\s+)([a-zä-ü])/g, (m0, a, b) => a + b.toUpperCase());
  if(!/[.!?]$/.test(out)) out += /\?\s*$/.test(String(q || "")) ? "?" : ".";
  return out;
};
function solutionOf(task){
  if(task.t === "mc") return task.opts[task.ai];
  if(task.t === "order") return joinWords(task.a) + (task.end || "");
  if(task.t === "match") return task.pairs.map(p => p[1]).join(" · ");
  if(task.t === "trans") return prettyEn(fieldsOf(task)[0].a[0], task.q);
  return fieldsOf(task).map(f => f.a[0]).join(" · ");
}
const joinWords = arr => arr.reduce((s,w) => !s ? w : (/^[,.!?]/.test(w) ? s+w : s+" "+w), "");

/* ---------- Lernstand ---------- */
const SKEY = "wordbook-v1";
const Store = {
  load(){ try { return JSON.parse(localStorage.getItem(SKEY)) || null; } catch(e){ return null; } },
  save(d){ try { localStorage.setItem(SKEY, JSON.stringify(d)); } catch(e){} }
};
const MEM = Object.assign({gens:{}, exams:{}}, Store.load() || {});
const saveMEM = () => Store.save(MEM);
const rec = k => MEM.gens[k] || (MEM.gens[k] = {r:0, w:0, s:0});
function mark(key, ok){
  if(!key || !GEN_BY_KEY[key]) return false;
  const e = rec(key);
  if(!ok){ e.w++; e.s = 0; return false; }
  e.r++; e.s++;
  if(e.s >= 2 && e.w > 0){ e.w = 0; return true; }
  return false;
}
const openErrors = () => Object.keys(MEM.gens).filter(k => MEM.gens[k].w > 0 && GEN_BY_KEY[k]);
function weight(key){
  const e = MEM.gens[key];
  if(!e) return 2;
  if(e.w === 0 && e.r >= 2) return 0.6;
  if(e.w > e.r) return 4;
  return e.w > 0 ? 3 : 1.2;
}

const stats = {ok:0, all:0, streak:0};
let S = {topic:null, mode:"ueben", sub:null, queue:[], idx:0, runOk:0, exam:null, timer:null, cleared:false};

/* ---------- Aufgaben ziehen ---------- */
const EXAM_TYPES = ["mc","fill","trans","fields","order"];
function drawTasks(t, n, forExam){
  const gs = S.sub ? t.gens.filter(g => g.id === S.sub) : t.gens;
  const list = gs.length ? gs : t.gens;
  const base = shuffle(list), out = [];
  for(let i = 0; i < n; i++){
    let g, task, tries = 0;
    do {
      g = i < base.length && !forExam ? base[i] : (forExam && i < base.length ? base[i] : wpick(list, t));
      task = makeTask(t, g);
      tries++;
    } while(forExam && !EXAM_TYPES.includes(task.t) && tries < 12);
    if(forExam && !EXAM_TYPES.includes(task.t)) continue;
    out.push(task);
  }
  return shuffle(out);
}
function wpick(list, t){
  const ws = list.map(g => weight((g._t || t).id + ":" + g.id));
  let r = Math.random() * ws.reduce((a,b) => a+b, 0), k = 0;
  while(k < list.length-1 && r > ws[k]){ r -= ws[k]; k++; }
  return list[k];
}

    return;
  }
  if(S.mode !== "ueben" || S.topic.isErr || S.topic.mixOf || S.topic.gens.length < 2){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<button class="subbtn" data-act="sub" data-s="" aria-selected="${!S.sub}">Alle Aufgaben</button>` +
    S.topic.gens.map(g => `<button class="subbtn" data-act="sub" data-s="${g.id}" aria-selected="${S.sub===g.id}">${g.label}</button>`).join("");
}
function setMode(mo){
  const paar = S.topic.duel ? S.sub : null;        // gewähltes Zeitenpaar über den Moduswechsel retten
  S.mode = mo; S.sub = paar; stopTimer();
  [...document.querySelectorAll("#modeTabs .mode")].forEach(b => b.setAttribute("aria-selected", b.dataset.m === mo));
  renderSubTabs(); startMode();
}
function startMode(){
  if(S.mode === "expl"){ stage.innerHTML = `<div class="sheet ref">${S.topic.expl}</div>`; return; }
  if(S.topic.duel && !S.sub) return renderDuelPick();   // erst die beiden Zeiten wählen
  if(S.mode === "exam"){ startExam(); return; }
  if(S.topic.isErr){
    S.queue = shuffle(openErrors()).slice(0,12).map(k => { const {t,g} = GEN_BY_KEY[k]; return makeTask(t,g); });
  } else S.queue = drawTasks(S.topic, 12, false);
  S.idx = 0; S.runOk = 0; renderTask();
}

/* ---------- Bausteine ---------- */
function inputsHTML(task){
  return `<div class="fields">${fieldsOf(task).map((f,i) => `
    <div class="field"><label>${f.label || "Antwort"}</label>
      <input id="in${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…"></div>`).join("")}</div>`;
}
const readInputs = task => fieldsOf(task).map((f,i) => ($("#in"+i) || {}).value || "");
function bindEnter(fn){
  const arr = [...document.querySelectorAll(".field input")];
  arr.forEach((el,i) => el.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    e.preventDefault();
    if(i < arr.length-1) arr[i+1].focus(); else fn();
  }));
  if(arr[0]) arr[0].focus();
}
function judgeTask(task, ins){
  if(task.t === "mc") return ins === task.ai ? "ok" : "no";
  const rs = fieldsOf(task).map((f,i) => judge(ins[i], f.a));
  if(rs.every(r => r === "ok")) return "ok";
  if(rs.every(r => r !== "no")) return "almost";
  return "no";
}
function bodyHTML(task, examMode){
  const pre = examMode ? "exam" : "";
  if(task.t === "mc")
    return `<div class="answers">${task.opts.map((o,i) =>
      `<button class="opt" data-act="${pre}opt" data-i="${i}">${o}</button>`).join("")}</div>`;
  if(task.t === "order")
    return `<div class="slots" id="slots"><span class="empty">Hier entsteht dein Satz</span></div>
      <div class="pool" id="pool">${shuffle(task.a.map((w,i) => ({w,i})))
        .map(o => `<button class="word" data-act="word" data-i="${o.i}">${esc(o.w)}</button>`).join("")}</div>
      <div class="actions"><button class="btn ${examMode?"exam":"accent"}" data-act="${pre}check">${examMode?"Weiter":"Prüfen"}</button></div>`;
  return inputsHTML(task) +
    `<div class="actions"><button class="btn ${examMode?"exam":"accent"}" data-act="${pre}check">${examMode?"Weiter":"Prüfen"}</button>
     ${examMode?`<button class="btn ghost" data-act="examskip">Überspringen</button>`:""}</div>`;
}

/* ---------- Übungsmodus ---------- */
function renderTask(){
  if(S.idx >= S.queue.length){
    if(!S.queue.length){
      stage.innerHTML = `<div class="sheet"><div class="qmeta">Nichts offen</div>
        <div class="qtext">Deine Fehlerliste ist leer.</div>
        <p class="qsub">Alles, was du falsch hattest, konntest du danach zweimal richtig.</p>
        <div class="actions"><button class="btn accent" data-act="home">Zu den Themen</button></div></div>`;
      return;
    }
    stage.innerHTML = `<div class="sheet"><div class="qmeta">Durchgang beendet</div>
      <div class="qtext">${S.runOk} von ${S.queue.length} richtig.</div>
      <p class="qsub">Der nächste Durchgang mischt neu. Was du falsch hattest, kommt häufiger dran.</p>
      <div class="actions"><button class="btn accent" data-act="again">Weiter üben</button>
        <button class="btn ghost" data-act="home">Anderes Thema</button></div></div>`;
    return;
  }
  const t = S.queue[S.idx];
  const meta = `${S.topic.isErr || S.topic.mixOf ? t.tt + " · " : ""}${t.gl}`;
  const prog = `<div class="progress"><span>${S.idx+1} / ${S.queue.length}</span>
    <span class="pbar"><i style="width:${Math.round(S.idx/S.queue.length*100)}%"></i></span></div>`;

  if(t.t === "card"){
    stage.innerHTML = `<div class="sheet"><div class="qmeta">${meta}</div>
      <div class="flash" data-act="flip"><div class="hint">Karte antippen zum Umdrehen</div>
        <div class="front">${esc(t.front)}</div>
        <div id="cardBack" hidden><div class="back">${esc(t.back)}</div>
        ${t.extra ? `<div class="extra">${esc(t.extra)}</div>` : ""}</div></div>
      <div class="actions" id="cardBtns" hidden>
        <button class="btn ghost" data-act="again2">Nochmal üben</button>
        <button class="btn accent" data-act="know">Wusste ich</button></div>${prog}</div>`;
    return;
  }
  if(t.t === "match"){
    const left = t.pairs.map((p,i) => ({t:p[0], i}));
    const right = shuffle(t.pairs.map((p,i) => ({t:p[1], i})));
    stage.innerHTML = `<div class="sheet"><div class="qmeta">${meta}</div>
      <div class="qtext">${esc(t.title)}</div>
      <div class="qsub">Links antippen, dann rechts die passende Entsprechung.</div>
      <div class="match"><div class="col">${left.map(o => `<button class="mitem" data-act="m" data-side="l" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div>
      <div class="col">${right.map(o => `<button class="mitem" data-act="m" data-side="r" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div></div>
      <div class="verdict" id="verdict"></div>${prog}</div>`;
    S.sel = null; S.left = t.pairs.length; S.missed = false;
    return;
  }
  const label = t.t === "trans" ? "Übersetze ins Englische" : "";
  stage.innerHTML = `<div class="sheet"><div class="qmeta">${meta}</div>
    ${label ? `<div class="qsub" style="margin:0 0 8px">${label}</div>` : ""}
    <div class="qtext">${t.t === "order" ? esc(t.de) : t.q}</div>
    ${t.hint ? `<div class="qsub">${esc(t.hint)}</div>` : ""}
    ${t.t === "order" ? `<div class="qsub">Setze die Wörter in die richtige Reihenfolge.</div>` : ""}
    ${bodyHTML(t, false)}<div class="verdict" id="verdict"></div>${prog}</div>`;
  if(t.t === "order") S.picked = [];
  else bindEnter(check);
}
function finish(res, t, mine){
  const ok = res !== "no";
  stats.all++; if(ok){ stats.ok++; stats.streak++; S.runOk++; } else stats.streak = 0;
  S.cleared = mark(t.key, ok);
  saveMEM(); updateStats();
  const note = S.topic.isErr ? `<span class="why">${ok ? (S.cleared ? "Aus der Fehlerliste gestrichen." : "Noch einmal richtig, dann ist sie raus.") : "Bleibt in der Fehlerliste."}</span>` : "";
  const v = $("#verdict");
  v.className = "verdict show " + (res === "ok" ? "ok" : res === "almost" ? "almost" : "no");
  const head = res === "ok" ? "Richtig."
    : res === "almost" ? `Fast — achte auf den Apostroph: <b>${esc(solutionOf(t))}</b>`
    : `Richtig wäre: <b>${esc(solutionOf(t))}</b>${mine ? ` — du hattest <b>${esc(mine)}</b>` : ""}`;
  v.innerHTML = head + (t.sol ? `<span class="why">${t.sol}</span>` : "") + note +
    `<div class="actions"><button class="btn accent" data-act="next">Weiter</button></div>`;
}
function check(){
  const t = S.queue[S.idx];
  if($("#verdict").classList.contains("show")) return;
  if(t.t === "order"){
    const mine = S.picked.map(i => t.a[i]);
    const ok = mine.length === t.a.length && mine.every((w,k) => w === t.a[k]);
    return finish(ok ? "ok" : "no", t, joinWords(mine));
  }
  const ins = readInputs(t);
  finish(judgeTask(t, ins), t, ins.filter(Boolean).join(" · "));
}

/* ---------- Klassenarbeit ---------- */
function startExam(){
  const n = S.topic.mixOf ? 16 : 12;
  S.exam = {tasks:drawTasks(S.topic, n, true), idx:0, answers:[], t0:Date.now()};
  renderExam();
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }
function renderExam(){
  const e = S.exam;
  if(e.idx >= e.tasks.length) return renderExamResult();
  const t = e.tasks[e.idx];
  const label = t.t === "trans" ? "Übersetze ins Englische" : "";
  stage.innerHTML = `<div class="sheet exam">
    <div class="exambar"><span class="tag">Klassenarbeit</span>
      <span>Aufgabe ${e.idx+1} von ${e.tasks.length}</span><span id="clock">00:00</span>
      <span>keine Rückmeldung bis zum Schluss</span></div>
    <div class="qmeta">${S.topic.mixOf ? t.tt + " · " : ""}${t.gl}</div>
    ${label ? `<div class="qsub" style="margin:0 0 8px">${label}</div>` : ""}
    <div class="qtext">${t.t === "order" ? esc(t.de) : t.q}</div>
    ${t.hint ? `<div class="qsub">${esc(t.hint)}</div>` : ""}
    ${t.t === "order" ? `<div class="qsub">Setze die Wörter in die richtige Reihenfolge.</div>` : ""}
    ${bodyHTML(t, true)}
    <div class="progress"><span>${e.idx+1} / ${e.tasks.length}</span>
      <span class="pbar exam"><i style="width:${Math.round(e.idx/e.tasks.length*100)}%"></i></span></div></div>`;
  if(t.t === "order") S.picked = [];
  else bindEnter(examNext);
  stopTimer();
  S.timer = setInterval(() => {
    const el = $("#clock"); if(!el) return stopTimer();
    const s = Math.floor((Date.now()-e.t0)/1000);
    el.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  }, 1000);
}
function examNext(ans){
  const e = S.exam, t = e.tasks[e.idx];
  e.answers[e.idx] = ans !== undefined ? ans
    : t.t === "order" ? S.picked.map(i => t.a[i]) : readInputs(t);
  e.idx++; renderExam();
}
const NOTEN = [[87,"1"],[73,"2"],[59,"3"],[45,"4"],[18,"5"],[0,"6"]];
function renderExamResult(){
  stopTimer();
  const e = S.exam;
  let pts = 0, max = 0;
  const rows = e.tasks.map((t,i) => {
    const p = t.t === "order" || fieldsOf(t).length > 1 ? 2 : 1;
    max += p;
    const ans = e.answers[i];
    let ok = false, mine = "—";
    if(t.t === "mc"){ ok = ans === t.ai; mine = ans == null ? "—" : t.opts[ans]; }
    else if(t.t === "order"){
      ok = Array.isArray(ans) && ans.length === t.a.length && ans.every((w,k) => w === t.a[k]);
      mine = Array.isArray(ans) && ans.length ? joinWords(ans) : "—";
    } else {
      ok = Array.isArray(ans) && judgeTask(t, ans) !== "no";
      mine = Array.isArray(ans) && ans.filter(Boolean).length ? ans.filter(Boolean).join(" · ") : "—";
    }
    if(ok) pts += p;
    mark(t.key, ok);
    const q = t.t === "order" ? esc(t.de) : t.q;
    return `<div class="rev ${ok?"okrow":"norow"}"><div class="rq">${q}</div>
      <div class="ra">Deine Antwort: <span class="${ok?"good":"mine"}">${esc(mine)}</span>${ok?"":` · richtig: <span class="good">${esc(solutionOf(t))}</span>`} <span style="color:var(--ink-3)">(${ok?p:0}/${p} P.)</span></div>
      ${ok || !t.sol ? "" : `<div class="sol">${t.sol}</div>`}</div>`;
  }).join("");
  const proz = Math.round(pts/max*1000)/10;
  const note = NOTEN.find(([g]) => proz >= g)[1];
  const secs = Math.floor((Date.now()-e.t0)/1000);
  const ekey = S.topic.duel && S.sub ? S.topic.id + ":" + S.sub : S.topic.id;
  const best = MEM.exams[ekey];
  if(best == null || proz > best) MEM.exams[ekey] = proz;
  saveMEM(); updateStats();
  stage.innerHTML = `<div class="sheet exam">
    <div class="qmeta">Klassenarbeit · ${S.topic.duel && DUEL_BY_ID[S.sub] ? DUEL_BY_ID[S.sub].label : S.topic.title}</div>
    <div class="result"><div class="note">${note}</div>
      <div class="meta">${pts} von ${max} Punkten · ${String(proz).replace(".",",")} %<br>
      Zeit: ${Math.floor(secs/60)} min ${secs%60} s${best != null ? `<br>Bisher beste: ${String(best).replace(".",",")} %` : ""}</div></div>
    <div class="qsub">Notenschlüssel: ab 87 % → 1 · 73 % → 2 · 59 % → 3 · 45 % → 4 · 18 % → 5</div>
    <div class="actions"><button class="btn exam" data-act="examagain">Neue Arbeit schreiben</button>
      <button class="btn ghost" data-act="home">Zu den Themen</button></div>
    <div class="review">${rows}</div></div>`;
  window.scrollTo({top:0, behavior:"instant"});
}

function updateStats(){
  $("#statOk").textContent = stats.ok;
  $("#statAll").textContent = stats.all;
  $("#statStreak").textContent = stats.streak;
  const n = openErrors().length;
  $("#statErr").textContent = n;
  $("#errChip").hidden = !n;
}

/* ---------- Klicks ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;
  if(a === "topic") return openTopic(el.dataset.id);
  if(a === "mode")  return setMode(el.dataset.m);
  if(a === "sub"){ S.sub = el.dataset.s || null; renderSubTabs(); startMode(); return; }
  if(a === "home")  return renderHome();
  if(a === "again"){ startMode(); return; }
  if(a === "next"){ S.idx++; renderTask(); return; }
  if(a === "check") return check();
  if(a === "opt"){
    const t = S.queue[S.idx], i = +el.dataset.i;
    if($("#verdict").classList.contains("show")) return;
    document.querySelectorAll(".opt").forEach((b,k) => {
      b.disabled = true;
      if(k === t.ai) b.classList.add("right"); else if(k === i) b.classList.add("wrong");
    });
    return finish(i === t.ai ? "ok" : "no", t, t.opts[i]);
  }
  if(a === "flip"){
    const b = $("#cardBack");
    if(b && b.hidden){ b.hidden = false; $("#cardBtns").hidden = false; }
    return;
  }
  if(a === "know"){ const t = S.queue[S.idx]; stats.all++; stats.ok++; stats.streak++; S.runOk++; mark(t.key,true); saveMEM(); updateStats(); S.idx++; return renderTask(); }
  if(a === "again2"){ const t = S.queue[S.idx]; stats.all++; stats.streak = 0; mark(t.key,false); saveMEM(); updateStats(); S.idx++; return renderTask(); }
  if(a === "word"){
    const i = +el.dataset.i, slots = $("#slots");
    if(el.parentElement.id === "pool"){
      S.picked.push(i);
      const em = slots.querySelector(".empty"); if(em) em.remove();
      slots.appendChild(el);
    } else {
      S.picked = S.picked.filter(x => x !== i);
      $("#pool").appendChild(el);
      if(!S.picked.length) slots.innerHTML = '<span class="empty">Hier entsteht dein Satz</span>';
    }
    return;
  }
  if(a === "m"){
    if(el.dataset.state === "done") return;
    const side = el.dataset.side, i = +el.dataset.i, t = S.queue[S.idx];
    if(!S.sel){ document.querySelectorAll('.mitem[data-state="sel"]').forEach(b => b.removeAttribute("data-state"));
      el.dataset.state = "sel"; S.sel = {side, i, el}; return; }
    if(S.sel.side === side){ S.sel.el.removeAttribute("data-state"); el.dataset.state = "sel"; S.sel = {side,i,el}; return; }
    if(S.sel.i === i){
      S.sel.el.dataset.state = "done"; el.dataset.state = "done"; S.sel = null; S.left--;
      if(S.left === 0){
        stats.all++; if(!S.missed){ stats.ok++; stats.streak++; S.runOk++; } else stats.streak = 0;
        mark(t.key, !S.missed); saveMEM(); updateStats();
        const v = $("#verdict"); v.className = "verdict show ok";
        v.innerHTML = (S.missed ? "Alle Paare gefunden — mit Fehlversuchen." : "Alle Paare auf Anhieb gefunden.") +
          `<div class="actions"><button class="btn accent" data-act="next">Weiter</button></div>`;
      }
    } else {
      const x = S.sel.el, y = el; S.missed = true;
      x.dataset.state = "miss"; y.dataset.state = "miss";
      setTimeout(() => { x.removeAttribute("data-state"); y.removeAttribute("data-state"); }, 550);
      S.sel = null;
    }
    return;
  }
  if(a === "examcheck") return examNext();
  if(a === "examskip")  return examNext([]);
  if(a === "examopt")   return examNext(+el.dataset.i);
  if(a === "examagain"){ startExam(); return; }
});
$("#btnBack").addEventListener("click", renderHome);

renderHome();
updateStats();

/* ============================================================
   Lernstand im localStorage (Schlüssel wordbook-v1):
   Fehlerspeicher pro Aufgabenart, beste Klassenarbeit je Thema.
   ============================================================ */
</script>
</body>
</html>
