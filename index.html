T({id:"rational", kl:7, title:"Rationale Zahlen", desc:"Rechnen mit negativen Zahlen.",
expl:`<p class="lead">Negative Zahlen liegen links von der Null. Damit wird die Zahlengerade nach beiden Seiten unendlich — und Subtrahieren ist immer möglich.</p>
<h3>Addieren und Subtrahieren</h3>
<ol class="steps">
<li>Denk an die Zahlengerade: <b>plus</b> heißt nach rechts, <b>minus</b> nach links.</li>
<li>Zwei Zeichen direkt hintereinander werden zu einem: <b>+(−) → −</b> und <b>−(−) → +</b>.</li>
<li>Gleiche Vorzeichen: Beträge addieren, Vorzeichen behalten. Verschiedene: Beträge subtrahieren, Vorzeichen der größeren Zahl.</li>
</ol>
<div class="ex">−7 + 3 = −4   ·   −7 − 3 = −10   ·   5 − (−4) = 5 + 4 = 9   ·   −6 + (−2) = −8</div>
<h3>Multiplizieren und Dividieren</h3>
<div class="rule"><b>Gleiche Vorzeichen → plus. Verschiedene Vorzeichen → minus.</b><br>
(−5) · (−4) = +20   ·   (−5) · 4 = −20   ·   (−20) : (−4) = 5   ·   20 : (−4) = −5<br>
Bei mehreren Faktoren: Zähle die Minuszeichen. Gerade Anzahl → Ergebnis positiv, ungerade → negativ.</div>
<h3>Betrag</h3>
<p>Der Betrag |−7| = 7 ist der Abstand von der Null — immer positiv.</p>`,
gens:[
 {id:"addsub", label:"Plus & Minus", make(){
   const a = Rn(-30,30), b = Rn(-30,30), plus = Math.random() < .5;
   const v = plus ? a+b : a-b;
   return {q:`Berechne ${m(`${a} ${plus?"+":"−"} (${b})`)}`, num:v,
     sol: plus ? `${a} + (${b}) = ${a} ${pmt(b)} = <b>${v}</b>`
               : `${a} − (${b}) = ${a} ${b<0?"+ "+Math.abs(b):"− "+b} = <b>${v}</b>`};
 }},
 {id:"malgeteilt", label:"Mal & Geteilt", make(){
   const a = Rn(-12,12), b = Rn(-12,12);
   if(Math.random() < .5)
     return {q:`Berechne ${m(`(${a}) · (${b})`)}`, num:a*b,
       sol:`${a*b>0?"Gleiche":"Verschiedene"} Vorzeichen → Ergebnis ${a*b>0?"positiv":"negativ"}: <b>${a*b}</b>`};
   const p = a*b;
   return {q:`Berechne ${m(`(${p}) : (${a})`)}`, num:b,
     sol:`${p/a>0?"Gleiche":"Verschiedene"} Vorzeichen → <b>${b}</b>`};
 }},
 {id:"kette", label:"Rechenketten", make(){
   const a = Rn(-15,15), b = Rn(-9,9), c = Rn(-9,9);
   const v = a - b*c;
   return {q:`Berechne ${m(`${a} − (${b}) · (${c})`)}`, num:v,
     sol:`Punkt vor Strich: (${b}) · (${c}) = ${b*c}. Dann ${a} − (${b*c}) = <b>${v}</b>`};
 }},
 {id:"betrag", label:"Betrag & Vergleich", make(){
   const a = Rn(-40,40), b = Rn(-40,40);
   if(Math.random() < .5)
     return {q:`Berechne ${m(`|${a}| + |${b}|`)}`, num:Math.abs(a)+Math.abs(b),
       sol:`|${a}| = ${Math.abs(a)}, |${b}| = ${Math.abs(b)} → <b>${Math.abs(a)+Math.abs(b)}</b>`};
   return {q:`Welche Zahl ist größer: ${m(a)} oder ${m(b)}?`, opts:[String(a),String(b)], ai: a>b?0:1,
     sol:`Auf der Zahlengeraden liegt ${Math.max(a,b)} weiter rechts → <b>${Math.max(a,b)}</b> ist größer.`};
 }}]});

T({id:"terme", kl:7, title:"Terme & Variablen", desc:"Zusammenfassen, ausmultiplizieren, einsetzen.",
expl:`<p class="lead">Ein Term ist ein Rechenausdruck mit Platzhaltern. Er hat kein Ergebnis, solange man für die Variable nichts einsetzt.</p>
<h3>Gleichartige Glieder zusammenfassen</h3>
<div class="rule">Nur was <b>dieselbe Variable in derselben Potenz</b> hat, darf zusammengefasst werden.
3x und 5x gehen (= 8x), 3x und 5x² nicht, 3x und 5 auch nicht.<br>
Denk an Obst: 3 Äpfel + 5 Äpfel = 8 Äpfel, aber 3 Äpfel + 5 Birnen bleibt stehen.</div>
<div class="ex">3x + 5 + 4x − 2 = (3x + 4x) + (5 − 2) = <b>7x + 3</b></div>
<h3>Klammern auflösen</h3>
<ol class="steps">
<li><b>Plus vor der Klammer:</b> Klammer weglassen, alles bleibt. a + (b − c) = a + b − c</li>
<li><b>Minus vor der Klammer:</b> <u>alle</u> Vorzeichen drinnen umdrehen. a − (b − c) = a − b + c</li>
<li><b>Zahl vor der Klammer:</b> jeden Summanden einzeln malnehmen. 3(2x + 5) = 6x + 15</li>
</ol>
<div class="rule"><b>Der häufigste Fehler:</b> Bei −(2x + 5) nur das erste Vorzeichen ändern.
Richtig ist −2x − 5.</div>
<h3>Einsetzen</h3>
<p>Für x = −3 in 4x + 7: erst die Klammern setzen, dann rechnen: 4 · (−3) + 7 = −12 + 7 = −5.</p>`,
gens:[
 {id:"zusammen", label:"Zusammenfassen", make(){
   const a = R(2,9), b = R(2,9), c = Rn(-9,9), d = Rn(-9,9);
   const kx = a+b, kz = c+d;
   const t = `${kx}x${kz===0?"":sgn(kz)}`.replace("−"," − ").replace("+"," + ");
   return {q:`Fasse zusammen: ${m(`${a}x ${pmt(c)} + ${b}x ${pmt(d)}`)}`,
     a:[`${kx}x${kz>=0?"+"+kz:kz}`, `${kz>=0?kz+"+":kz+""}${kx}x`, kz===0?`${kx}x`:""].filter(Boolean),
     label:"Term (z. B. 7x+3)",
     sol:`x-Glieder: ${a}x + ${b}x = ${kx}x. Zahlen: ${c}${pmt(d)} = ${kz}. → <b>${kx}x${kz===0?"":(kz>0?" + "+kz:" − "+Math.abs(kz))}</b>`};
 }},
 {id:"klammer", label:"Klammern auflösen", make(){
   const f = R(2,7), a = R(2,9), b = Rn(-9,9);
   const kx = f*a, kz = f*b;
   return {q:`Multipliziere aus: ${m(`${f} · (${a}x ${pmt(b)})`)}`,
     a:[`${kx}x${kz>=0?"+"+kz:kz}`, `${kz>=0?kz+"+":kz}${kx}x`], label:"Term",
     sol:`Jeden Summanden mal ${f}: ${f}·${a}x = ${kx}x und ${f}·(${b}) = ${kz} → <b>${kx}x ${pmt(kz)}</b>`};
 }},
 {id:"minusklammer", label:"Minus vor der Klammer", make(){
   const a = R(2,9), b = Rn(-9,9), c = R(2,9);
   const kx = c-a, kz = -b;
   return {q:`Vereinfache: ${m(`${c}x − (${a}x ${pmt(b)})`)}`,
     a:[`${kx}x${kz>=0?"+"+kz:kz}`, `${kz>=0?kz+"+":kz}${kx}x`, kz===0?`${kx}x`:""].filter(Boolean), label:"Term",
     sol:`Minus dreht alle Vorzeichen: ${c}x − ${a}x ${(-b)<0?"− "+Math.abs(b):"+ "+Math.abs(b)} → <b>${kx}x ${pmt(kz)}</b>`};
 }},
 {id:"einsetzen", label:"Einsetzen", make(){
   const a = Rn(-8,8), b = Rn(-15,15), x = Rn(-7,7);
   return {q:`Berechne den Wert von ${m(`${a}x ${pmt(b)}`)} für ${m("x = "+x)}.`,
     num:a*x+b, sol:`${a} · (${x}) ${pmt(b)} = ${a*x} ${pmt(b)} = <b>${a*x+b}</b>`};
 }},
 {id:"aufstellen", label:"Terme aufstellen", make(){
   const a = R(2,9), b = R(2,20);
   const arten = [
     {t:`Das ${a}-fache einer Zahl x, vermindert um ${b}`, a:[`${a}x-${b}`], s:`${a}x − ${b}`},
     {t:`Die Summe aus einer Zahl x und ${b}, mal ${a} genommen`, a:[`${a}(x+${b})`,`${a}x+${a*b}`], s:`${a} · (x + ${b}) = ${a}x + ${a*b}`},
     {t:`Eine Zahl x, um ${b} vergrößert und dann verdoppelt`, a:[`2(x+${b})`,`2x+${2*b}`], s:`2 · (x + ${b}) = 2x + ${2*b}`}];
   const k = pick(arten);
   return {q:`Stelle einen Term auf: ${k.t}.`, a:k.a, label:"Term",
     sol:`<b>${k.s}</b>`, hint:"Klammern mit ( ) schreiben"};
 }}]});

T({id:"gleichungen", kl:7, title:"Gleichungen lösen", desc:"Äquivalenzumformungen bis zur Lösung.",
expl:`<p class="lead">Eine Gleichung ist eine Waage. Was du links tust, musst du rechts genauso tun — dann bleibt sie im Gleichgewicht.</p>
<h3>Das Ziel</h3>
<p>Am Ende soll dastehen: <b>x = Zahl</b>. Dafür bringt man alle x auf eine Seite und alle Zahlen auf die andere.</p>
<ol class="steps">
<li><b>Klammern auflösen</b> und auf jeder Seite zusammenfassen.</li>
<li><b>x-Glieder</b> auf eine Seite bringen (dieselbe Zahl auf beiden Seiten addieren oder subtrahieren).</li>
<li><b>Zahlen</b> auf die andere Seite bringen.</li>
<li>Durch die Zahl vor dem x <b>teilen</b>.</li>
<li><b>Probe:</b> Lösung in die ursprüngliche Gleichung einsetzen.</li>
</ol>
<div class="ex">5x + 7 = 3x − 5   | −3x<br>2x + 7 = −5   | −7<br>2x = −12   | :2<br>x = <b>−6</b><br>
Probe: 5·(−6)+7 = −23 und 3·(−6)−5 = −23 ✓</div>
<div class="rule"><b>Immer beide Seiten.</b> Der häufigste Fehler ist, nur links zu rechnen.
Schreib die Umformung mit senkrechtem Strich dahinter — dann vergisst du es nicht.</div>
<h3>Sonderfälle</h3>
<div class="rule">Kommt am Ende <b>0 = 0</b> heraus, ist jede Zahl eine Lösung. Kommt etwas Falsches wie
<b>0 = 5</b> heraus, gibt es keine Lösung.</div>`,
gens:[
 {id:"einfach", label:"Einfache Gleichungen", make(){
   const a = R(2,9), x = Rn(-12,12), b = Rn(-20,20);
   return {q:`Löse: ${m(`${a}x ${pmt(b)} = ${a*x+b}`)}`, num:x, label:"x",
     sol:`${a}x = ${a*x+b} ${b<0?"+ "+Math.abs(b):"− "+b} = ${a*x} | :${a} → x = <b>${x}</b>`};
 }},
 {id:"beidseitig", label:"x auf beiden Seiten", make(){
   const a = R(3,9), c = R(1,a-1), x = Rn(-10,10), b = Rn(-15,15);
   const d = (a-c)*x + b;
   return {q:`Löse: ${m(`${a}x ${pmt(b)} = ${c}x${pmt(d)}`)}`, num:x, label:"x",
     sol:`| −${c}x → ${a-c}x ${pmt(b)} = ${d} | ${b<0?"+ "+Math.abs(b):"− "+b} → ${a-c}x = ${(a-c)*x} | :${a-c} → x = <b>${x}</b>`};
 }},
 {id:"klammer", label:"Mit Klammern", make(){
   const f = R(2,6), a = R(2,6), x = Rn(-9,9), b = Rn(-9,9);
   const r = f*(a*x + b);
   return {q:`Löse: ${m(`${f} · (${a}x ${pmt(b)}) = ${r}`)}`, num:x, label:"x",
     sol:`Ausmultiplizieren: ${f*a}x ${pmt(f*b)} = ${r} → ${f*a}x = ${f*a*x} | :${f*a} → x = <b>${x}</b>`};
 }},
 {id:"sach", label:"Sachaufgaben", make(){
   const a = R(2,6), b = R(5,40), x = R(3,25);
   return {q:`Denke dir eine Zahl. Nimm sie mal ${m(a)} und addiere ${m(b)}. Das Ergebnis ist ${m(a*x+b)}. Wie lautet die Zahl?`,
     num:x, label:"x",
     sol:`${a}x + ${b} = ${a*x+b} | −${b} → ${a}x = ${a*x} | :${a} → x = <b>${x}</b>`};
 }}]});

T({id:"prozent2", kl:7, title:"Prozentrechnung", desc:"Grundwert, Prozentwert, Prozentsatz, Zu- und Abnahme.",
expl:`<p class="lead">Drei Größen, drei Fragen — und immer dieselbe Formel, nur nach einer anderen Größe umgestellt.</p>
<h3>Die drei Größen</h3>
<table class="tbl">
<tr><td class="f">Grundwert G</td><td>das Ganze, die 100 %</td></tr>
<tr><td class="f">Prozentwert W</td><td>der Anteil davon</td></tr>
<tr><td class="f">Prozentsatz p</td><td>wie viel Prozent, z. B. 18 %</td></tr>
</table>
<div class="ex">W = G · p   ·   G = W : p   ·   p = W : G<br>(p immer als Dezimalzahl: 18 % = 0,18)</div>
<h3>Welche Größe ist gesucht?</h3>
<ol class="steps">
<li>Suche das Wort <b>„von"</b> — was danach steht, ist der Grundwert.</li>
<li>Steht die Prozentzahl in der Aufgabe? Dann ist entweder G oder W gesucht.</li>
<li>Fehlt die Prozentzahl? Dann ist p gesucht: p = W : G, danach mal 100.</li>
</ol>
<h3>Zunahme und Abnahme</h3>
<div class="rule">Statt zwei Schritten geht es in einem — mit dem <b>Faktor</b>:<br>
Preis + 20 % → mal <b>1,20</b> · Preis − 15 % → mal <b>0,85</b><br>
Rückwärts (der neue Preis ist bekannt, gesucht ist der alte): <b>teilen</b> statt malnehmen.</div>
<div class="rule"><b>Die klassische Falle:</b> Ein Preis steigt um 20 % und fällt dann um 20 % — man ist <u>nicht</u>
wieder beim Ausgangswert. 100 → 120 → 96, denn die zweiten 20 % beziehen sich auf einen anderen Grundwert.</div>`,
gens:[
 {id:"grundwert", label:"Grundwert gesucht", make(){
   const p = pick([4,5,8,10,12,15,20,25,30,40]), g = R(4,60)*25;
   const w = g*p/100;
   return {q:`${m(fmt(w)+" €")} sind ${m(p+" %")} eines Betrags. Wie hoch ist der Grundwert?`,
     num:g, unit:"€", dec:2,
     sol:`G = W : p = ${fmt(w)} : ${fmt(p/100)} = <b>${eur(g)}</b>`};
 }},
 {id:"prozentsatz", label:"Prozentsatz gesucht", make(){
   const g = pick([40,50,80,120,200,250,400,500]), w = R(1,g-1);
   return {q:`Von ${m(g+" €")} werden ${m(fmt(w)+" €")} gespart. Wie viel Prozent sind das?`,
     num:round(w/g*100,2), unit:"%", dec:2,
     sol:`p = W : G = ${w} : ${g} = ${fmt(w/g,4)} → <b>${fmt(round(w/g*100,2))} %</b>`};
 }},
 {id:"zunahme", label:"Zunahme & Abnahme", make(){
   const g = R(8,60)*25, p = pick([5,8,10,12,15,20,25,30]), rauf = Math.random() < .5;
   const f = rauf ? 1+p/100 : 1-p/100;
   return {q:`Ein Preis von ${m(fmt(g)+" €")} ${rauf?"steigt":"sinkt"} um ${m(p+" %")}. Wie hoch ist der neue Preis?`,
     num:round(g*f,2), unit:"€", dec:2,
     sol:`Faktor ${fmt(f)} → ${g} · ${fmt(f)} = <b>${eur(round(g*f,2))}</b>`};
 }},
 {id:"rueck", label:"Rückwärts rechnen", make(){
   const g = R(8,50)*20, p = pick([10,20,25,50]), rauf = Math.random() < .5;
   const f = rauf ? 1+p/100 : 1-p/100, neu = round(g*f,2);
   return {q:`Nach einer ${rauf?"Erhöhung":"Senkung"} um ${m(p+" %")} kostet eine Ware ${m(fmt(neu,2)+" €")}. Wie war der alte Preis?`,
     num:g, unit:"€", dec:2,
     sol:`Der alte Preis war 100 %, der neue ${fmt(f*100)} %. Also ${fmt(neu,2)} : ${fmt(f)} = <b>${eur(g)}</b>`};
 }}]});

T({id:"zinsen", kl:7, title:"Zinsrechnung", desc:"Jahres-, Monats- und Tageszinsen, Zinseszins.",
expl:`<p class="lead">Zinsrechnung ist Prozentrechnung mit anderen Namen — plus einer Zutat: der Zeit.</p>
<table class="tbl">
<tr><td class="f">Kapital K</td><td>der Geldbetrag (= Grundwert)</td></tr>
<tr><td class="f">Zinssatz p</td><td>Prozent <b>pro Jahr</b></td></tr>
<tr><td class="f">Zinsen Z</td><td>was dazukommt (= Prozentwert)</td></tr>
</table>
<h3>Jahreszinsen</h3>
<div class="ex">Z = K · p<br>2500 € zu 3 % → Z = 2500 · 0,03 = <b>75 €</b></div>
<h3>Kürzere Zeiträume</h3>
<ol class="steps">
<li>Der Zinssatz gilt immer für ein <b>ganzes Jahr</b>.</li>
<li>Für Monate: mal ${frac("Monate",12)} · Für Tage: mal ${frac("Tage",360)}.</li>
<li>In der Zinsrechnung hat ein Jahr 360 Tage und jeder Monat 30 Tage (Bankjahr).</li>
</ol>
<div class="ex">2500 € zu 3 % für 5 Monate: 75 € · ${frac(5,12)} = <b>31,25 €</b></div>
<h3>Zinseszins</h3>
<div class="rule">Bleiben die Zinsen auf dem Konto, werden sie im nächsten Jahr mitverzinst:<br>
K<sub>n</sub> = K · (1 + p)<sup>n</sup><br>
1000 € zu 4 % über 3 Jahre: 1000 · 1,04³ = <b>1124,86 €</b> — also mehr als 3 · 40 € = 120 €.</div>`,
gens:[
 {id:"jahr", label:"Jahreszinsen", make(){
   const k = R(4,60)*250, p = pick([1,1.5,2,2.5,3,3.5,4,5]);
   return {q:`Wie viel Zinsen bringen ${m(k+" €")} in einem Jahr bei ${m(fmt(p)+" %")}?`,
     num:round(k*p/100,2), unit:"€", dec:2,
     sol:`Z = ${k} · ${fmt(p/100)} = <b>${eur(round(k*p/100,2))}</b>`};
 }},
 {id:"monate", label:"Monatszinsen", make(){
   const k = R(4,40)*250, p = pick([2,3,4,5,6]), mo = pick([2,3,4,5,6,8,9,10]);
   const z = round(k*p/100*mo/12, 2);
   return {q:`${m(k+" €")} werden für ${m(mo+" Monate")} zu ${m(p+" %")} angelegt. Wie hoch sind die Zinsen?`,
     num:z, unit:"€", dec:2,
     sol:`Jahreszinsen: ${fmt(k*p/100,2)} €. Davon ${mo}/12 → <b>${eur(z)}</b>`};
 }},
 {id:"satz", label:"Zinssatz gesucht", make(){
   const k = R(4,40)*500, p = pick([1,2,2.5,3,4,5]);
   const z = round(k*p/100,2);
   return {q:`${m(k+" €")} bringen in einem Jahr ${m(fmt(z,2)+" €")} Zinsen. Wie hoch ist der Zinssatz?`,
     num:p, unit:"%", dec:2,
     sol:`p = Z : K = ${fmt(z,2)} : ${k} = ${fmt(p/100,4)} → <b>${fmt(p)} %</b>`};
 }},
 {id:"zinseszins", label:"Zinseszins", make(){
   const k = R(2,20)*500, p = pick([2,3,4,5]), n = R(2,6);
   const e = round(k*(1+p/100)**n, 2);
   return {q:`${m(k+" €")} werden ${m(n+" Jahre")} lang mit ${m(p+" %")} verzinst (Zinsen bleiben auf dem Konto). Wie hoch ist das Endkapital?`,
     num:e, unit:"€", dec:2,
     sol:`K<sub>${n}</sub> = ${k} · ${fmt(1+p/100)}<sup>${n}</sup> = <b>${eur(e)}</b>`};
 }}]});

T({id:"dreisatz", kl:7, title:"Zuordnungen & Dreisatz", desc:"Proportional, antiproportional, Maßstab.",
expl:`<p class="lead">Beim Dreisatz geht man immer über die <b>Eins</b> — deshalb der Name: gegebene Größe, Einheit, gesuchte Größe.</p>
<h3>Proportional (je mehr, desto mehr)</h3>
<ol class="steps">
<li>Gegeben: 5 Hefte kosten 7,50 €.</li>
<li>Auf eins herunterrechnen: 1 Heft kostet 7,50 : 5 = 1,50 €.</li>
<li>Auf die gesuchte Menge hochrechnen: 8 Hefte kosten 8 · 1,50 = <b>12 €</b>.</li>
</ol>
<div class="rule">Erkennungszeichen: Verdoppelt sich die eine Größe, verdoppelt sich auch die andere.
Der <b>Quotient</b> y : x ist immer gleich (der Proportionalitätsfaktor).</div>
<h3>Antiproportional (je mehr, desto weniger)</h3>
<ol class="steps">
<li>Gegeben: 4 Arbeiter brauchen 12 Stunden.</li>
<li>Auf eins: 1 Arbeiter bräuchte 4 · 12 = 48 Stunden — hier wird <b>mal</b>genommen.</li>
<li>Auf die gesuchte Zahl: 6 Arbeiter brauchen 48 : 6 = <b>8 Stunden</b>.</li>
</ol>
<div class="rule">Erkennungszeichen: Doppelt so viele Arbeiter, halbe Zeit. Hier ist das <b>Produkt</b> x · y immer gleich.<br>
<b>Vorsicht:</b> Nicht jede Zuordnung ist eines von beidem. Alter und Körpergröße sind weder proportional noch antiproportional.</div>
<h3>Maßstab</h3>
<div class="ex">Maßstab 1 : 25 000 heißt: 1 cm auf der Karte = 25 000 cm = 250 m in Wirklichkeit.</div>`,
gens:[
 {id:"pro", label:"Proportional", make(){
   const n = R(3,9), pr = round(R(80,900)/100,2), k = R(2,15);
   const ges = round(n*pr,2);
   return {q:`${m(n)} gleiche Artikel kosten ${m(fmt(ges,2)+" €")}. Was kosten ${m(k)} Artikel?`,
     num:round(k*pr,2), unit:"€", dec:2,
     sol:`1 Artikel: ${fmt(ges,2)} : ${n} = ${fmt(pr,2)} € → ${k} · ${fmt(pr,2)} = <b>${eur(round(k*pr,2))}</b>`};
 }},
 {id:"anti", label:"Antiproportional", make(){
   const a = R(2,8), h = R(4,24), b = R(2,12);
   const prod = a*h;
   return {q:`${m(a+" Arbeiter")} brauchen für einen Auftrag ${m(h+" Stunden")}. Wie lange brauchen ${m(b+" Arbeiter")}?`,
     num:round(prod/b,2), unit:"h", dec:2,
     sol:`1 Arbeiter bräuchte ${a} · ${h} = ${prod} h → ${prod} : ${b} = <b>${fmt(round(prod/b,2))} h</b>`};
 }},
 {id:"erkennen", label:"Zuordnungsart erkennen", make(){
   const f = pick([
     ["Anzahl der Brötchen und Gesamtpreis", 0],
     ["Anzahl der Maler und Zeit für einen Anstrich", 1],
     ["Geschwindigkeit und Fahrzeit für eine feste Strecke", 1],
     ["Gefahrene Kilometer und Benzinverbrauch", 0],
     ["Anzahl der Gäste und Menge Kuchen pro Person (fester Kuchen)", 1],
     ["Arbeitszeit und Lohn bei festem Stundenlohn", 0]]);
   return {q:`Welche Zuordnung liegt vor? <b>${f[0]}</b>`, opts:["proportional","antiproportional"], ai:f[1],
     sol: f[1] ? `Je mehr, desto weniger → <b>antiproportional</b> (Produkt bleibt gleich).`
               : `Je mehr, desto mehr → <b>proportional</b> (Quotient bleibt gleich).`};
 }},
 {id:"massstab", label:"Maßstab", make(){
   const ms = pick([500,1000,25000,50000,100000]), cm = R(2,25);
   const meter = cm*ms/100;
   return {q:`Auf einer Karte im Maßstab ${m("1 : "+ms.toLocaleString("de-DE"))} sind zwei Orte ${m(cm+" cm")} entfernt. Wie weit sind sie in Wirklichkeit (in Metern)?`,
     num:meter, unit:"m", dec:2,
     sol:`${cm} · ${ms} = ${(cm*ms).toLocaleString("de-DE")} cm = <b>${fmt(meter)} m</b>`};
 }}]});

T({id:"dreieck", kl:7, title:"Dreiecke & Winkelsätze", desc:"Winkelsumme, Außenwinkel, besondere Dreiecke.",
expl:`<p class="lead">Alles beginnt mit einem Satz: In jedem Dreieck ergeben die drei Innenwinkel zusammen <b>180°</b>.</p>
<h3>Dreiecksarten</h3>
<table class="tbl">
<tr><td class="f">gleichseitig</td><td>drei gleiche Seiten, alle Winkel 60°</td></tr>
<tr><td class="f">gleichschenklig</td><td>zwei gleiche Seiten (Schenkel), die beiden <b>Basiswinkel</b> sind gleich groß</td></tr>
<tr><td class="f">rechtwinklig</td><td>ein Winkel ist 90°, die anderen beiden ergeben zusammen 90°</td></tr>
</table>
<h3>Winkel am gleichschenkligen Dreieck</h3>
<ol class="steps">
<li>Ist der Winkel an der Spitze bekannt: Basiswinkel = (180° − Spitze) : 2.</li>
<li>Ist ein Basiswinkel bekannt: Spitze = 180° − 2 · Basiswinkel.</li>
</ol>
<h3>Außenwinkel</h3>
<div class="rule">Ein Außenwinkel ist so groß wie die <b>Summe der beiden nicht anliegenden Innenwinkel</b>.
Er ergänzt seinen Innenwinkel zu 180°.</div>
<h3>Dreiecksungleichung</h3>
<div class="rule">Ein Dreieck existiert nur, wenn jede Seite kürzer ist als die Summe der beiden anderen.
Mit 3 cm, 4 cm und 9 cm geht es nicht: 3 + 4 = 7 < 9.</div>`,
gens:[
 {id:"summe", label:"Dritter Winkel", make(){
   const a = R(20,100), b = R(20, 170-a);
   return {q:`Ein Dreieck hat die Winkel α = ${m(a+"°")} und β = ${m(b+"°")}. Berechne γ.`,
     num:180-a-b, unit:"°", sol:`γ = 180° − ${a}° − ${b}° = <b>${180-a-b}°</b>`};
 }},
 {id:"gleichschenklig", label:"Gleichschenklig", make(){
   if(Math.random() < .5){
     const s = R(20,140);
     return {q:`In einem gleichschenkligen Dreieck beträgt der Winkel an der Spitze ${m(s+"°")}. Wie groß ist ein Basiswinkel?`,
       num:(180-s)/2, unit:"°", dec:1, sol:`(180° − ${s}°) : 2 = <b>${fmt((180-s)/2)}°</b>`};
   }
   const b = R(20,80);
   return {q:`In einem gleichschenkligen Dreieck beträgt ein Basiswinkel ${m(b+"°")}. Wie groß ist der Winkel an der Spitze?`,
     num:180-2*b, unit:"°", sol:`180° − 2 · ${b}° = <b>${180-2*b}°</b>`};
 }},
 {id:"aussen", label:"Außenwinkel", make(){
   const a = R(25,90), b = R(25,100);
   return {q:`In einem Dreieck sind α = ${m(a+"°")} und β = ${m(b+"°")}. Wie groß ist der Außenwinkel bei γ?`,
     num:a+b, unit:"°",
     sol:`Der Außenwinkel entspricht der Summe der beiden nicht anliegenden Innenwinkel: ${a}° + ${b}° = <b>${a+b}°</b>`};
 }},
 {id:"ungleichung", label:"Dreiecksungleichung", make(){
   const geht = Math.random() < .5;
   let a,b,c;
   if(geht){ a = R(4,12); b = R(4,12); c = R(Math.abs(a-b)+1, a+b-1); }
   else { a = R(2,6); b = R(2,6); c = a+b+R(1,5); }
   const s = shuffle([a,b,c]);
   return {q:`Gibt es ein Dreieck mit den Seiten ${m(s.join(" cm, ")+" cm")}?`,
     opts:["ja","nein"], ai: geht?0:1,
     sol: geht ? `Jede Seite ist kürzer als die Summe der beiden anderen → das Dreieck existiert.`
               : `${Math.max(...s)} ist nicht kleiner als ${s.reduce((x,y)=>x+y,0)-Math.max(...s)} → kein Dreieck.`};
 }}]});

/* ---------------- KLASSE 8 ---------------- */

T({id:"binom", kl:8, title:"Binomische Formeln & Faktorisieren", desc:"Ausmultiplizieren, binomische Formeln, Ausklammern.",
expl:`<p class="lead">Zwei Klammern malnehmen heißt: <b>jeder mit jedem</b>. Die binomischen Formeln sind nur die drei Fälle, die besonders oft vorkommen.</p>
<h3>Jeder mit jedem</h3>
<div class="ex">(a + b)(c + d) = ac + ad + bc + bd<br>(x + 3)(x − 5) = x² − 5x + 3x − 15 = x² − 2x − 15</div>
<h3>Die drei binomischen Formeln</h3>
<table class="tbl">
<tr><td class="f">1.</td><td class="f">(a + b)² = a² + 2ab + b²</td><td>(x + 4)² = x² + 8x + 16</td></tr>
<tr><td class="f">2.</td><td class="f">(a − b)² = a² − 2ab + b²</td><td>(x − 4)² = x² − 8x + 16</td></tr>
<tr><td class="f">3.</td><td class="f">(a + b)(a − b) = a² − b²</td><td>(x + 4)(x − 4) = x² − 16</td></tr>
</table>
<div class="rule"><b>Der Standardfehler:</b> (x + 4)² ist <u>nicht</u> x² + 16. Das mittlere Glied 2ab fehlt dann.
Probier es mit Zahlen: (2 + 3)² = 25, aber 2² + 3² = 13.</div>
<h3>Faktorisieren — rückwärts</h3>
<ol class="steps">
<li>Steht in jedem Summanden derselbe Faktor? Dann <b>ausklammern</b>: 6x² + 9x = 3x(2x + 3).</li>
<li>Sieht der Term aus wie a² − b²? Dann dritte Formel rückwärts: x² − 25 = (x + 5)(x − 5).</li>
<li>Passt a² ± 2ab + b²? Dann erste oder zweite Formel rückwärts: x² + 6x + 9 = (x + 3)².</li>
</ol>`,
gens:[
 {id:"ausmult", label:"Ausmultiplizieren", make(){
   const a = Rn(-9,9), b = Rn(-9,9);
   const s = a+b, p = a*b;
   return {q:`Multipliziere aus: ${m(`(x ${pmt(a)})(x ${pmt(b)})`)}`,
     a:[`x^2${s>=0?"+"+s:s}x${p>=0?"+"+p:p}`.replace("+1x","+x").replace("-1x","-x"),
        `x^2${s>=0?"+"+s:s}x${p>=0?"+"+p:p}`],
     label:"Term (x^2+…)", hint:"x² als x^2 schreiben",
     sol:`Jeder mit jedem: x² ${sgn(b)}x ${sgn(a)}x ${pmt(p)} → <b>x² ${pmt(s,"x")} ${pmt(p)}</b>`};
 }},
 {id:"binomisch", label:"Binomische Formeln", make(){
   const a = R(2,12), art = R(1,3);
   if(art === 3)
     return {q:`Wende die passende binomische Formel an: ${m(`(x + ${a})(x − ${a})`)}`,
       a:[`x^2-${a*a}`], label:"Term", hint:"x² als x^2 schreiben",
       sol:`3. binomische Formel: x² − ${a}² = <b>x² − ${a*a}</b>`};
   const vz = art === 1 ? "+" : "−";
   return {q:`Wende die passende binomische Formel an: ${m(`(x ${vz} ${a})²`)}`,
     a:[`x^2${art===1?"+":"-"}${2*a}x+${a*a}`], label:"Term", hint:"x² als x^2 schreiben",
     sol:`${art}. binomische Formel: x² ${vz} 2·${a}·x + ${a}² = <b>x² ${vz} ${2*a}x + ${a*a}</b>`};
 }},
 {id:"ausklammern", label:"Ausklammern", make(){
   const f = R(2,9), a = R(2,9), b = R(2,12);
   return {q:`Klammere so weit wie möglich aus: ${m(`${f*a}x² + ${f*b}x`)}`,
     a:[`${f}x(${a}x+${b})`, `${f}x*(${a}x+${b})`], label:"Term (z. B. 3x(2x+5))",
     sol:`Gemeinsam ist ${f}x → <b>${f}x(${a}x + ${b})</b>`};
 }},
 {id:"faktorisieren", label:"Faktorisieren", make(){
   const a = R(2,12);
   if(Math.random() < .5)
     return {q:`Faktorisiere: ${m(`x² − ${a*a}`)}`, a:[`(x+${a})(x-${a})`,`(x-${a})(x+${a})`], label:"Term",
       sol:`3. binomische Formel rückwärts: x² − ${a}² = <b>(x + ${a})(x − ${a})</b>`};
   const vz = Math.random() < .5;
   return {q:`Faktorisiere: ${m(`x² ${vz?"+":"−"} ${2*a}x + ${a*a}`)}`,
     a:[`(x${vz?"+":"-"}${a})^2`, `(x${vz?"+":"-"}${a})(x${vz?"+":"-"}${a})`], label:"Term",
     sol:`Passt zur ${vz?1:2}. binomischen Formel: <b>(x ${vz?"+":"−"} ${a})²</b>`};
 }}]});

T({id:"linfunk", kl:8, title:"Lineare Funktionen", desc:"Steigung, y-Achsenabschnitt, Geradengleichung.",
expl:`<p class="lead">Eine lineare Funktion hat die Form <b>y = mx + b</b> und ihr Graph ist immer eine Gerade.</p>
<table class="tbl">
<tr><td class="f">m</td><td>Steigung: wie viel y sich ändert, wenn x um 1 wächst</td></tr>
<tr><td class="f">b</td><td>y-Achsenabschnitt: dort schneidet die Gerade die y-Achse (x = 0)</td></tr>
</table>
<h3>Steigung aus zwei Punkten</h3>
<div class="ex">m = ${frac("y₂ − y₁","x₂ − x₁")}<br>
P(2|3) und Q(6|11): m = ${frac("11 − 3","6 − 2")} = ${frac(8,4)} = <b>2</b></div>
<div class="rule"><b>Steigungsdreieck:</b> m = 2 heißt „1 nach rechts, 2 nach oben".
Bei m = −0,5 geht es 1 nach rechts und 0,5 nach unten. Positive Steigung → Gerade steigt, negative → sie fällt.</div>
<h3>Geradengleichung aufstellen</h3>
<ol class="steps">
<li>Steigung m aus zwei Punkten berechnen.</li>
<li>Einen Punkt in y = mx + b einsetzen.</li>
<li>Nach b auflösen.</li>
<li>m und b in die Gleichung schreiben.</li>
</ol>
<div class="ex">P(2|3), m = 2 → 3 = 2·2 + b → b = −1 → <b>y = 2x − 1</b></div>
<h3>Nullstelle</h3>
<p>Dort ist y = 0: 0 = mx + b → x = −b : m. Das ist der Schnittpunkt mit der x-Achse.</p>`,
gens:[
 {id:"steigung", label:"Steigung aus 2 Punkten", make(){
   const x1 = Rn(-8,8), x2 = Rn(-8,8) + (x1===0?1:0), m0 = Rn(-6,6);
   const X2 = x2 === x1 ? x1+R(1,4) : x2;
   const y1 = Rn(-9,9), y2 = y1 + m0*(X2-x1);
   return {q:`Berechne die Steigung der Geraden durch ${m(`P(${x1}|${y1})`)} und ${m(`Q(${X2}|${y2})`)}.`,
     num:m0, dec:3, label:"m",
     sol:`m = (${y2} − ${y1}) : (${X2} − ${x1}) = ${y2-y1} : ${X2-x1} = <b>${fmt(m0)}</b>`};
 }},
 {id:"gerade", label:"Geradengleichung", make(){
   const m0 = Rn(-5,5), b = Rn(-9,9), x1 = Rn(-6,6);
   const y1 = m0*x1 + b;
   return {q:`Eine Gerade hat die Steigung ${m("m = "+m0)} und geht durch ${m(`P(${x1}|${y1})`)}. Wie heißt der y-Achsenabschnitt b?`,
     num:b, label:"b",
     sol:`${y1} = ${m0} · ${x1} + b → ${y1} = ${m0*x1} + b → b = <b>${b}</b>, also y = ${m0}x ${pmt(b)}`};
 }},
 {id:"punktprobe", label:"Punktprobe & Werte", make(){
   const m0 = Rn(-5,5), b = Rn(-9,9), x = Rn(-8,8);
   return {q:`Gegeben ist ${m(`y = ${m0}x ${pmt(b)}`)}. Welchen y-Wert hat der Punkt mit ${m("x = "+x)}?`,
     num:m0*x+b, label:"y",
     sol:`y = ${m0} · (${x}) ${pmt(b)} = <b>${m0*x+b}</b>`};
 }},
 {id:"nullstelle", label:"Nullstelle", make(){
   const m0 = Rn(-6,6), x0 = Rn(-8,8);
   const b = -m0*x0;
   return {q:`Berechne die Nullstelle von ${m(`y = ${m0}x ${pmt(b)}`)}.`,
     num:x0, dec:3, label:"x",
     sol:`0 = ${m0}x ${pmt(b)} → ${m0}x = ${-b} → x = <b>${fmt(x0)}</b>`};
 }}]});

T({id:"lgs", kl:8, title:"Lineare Gleichungssysteme", desc:"Zwei Gleichungen, zwei Unbekannte.",
expl:`<p class="lead">Zwei Gleichungen mit x und y — gesucht ist das Zahlenpaar, das <b>beide</b> erfüllt. Grafisch: der Schnittpunkt zweier Geraden.</p>
<h3>Einsetzungsverfahren</h3>
<ol class="steps">
<li>Eine Gleichung nach einer Variablen auflösen, am besten dort, wo eine 1 davorsteht.</li>
<li>Diesen Ausdruck in die <b>andere</b> Gleichung einsetzen.</li>
<li>Die entstandene Gleichung mit nur einer Variablen lösen.</li>
<li>Das Ergebnis zurück einsetzen und die zweite Variable berechnen.</li>
</ol>
<h3>Additionsverfahren</h3>
<ol class="steps">
<li>Beide Gleichungen so multiplizieren, dass eine Variable gleich große, entgegengesetzte Vorzeichen bekommt.</li>
<li>Gleichungen addieren — diese Variable fällt weg.</li>
<li>Rest lösen und zurück einsetzen.</li>
</ol>
<div class="ex">I: 2x + 3y = 12<br>II: x − 3y = 3<br>I + II: 3x = 15 → x = 5 → in II: 5 − 3y = 3 → y = <b>⅔</b></div>
<div class="rule"><b>Probe nicht vergessen:</b> Setze das Paar in <u>beide</u> Gleichungen ein. Nur wenn beide stimmen, ist es die Lösung.<br>
<b>Sonderfälle:</b> Kommt 0 = 0 heraus, sind die Geraden identisch (unendlich viele Lösungen). Kommt 0 = 5 heraus,
sind sie parallel (keine Lösung).</div>`,
gens:[
 {id:"loesen", label:"Gleichungssystem lösen", make(){
   const x = Rn(-8,8), y = Rn(-8,8);
   const a = Rn(-5,5), b = Rn(-5,5), c = Rn(-5,5), d = Rn(-5,5);
   if(a*d - b*c === 0) return this.make();
   const e = a*x + b*y, f = c*x + d*y;
   const t = (k,v) => `${k===1?"":k===-1?"−":k}${v}`;
   return {q:`Löse das Gleichungssystem:<br>${m(`I: ${t(a,"x")} ${pmt(b)}y = ${e}`)}<br>${m(`II: ${t(c,"x")} ${pmt(d)}y = ${f}`)}`,
     fields:[{label:"x", num:x},{label:"y", num:y}],
     sol:`Additionsverfahren: I·${d} − II·${b} liefert x = <b>${x}</b>, eingesetzt y = <b>${y}</b>. Probe in I: ${a}·${x} ${b<0?"−":"+"} ${Math.abs(b)}·${y} = ${e} ✓`};
 }},
 {id:"einsetzen", label:"Einsetzungsverfahren", make(){
   const x = Rn(-9,9), y = Rn(-9,9), a = Rn(-4,4), c = Rn(-5,5), d = Rn(-5,5);
   const b = y - a*x;                       // II: y = ax + b
   const f = c*x + d*y;
   return {q:`Löse durch Einsetzen:<br>${m(`I: ${c}x ${pmt(d)}y = ${f}`)}<br>${m(`II: y = ${a}x ${pmt(b)}`)}`,
     fields:[{label:"x", num:x},{label:"y", num:y}],
     sol:`II in I einsetzen: ${c}x ${d<0?"−":"+"} ${Math.abs(d)}·(${a}x ${b<0?"−":"+"} ${Math.abs(b)}) = ${f} → x = <b>${x}</b> → y = ${a}·${x} ${b<0?"−":"+"} ${Math.abs(b)} = <b>${y}</b>`};
 }},
 {id:"sach", label:"Sachaufgabe", make(){
   const a = R(2,9), b = R(2,9);          // Anzahlen
   const p1 = R(2,9), p2 = R(2,9);        // Preise
   if(p1 === p2) return this.make();
   const sum = a+b, kosten = a*p1 + b*p2;
   return {q:`${m(sum)} Karten kosten zusammen ${m(kosten+" €")}. Eine Kinderkarte kostet ${m(p1+" €")}, eine Erwachsenenkarte ${m(p2+" €")}. Wie viele Karten jeder Sorte waren es?`,
     fields:[{label:"Kinderkarten", num:a},{label:"Erwachsenenkarten", num:b}],
     sol:`x + y = ${sum} und ${p1}x + ${p2}y = ${kosten} → x = <b>${a}</b>, y = <b>${b}</b>`};
 }}]});

T({id:"flaeche2", kl:8, title:"Flächen: Dreieck, Parallelogramm, Trapez", desc:"Formeln für Vielecke und zusammengesetzte Flächen.",
expl:`<p class="lead">Alle diese Formeln lassen sich auf das Rechteck zurückführen — deshalb muss man sich nur merken, wo das Rechteck steckt.</p>
<h3>Die Formeln</h3>
<table class="tbl">
<tr><td class="f">Dreieck</td><td class="f">A = ½ · g · h</td><td>ein Dreieck ist ein halbes Parallelogramm</td></tr>
<tr><td class="f">Parallelogramm</td><td class="f">A = g · h</td><td>eine Ecke abschneiden und anlegen → Rechteck</td></tr>
<tr><td class="f">Trapez</td><td class="f">A = ½ · (a + c) · h</td><td>Mittelwert der beiden parallelen Seiten mal Höhe</td></tr>
<tr><td class="f">Raute</td><td class="f">A = ½ · e · f</td><td>halbes Produkt der Diagonalen</td></tr>
</table>
<div class="rule"><b>Die Höhe steht immer senkrecht auf der Grundseite</b> — sie ist nicht die schräge Seite!
Das ist der mit Abstand häufigste Fehler bei diesen Aufgaben.</div>
<h3>Zusammengesetzte Flächen</h3>
<ol class="steps">
<li>Figur in Rechtecke, Dreiecke und Trapeze zerlegen.</li>
<li>Jede Teilfläche einzeln berechnen.</li>
<li>Addieren — oder bei ausgeschnittenen Teilen subtrahieren.</li>
</ol>`,
gens:[
 {id:"dreieck", label:"Dreieck", make(){
   const g = R(4,30), h = R(3,24);
   if(Math.random() < .65)
     return {q:`Ein Dreieck hat die Grundseite ${m(g+" cm")} und die Höhe ${m(h+" cm")}. Berechne den Flächeninhalt.`,
       num:g*h/2, unit:"cm²", dec:2, sol:`A = ½ · ${g} · ${h} = <b>${fmt(g*h/2)} cm²</b>`};
   return {q:`Ein Dreieck hat den Flächeninhalt ${m(fmt(g*h/2)+" cm²")} und die Grundseite ${m(g+" cm")}. Wie hoch ist es?`,
     num:h, unit:"cm", dec:2, sol:`h = 2A : g = ${fmt(g*h)} : ${g} = <b>${h} cm</b>`};
 }},
 {id:"parallelogramm", label:"Parallelogramm", make(){
   const g = R(5,25), h = R(3,20);
   return {q:`Ein Parallelogramm hat die Grundseite ${m(g+" cm")} und die Höhe ${m(h+" cm")}. Berechne den Flächeninhalt.`,
     num:g*h, unit:"cm²", sol:`A = ${g} · ${h} = <b>${g*h} cm²</b>`};
 }},
 {id:"trapez", label:"Trapez", make(){
   const a = R(8,30), c = R(3,a-1), h = R(3,18);
   return {q:`Ein Trapez hat die parallelen Seiten ${m(a+" cm")} und ${m(c+" cm")} sowie die Höhe ${m(h+" cm")}. Berechne den Flächeninhalt.`,
     num:(a+c)*h/2, unit:"cm²", dec:2,
     sol:`A = ½ · (${a} + ${c}) · ${h} = ½ · ${a+c} · ${h} = <b>${fmt((a+c)*h/2)} cm²</b>`};
 }},
 {id:"raute", label:"Raute", make(){
   const e = R(4,24), f = R(4,24);
   return {q:`Eine Raute hat die Diagonalen ${m(e+" cm")} und ${m(f+" cm")}. Berechne den Flächeninhalt.`,
     num:e*f/2, unit:"cm²", dec:2, sol:`A = ½ · ${e} · ${f} = <b>${fmt(e*f/2)} cm²</b>`};
 }}]});

T({id:"kreis", kl:8, title:"Kreis", desc:"Umfang, Flächeninhalt, Kreisteile.",
expl:`<p class="lead">Der Kreis hat nur eine Maßzahl — den Radius — und eine besondere Zahl: π ≈ 3,14159.</p>
<h3>Die Formeln</h3>
<div class="ex">Umfang:  U = 2 · π · r = π · d<br>Fläche:  A = π · r²<br>Durchmesser: d = 2r</div>
<div class="rule"><b>Woher kommt π?</b> Teilt man bei <u>jedem</u> Kreis den Umfang durch den Durchmesser, kommt immer
dieselbe Zahl heraus: 3,14159… Genau das ist π.</div>
<h3>Rückwärts rechnen</h3>
<ol class="steps">
<li>Umfang gegeben, Radius gesucht: r = U : (2π).</li>
<li>Fläche gegeben, Radius gesucht: erst durch π teilen, dann die Wurzel ziehen: r = √(A : π).</li>
</ol>
<h3>Kreisteile</h3>
<div class="rule">Ein Kreisausschnitt mit dem Mittelpunktswinkel α ist der Anteil ${frac("α","360°")} vom ganzen Kreis:<br>
Bogen b = ${frac("α","360°")} · 2πr   ·   Fläche A = ${frac("α","360°")} · πr²</div>
<div class="rule"><b>Achtung beim Runden:</b> Erst ganz am Ende runden. Wer zwischendurch π = 3,14 einsetzt und rundet,
bekommt bei großen Zahlen deutlich falsche Ergebnisse.</div>`,
gens:[
 {id:"umfang", label:"Umfang & Fläche", make(){
   const r = R(2,25);
   return {q:`Ein Kreis hat den Radius ${m(r+" cm")}. Berechne Umfang und Flächeninhalt (auf 2 Stellen gerundet).`,
     fields:[{label:"Umfang", num:2*Math.PI*r, unit:"cm", dec:2},{label:"Fläche", num:Math.PI*r*r, unit:"cm²", dec:2}],
     sol:`U = 2 · π · ${r} = <b>${fmt(2*Math.PI*r,2)} cm</b> · A = π · ${r}² = <b>${fmt(Math.PI*r*r,2)} cm²</b>`};
 }},
 {id:"durchmesser", label:"Aus dem Durchmesser", make(){
   const d = R(4,40);
   return {q:`Ein Kreis hat den Durchmesser ${m(d+" cm")}. Berechne den Flächeninhalt (2 Nachkommastellen).`,
     num:Math.PI*(d/2)**2, unit:"cm²", dec:2,
     sol:`r = ${d} : 2 = ${fmt(d/2)} cm → A = π · ${fmt(d/2)}² = <b>${fmt(Math.PI*(d/2)**2,2)} cm²</b>`};
 }},
 {id:"rueck", label:"Rückwärts", make(){
   const r = R(2,20);
   if(Math.random() < .5)
     return {q:`Ein Kreis hat den Umfang ${m(fmt(2*Math.PI*r,2)+" cm")}. Wie groß ist der Radius?`,
       num:r, unit:"cm", dec:2, sol:`r = U : (2π) = ${fmt(2*Math.PI*r,2)} : ${fmt(2*Math.PI,4)} = <b>${r} cm</b>`};
   return {q:`Ein Kreis hat den Flächeninhalt ${m(fmt(Math.PI*r*r,2)+" cm²")}. Wie groß ist der Radius?`,
     num:r, unit:"cm", dec:2,
     sol:`r = √(A : π) = √(${fmt(Math.PI*r*r,2)} : π) = √${r*r} = <b>${r} cm</b>`};
 }},
 {id:"ausschnitt", label:"Kreisausschnitt", make(){
   const r = R(3,20), a = pick([30,45,60,90,120,135,150,180,270]);
   return {q:`Ein Kreisausschnitt mit dem Radius ${m(r+" cm")} hat den Mittelpunktswinkel ${m(a+"°")}. Berechne seinen Flächeninhalt (2 Nachkommastellen).`,
     num:a/360*Math.PI*r*r, unit:"cm²", dec:2,
     sol:`A = ${a}/360 · π · ${r}² = ${fmt(a/360,4)} · ${fmt(Math.PI*r*r,2)} = <b>${fmt(a/360*Math.PI*r*r,2)} cm²</b>`};
 }}]});

T({id:"wsk1", kl:8, title:"Wahrscheinlichkeit", desc:"Laplace, Gegenereignis, Häufigkeiten.",
expl:`<p class="lead">Eine Wahrscheinlichkeit ist eine Zahl zwischen 0 und 1: 0 heißt unmöglich, 1 heißt sicher. Oft schreibt man sie als Bruch oder in Prozent.</p>
<h3>Die Laplace-Formel</h3>
<div class="ex">P(E) = ${frac("Anzahl der günstigen Ergebnisse","Anzahl aller möglichen Ergebnisse")}</div>
<p>Sie gilt nur, wenn alle Ergebnisse <b>gleich wahrscheinlich</b> sind — bei einem fairen Würfel oder einer gut gemischten Urne.</p>
<div class="ex">Würfel, gerade Zahl: günstig sind 2, 4, 6 → P = ${frac(3,6)} = ${frac(1,2)} = 50 %</div>
<h3>Gegenereignis</h3>
<div class="rule">P(nicht E) = 1 − P(E).<br>
Das spart oft viel Arbeit: „mindestens eine Sechs" ist mühsam, „gar keine Sechs" ist leicht — und dann 1 minus das Ergebnis.</div>
<h3>Von der Häufigkeit zur Wahrscheinlichkeit</h3>
<p>Bei vielen Versuchen nähert sich die relative Häufigkeit der Wahrscheinlichkeit an (Gesetz der großen Zahlen).
Aus 500 Würfen mit 78 Sechsen schätzt man P ≈ 78 : 500 = 0,156.</p>`,
gens:[
 {id:"laplace", label:"Laplace", make(){
   const r = R(2,9), b = R(2,9), g = R(2,9);
   const ges = r+b+g, f = pick([["rote",r],["blaue",b],["grüne",g]]);
   return {q:`In einer Urne liegen ${m(r)} rote, ${m(b)} blaue und ${m(g)} grüne Kugeln. Wie groß ist die Wahrscheinlichkeit, eine ${f[0]} zu ziehen? (als Prozentwert, 2 Nachkommastellen)`,
     num:round(f[1]/ges*100,2), unit:"%", dec:2,
     sol:`P = ${f[1]}/${ges} = ${fmt(f[1]/ges,4)} = <b>${fmt(round(f[1]/ges*100,2))} %</b>`};
 }},
 {id:"wuerfel", label:"Würfel & Münze", make(){
   const f = pick([
     ["eine gerade Zahl", 3], ["eine Zahl größer als 4", 2], ["eine Primzahl (2, 3, 5)", 3],
     ["eine Zahl kleiner als 3", 2], ["keine Sechs", 5], ["eine durch 3 teilbare Zahl", 2]]);
   return {q:`Ein fairer Würfel wird geworfen. Wie wahrscheinlich ist es, ${f[0]} zu würfeln? (in Prozent, 2 Nachkommastellen)`,
     num:round(f[1]/6*100,2), unit:"%", dec:2,
     sol:`${f[1]} von 6 Ergebnissen sind günstig: P = ${f[1]}/6 = <b>${fmt(round(f[1]/6*100,2))} %</b>`};
 }},
 {id:"gegen", label:"Gegenereignis", make(){
   const p = R(5,95);
   return {q:`Ein Ereignis hat die Wahrscheinlichkeit ${m(p+" %")}. Wie wahrscheinlich ist das Gegenereignis?`,
     num:100-p, unit:"%", sol:`P(nicht E) = 100 % − ${p} % = <b>${100-p} %</b>`};
 }},
 {id:"haeufig", label:"Relative Häufigkeit", make(){
   const n = pick([200,250,400,500,800]), k = R(20, Math.floor(n/2));
   return {q:`Bei ${m(n)} Versuchen tritt ein Ereignis ${m(k)}-mal ein. Wie groß ist die relative Häufigkeit in Prozent?`,
     num:round(k/n*100,2), unit:"%", dec:2,
     sol:`${k} : ${n} = ${fmt(k/n,4)} → <b>${fmt(round(k/n*100,2))} %</b>`};
 }}]});

T({id:"potenzen", kl:9, title:"Potenzen, Wurzeln & Zehnerpotenzen", desc:"Potenzgesetze, Wurzeln, wissenschaftliche Schreibweise.",
expl:`<p class="lead">Eine Potenz ist eine abgekürzte Multiplikation: 2⁵ = 2·2·2·2·2 = 32. Unten steht die <b>Basis</b>, oben der <b>Exponent</b>.</p>
<h3>Die Potenzgesetze</h3>
<table class="tbl">
<tr><td class="f">a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup></td><td>gleiche Basis, mal → Exponenten addieren</td></tr>
<tr><td class="f">a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup></td><td>gleiche Basis, geteilt → subtrahieren</td></tr>
<tr><td class="f">(a<sup>m</sup>)<sup>n</sup> = a<sup>m·n</sup></td><td>Potenz einer Potenz → malnehmen</td></tr>
<tr><td class="f">a<sup>0</sup> = 1</td><td>gilt für jede Basis außer 0</td></tr>
<tr><td class="f">a<sup>−n</sup> = 1 : a<sup>n</sup></td><td>negativer Exponent = Kehrwert</td></tr>
</table>
<div class="rule"><b>Nur bei gleicher Basis!</b> 2³ · 5³ lässt sich nicht über die Exponenten zusammenfassen —
aber es gilt a<sup>n</sup> · b<sup>n</sup> = (a·b)<sup>n</sup>, also 2³ · 5³ = 10³.</div>
<h3>Wurzeln</h3>
<p>√a ist die Zahl, die mit sich selbst malgenommen a ergibt. Teilweises Wurzelziehen:
√72 = √(36 · 2) = 6√2 — man sucht die größte Quadratzahl im Radikanden.</p>
<h3>Wissenschaftliche Schreibweise</h3>
<ol class="steps">
<li>Komma so verschieben, dass <b>genau eine Ziffer</b> vor dem Komma steht (1 bis 9).</li>
<li>Zählen, um wie viele Stellen verschoben wurde — das ist der Exponent.</li>
<li>Nach links verschoben → positiver Exponent, nach rechts → negativer.</li>
</ol>
<div class="ex">45 000 000 = 4,5 · 10<sup>7</sup>   ·   0,00032 = 3,2 · 10<sup>−4</sup></div>`,
gens:[
 {id:"gesetze", label:"Potenzgesetze", make(){
   const a = pick([2,3,5,10]), m0 = R(2,6), n = R(2,5);
   const art = R(1,3);
   if(art === 1) return {q:`Vereinfache und berechne: ${m(`${a}^${m0} · ${a}^${n}`)}`, num:a**(m0+n),
     sol:`Exponenten addieren: ${a}<sup>${m0+n}</sup> = <b>${a**(m0+n)}</b>`};
   if(art === 2) return {q:`Vereinfache und berechne: ${m(`${a}^${m0+n} : ${a}^${n}`)}`, num:a**m0,
     sol:`Exponenten subtrahieren: ${a}<sup>${m0}</sup> = <b>${a**m0}</b>`};
   return {q:`Vereinfache und berechne: ${m(`(${a}^${m0})^2`)}`, num:a**(2*m0),
     sol:`Exponenten malnehmen: ${a}<sup>${2*m0}</sup> = <b>${a**(2*m0)}</b>`};
 }},
 {id:"negativ", label:"Negative Exponenten", make(){
   const a = pick([2,3,4,5,10]), n = R(1,3);
   return {q:`Berechne ${m(`${a}^(−${n})`)} als Dezimalzahl.`, num:1/a**n, dec:5,
     sol:`${a}<sup>−${n}</sup> = 1 : ${a}<sup>${n}</sup> = 1 : ${a**n} = <b>${fmt(1/a**n)}</b>`};
 }},
 {id:"wurzel", label:"Wurzeln", make(){
   if(Math.random() < .5){
     const n = R(4,30);
     return {q:`Berechne ${m("√"+n*n)}`, num:n, sol:`${n} · ${n} = ${n*n} → <b>${n}</b>`};
   }
   const q0 = pick([4,9,16,25,36,49,64]), r = pick([2,3,5,6,7,10]);
   return {q:`Ziehe teilweise die Wurzel: ${m("√"+q0*r)} = ? · √${r}`, num:Math.sqrt(q0),
     sol:`√${q0*r} = √${q0} · √${r} = <b>${Math.sqrt(q0)}</b>√${r}`};
 }},
 {id:"zehner", label:"Zehnerpotenzen", make(){
   const mant = round(R(100,999)/100, 2), e = pick([-6,-5,-4,-3,3,4,5,6,7,8]);
   const v = mant * 10**e;
   if(e < 0 || Math.random() < .5)
     return {q:`Schreibe ${m(v.toLocaleString("de-DE",{maximumFractionDigits:12}))} in wissenschaftlicher Schreibweise. Wie lautet der Exponent von 10?`,
       num:e, hint:"nur den Exponenten eintragen",
       sol:`${v.toLocaleString("de-DE",{maximumFractionDigits:12})} = ${fmt(mant)} · 10<sup>${e}</sup> → Exponent <b>${e}</b>`};
   return {q:`Berechne ${m(`${fmt(mant)} · 10^${e}`)} als gewöhnliche Zahl.`, num:v, tol:Math.abs(v)*1e-9,
     sol:`Komma um ${Math.abs(e)} Stellen nach rechts → <b>${v.toLocaleString("de-DE",{maximumFractionDigits:12})}</b>`};
 }}]});

T({id:"pythagoras", kl:9, title:"Satz des Pythagoras", desc:"Seiten im rechtwinkligen Dreieck berechnen.",
expl:`<p class="lead">Im <b>rechtwinkligen</b> Dreieck gilt: <b>a² + b² = c²</b> — dabei ist c immer die längste Seite, die dem rechten Winkel gegenüberliegt.</p>
<div class="rule"><b>Kathete</b> = eine der beiden Seiten am rechten Winkel. <b>Hypotenuse</b> = die Seite gegenüber
dem rechten Winkel, immer die längste.<br>Der Satz gilt <u>nur</u> bei einem rechten Winkel — ohne ihn ist jede Rechnung falsch.</div>
<h3>Hypotenuse berechnen</h3>
<ol class="steps">
<li>Beide Katheten quadrieren: 3² = 9 und 4² = 16.</li>
<li>Addieren: 9 + 16 = 25.</li>
<li>Wurzel ziehen: c = √25 = <b>5</b>.</li>
</ol>
<h3>Kathete berechnen</h3>
<ol class="steps">
<li>Formel umstellen: a² = c² − b² — hier wird <b>subtrahiert</b>.</li>
<li>Einsetzen: a² = 13² − 5² = 169 − 25 = 144.</li>
<li>Wurzel: a = <b>12</b>.</li>
</ol>
<div class="rule"><b>Kontrolle:</b> Die Hypotenuse muss die größte Zahl sein. Kommt für eine Kathete ein größerer Wert
als für c heraus, wurde addiert statt subtrahiert.</div>
<h3>Umkehrung</h3>
<p>Gilt in einem Dreieck a² + b² = c², dann ist es rechtwinklig. Damit lässt sich prüfen, ob ein Dreieck einen rechten Winkel hat.</p>`,
gens:[
 {id:"hypo", label:"Hypotenuse", make(){
   const tri = pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,12,15],[6,8,10]]);
   const f = pick([1,1,1,2,3]);
   const [a,b,c] = tri.map(x => x*f);
   return {q:`Ein rechtwinkliges Dreieck hat die Katheten ${m(a+" cm")} und ${m(b+" cm")}. Wie lang ist die Hypotenuse?`,
     num:c, unit:"cm", dec:2,
     sol:`c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c} → c = <b>${c} cm</b>`};
 }},
 {id:"kathete", label:"Kathete", make(){
   const tri = pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]]);
   const f = pick([1,1,2,3]);
   const [a,b,c] = tri.map(x => x*f);
   return {q:`In einem rechtwinkligen Dreieck ist die Hypotenuse ${m(c+" cm")} und eine Kathete ${m(b+" cm")} lang. Wie lang ist die andere Kathete?`,
     num:a, unit:"cm", dec:2,
     sol:`a² = ${c}² − ${b}² = ${c*c} − ${b*b} = ${a*a} → a = <b>${a} cm</b>`};
 }},
 {id:"anwendung", label:"Anwendungen", make(){
   const a = R(3,15), b = R(3,15);
   const d = Math.sqrt(a*a + b*b);
   return {q:`Ein Rechteck ist ${m(a+" m")} lang und ${m(b+" m")} breit. Wie lang ist die Diagonale (2 Nachkommastellen)?`,
     num:d, unit:"m", dec:2,
     sol:`d² = ${a}² + ${b}² = ${a*a+b*b} → d = √${a*a+b*b} = <b>${fmt(d,2)} m</b>`};
 }},
 {id:"umkehr", label:"Rechtwinklig?", make(){
   const recht = Math.random() < .5;
   const tri = pick([[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15]]);
   const s = recht ? tri : [tri[0], tri[1], tri[2] + pick([1,2,-1])];
   return {q:`Ist ein Dreieck mit den Seiten ${m(s.join(" cm, ")+" cm")} rechtwinklig?`,
     opts:["ja","nein"], ai: recht?0:1,
     sol:`${s[0]}² + ${s[1]}² = ${s[0]**2+s[1]**2}, aber ${s[2]}² = ${s[2]**2} → ${recht?"gleich, also rechtwinklig":"ungleich, also nicht rechtwinklig"}.`};
 }}]});

T({id:"quadgl", kl:9, title:"Quadratische Gleichungen", desc:"pq-Formel, Satz vom Nullprodukt, Diskriminante.",
expl:`<p class="lead">Eine quadratische Gleichung enthält x². Sie hat <b>zwei, eine oder keine</b> Lösung — nie mehr als zwei.</p>
<h3>Die pq-Formel</h3>
<div class="rule">Die Gleichung muss zuerst in die <b>Normalform</b> gebracht werden: x² + px + q = 0.
Vor dem x² darf nichts stehen — sonst durch diese Zahl teilen.</div>
<div class="ex">x<sub>1,2</sub> = −${frac("p","2")} ± √( (${frac("p","2")})² − q )</div>
<ol class="steps">
<li>Gleichung nach Normalform sortieren, alles auf eine Seite bringen.</li>
<li>p und q ablesen — <b>mit Vorzeichen</b>.</li>
<li>Einsetzen und den Ausdruck unter der Wurzel (die <b>Diskriminante</b>) zuerst ausrechnen.</li>
<li>Zwei Ergebnisse bilden: einmal plus, einmal minus.</li>
</ol>
<div class="ex">x² − 2x − 15 = 0 → p = −2, q = −15<br>
x = 1 ± √(1 + 15) = 1 ± 4 → x₁ = <b>5</b>, x₂ = <b>−3</b></div>
<h3>Wie viele Lösungen?</h3>
<table class="tbl">
<tr><td class="f">D &gt; 0</td><td>zwei Lösungen</td></tr>
<tr><td class="f">D = 0</td><td>eine Lösung</td></tr>
<tr><td class="f">D &lt; 0</td><td>keine Lösung (Wurzel aus einer negativen Zahl)</td></tr>
</table>
<h3>Ohne Formel geht es oft schneller</h3>
<div class="rule">Fehlt das absolute Glied: x² − 5x = 0 → x(x − 5) = 0 → x = 0 oder x = 5 (<b>Satz vom Nullprodukt</b>).<br>
Fehlt das x-Glied: x² − 16 = 0 → x² = 16 → x = ±4.</div>`,
gens:[
 {id:"pq", label:"pq-Formel", make(){
   let x1 = Rn(-9,9), x2 = Rn(-9,9);
   if(x1 < x2) [x1,x2] = [x2,x1];
   const p = -(x1+x2), q = x1*x2;
   return {q:`Löse: ${m(`x² ${pmt(p,"x")} ${pmt(q)} = 0`)}`,
     fields:[{label:"x₁ (größere Lösung)", num:x1},{label:"x₂", num:x2}],
     sol:`p = ${p}, q = ${q} → x = ${fmt(-p/2)} ± √(${fmt((p/2)**2)} − (${q})) = ${fmt(-p/2)} ± ${fmt(Math.sqrt((p/2)**2-q))} → x₁ = <b>${x1}</b>, x₂ = <b>${x2}</b>`};
 }},
 {id:"nullprodukt", label:"Ohne pq-Formel", make(){
   if(Math.random() < .5){
     const a = Rn(-9,9);
     return {q:`Löse ohne pq-Formel: ${m(`x² ${pmt(a,"x")} = 0`)}`,
       fields:[{label:"x₁ (größere Lösung)", num:Math.max(0,-a)},{label:"x₂", num:Math.min(0,-a)}],
       sol:`x ausklammern: x(x ${pmt(a)}) = 0 → x = 0 oder x = ${-a}`};
   }
   const b = R(2,12);
   return {q:`Löse: ${m(`x² − ${b*b} = 0`)}`,
     fields:[{label:"x₁ (positiv)", num:b},{label:"x₂", num:-b}],
     sol:`x² = ${b*b} → x = ±√${b*b} → x₁ = <b>${b}</b>, x₂ = <b>${-b}</b>`};
 }},
 {id:"anzahl", label:"Anzahl der Lösungen", make(){
   const p = Rn(-8,8), q = R(-12,20);
   const d = (p/2)**2 - q;
   const n = d > 1e-9 ? 2 : Math.abs(d) < 1e-9 ? 1 : 0;
   return {q:`Wie viele Lösungen hat ${m(`x² ${pmt(p,"x")} ${pmt(q)} = 0`)}?`,
     opts:["keine","eine","zwei"], ai:n,
     sol:`D = (${fmt(p/2)})² − (${q}) = ${fmt(d)} → ${n===2?"D > 0, also zwei":n===1?"D = 0, also eine":"D < 0, also keine"} Lösung${n===1?"":"en"}.`};
 }},
 {id:"normalform", label:"Erst normieren", make(){
   const a = pick([2,3,4]), x1 = Rn(-6,6), x2 = Rn(-6,6);
   const p = -(x1+x2), q = x1*x2;
   const [A,B,C] = [a, a*p, a*q];
   const hi = Math.max(x1,x2), lo = Math.min(x1,x2);
   return {q:`Löse: ${m(`${A}x² ${pmt(B,"x")} ${pmt(C)} = 0`)}`,
     fields:[{label:"x₁ (größere Lösung)", num:hi},{label:"x₂", num:lo}],
     sol:`Zuerst durch ${A} teilen → x² ${pmt(p,"x")} ${pmt(q)} = 0. pq-Formel → x₁ = <b>${hi}</b>, x₂ = <b>${lo}</b>`};
 }}]});

T({id:"quadfunk", kl:9, title:"Quadratische Funktionen", desc:"Parabeln, Scheitelpunkt, Nullstellen.",
expl:`<p class="lead">Der Graph von y = x² ist eine <b>Parabel</b>. Alle anderen quadratischen Funktionen sind verschobene, gestreckte oder gespiegelte Versionen davon.</p>
<h3>Die Scheitelpunktform</h3>
<div class="ex">y = a(x − d)² + e   →   Scheitelpunkt <b>S(d | e)</b></div>
<table class="tbl">
<tr><td class="f">a &gt; 0</td><td>nach oben geöffnet, Scheitel ist der tiefste Punkt</td></tr>
<tr><td class="f">a &lt; 0</td><td>nach unten geöffnet, Scheitel ist der höchste Punkt</td></tr>
<tr><td class="f">|a| &gt; 1</td><td>schmaler als die Normalparabel</td></tr>
<tr><td class="f">|a| &lt; 1</td><td>breiter</td></tr>
</table>
<div class="rule"><b>Vorzeichenfalle:</b> Bei y = (x − 3)² + 2 ist der Scheitel S(3|2), bei y = (x + 3)² + 2 ist er S(−3|2).
Im Term steht das Gegenteil von dem, was man abliest.</div>
<h3>Von der Normalform zum Scheitel</h3>
<ol class="steps">
<li>Normalform: y = x² + px + q.</li>
<li>x-Koordinate des Scheitels: d = −p : 2.</li>
<li>y-Koordinate: d einsetzen und ausrechnen.</li>
</ol>
<div class="ex">y = x² − 6x + 5 → d = 3 → e = 9 − 18 + 5 = −4 → S(3|−4)</div>
<h3>Nullstellen</h3>
<p>Dort schneidet die Parabel die x-Achse: y = 0 setzen und die quadratische Gleichung lösen (pq-Formel).
Keine Lösung heißt: Die Parabel schneidet die x-Achse nicht.</p>`,
gens:[
 {id:"scheitel", label:"Scheitelpunkt ablesen", make(){
   const d = Rn(-7,7), e = Rn(-9,9), a = pick([1,1,1,-1,2,0.5]);
   const aTxt = a === 1 ? "" : a === -1 ? "−" : fmt(a);
   return {q:`Lies den Scheitelpunkt ab: ${m(`y = ${aTxt}(x ${d<0?"+ "+Math.abs(d):"− "+d})² ${pmt(e)}`)}`,
     fields:[{label:"x-Wert von S", num:d},{label:"y-Wert von S", num:e}],
     sol:`In der Klammer steht das Gegenteil: S(<b>${d}</b> | <b>${e}</b>). Die Parabel ist nach ${a>0?"oben":"unten"} geöffnet.`};
 }},
 {id:"normal2scheitel", label:"Scheitel berechnen", make(){
   const d = Rn(-6,6), e = Rn(-9,9);
   const p = -2*d, q = d*d + e;
   return {q:`Bestimme den Scheitelpunkt von ${m(`y = x² ${pmt(p,"x")} ${pmt(q)}`)}.`,
     fields:[{label:"x-Wert", num:d},{label:"y-Wert", num:e}],
     sol:`d = −p : 2 = ${fmt(-p/2)}. Einsetzen: ${d}² ${p<0?"−":"+"} ${Math.abs(p)}·${d} ${q<0?"−":"+"} ${Math.abs(q)} = ${e} → S(<b>${d}</b> | <b>${e}</b>)`};
 }},
 {id:"nullstellen", label:"Nullstellen", make(){
   let x1 = Rn(-8,8), x2 = Rn(-8,8);
   if(x1 < x2) [x1,x2] = [x2,x1];
   const p = -(x1+x2), q = x1*x2;
   return {q:`Berechne die Nullstellen von ${m(`y = x² ${pmt(p,"x")} ${pmt(q)}`)}.`,
     fields:[{label:"x₁ (größere)", num:x1},{label:"x₂", num:x2}],
     sol:`y = 0 setzen und pq-Formel: x = ${fmt(-p/2)} ± ${fmt(Math.sqrt((p/2)**2-q))} → <b>${x1}</b> und <b>${x2}</b>`};
 }},
 {id:"wert", label:"Funktionswerte", make(){
   const a = pick([1,-1,2,0.5]), d = Rn(-5,5), e = Rn(-8,8), x = Rn(-7,7);
   const y = a*(x-d)**2 + e;
   const aTxt = a === 1 ? "" : a === -1 ? "−" : fmt(a);
   return {q:`Berechne ${m("f("+x+")")} für ${m(`f(x) = ${aTxt}(x ${d<0?"+ "+Math.abs(d):"− "+d})² ${pmt(e)}`)}.`,
     num:y, dec:2,
     sol:`(${x} ${d<0?"+":"−"} ${Math.abs(d)})² = ${(x-d)**2} → ${a===1?"":fmt(a)+" · "}${(x-d)**2} ${e<0?"−":"+"} ${Math.abs(e)} = <b>${fmt(y)}</b>`};
 }}]});

T({id:"koerper2", kl:9, title:"Prisma & Zylinder", desc:"Volumen und Oberfläche gerader Körper.",
expl:`<p class="lead">Prisma und Zylinder sind „Türme": Eine Grundfläche wird gerade nach oben verschoben. Deshalb gilt für beide dieselbe Volumenformel.</p>
<div class="ex"><b>V = G · h</b>  (Grundfläche mal Höhe)</div>
<h3>Zylinder</h3>
<table class="tbl">
<tr><td class="f">V = π · r² · h</td><td>Grundfläche ist ein Kreis</td></tr>
<tr><td class="f">M = 2 · π · r · h</td><td>Mantel: aufgerollt ein Rechteck mit Umfang mal Höhe</td></tr>
<tr><td class="f">O = 2 · π · r² + M</td><td>zwei Kreise plus Mantel</td></tr>
</table>
<div class="rule"><b>Warum ist der Mantel ein Rechteck?</b> Schneide eine Konservendose längs auf und rolle sie ab:
Die eine Seite ist der Kreisumfang 2πr, die andere die Höhe h.</div>
<h3>Prisma</h3>
<ol class="steps">
<li>Zuerst die <b>Grundfläche</b> G berechnen — je nach Form Dreieck, Trapez oder Vieleck.</li>
<li>V = G · h.</li>
<li>Oberfläche: O = 2 · G + Mantel, und der Mantel ist Umfang der Grundfläche mal Höhe.</li>
</ol>
<div class="rule"><b>Zwei Höhen im Spiel:</b> Bei einem Dreiecksprisma gibt es die Höhe des Dreiecks (für G)
und die Höhe des Körpers. Nicht verwechseln.</div>`,
gens:[
 {id:"zylinderV", label:"Zylindervolumen", make(){
   const r = R(2,15), h = R(3,30);
   return {q:`Ein Zylinder hat den Radius ${m(r+" cm")} und die Höhe ${m(h+" cm")}. Berechne das Volumen (2 Nachkommastellen).`,
     num:Math.PI*r*r*h, unit:"cm³", dec:2,
     sol:`V = π · ${r}² · ${h} = π · ${r*r*h} = <b>${fmt(Math.PI*r*r*h,2)} cm³</b>`};
 }},
 {id:"zylinderO", label:"Zylinderoberfläche", make(){
   const r = R(2,12), h = R(3,25);
   const o = 2*Math.PI*r*r + 2*Math.PI*r*h;
   return {q:`Berechne die Oberfläche eines Zylinders mit ${m("r = "+r+" cm")} und ${m("h = "+h+" cm")} (2 Nachkommastellen).`,
     num:o, unit:"cm²", dec:2,
     sol:`O = 2π·${r}² + 2π·${r}·${h} = ${fmt(2*Math.PI*r*r,2)} + ${fmt(2*Math.PI*r*h,2)} = <b>${fmt(o,2)} cm²</b>`};
 }},
 {id:"prisma", label:"Prisma", make(){
   const g = R(3,15), hd = R(3,12), h = R(4,25);
   const G = g*hd/2;
   return {q:`Ein Prisma hat als Grundfläche ein Dreieck mit der Grundseite ${m(g+" cm")} und der Höhe ${m(hd+" cm")}. Der Körper ist ${m(h+" cm")} hoch. Berechne das Volumen.`,
     num:G*h, unit:"cm³", dec:2,
     sol:`G = ½ · ${g} · ${hd} = ${fmt(G)} cm² → V = ${fmt(G)} · ${h} = <b>${fmt(G*h)} cm³</b>`};
 }},
 {id:"rueck", label:"Rückwärts", make(){
   const r = R(2,12), h = R(4,20);
   const v = Math.PI*r*r*h;
   return {q:`Ein Zylinder mit dem Radius ${m(r+" cm")} hat das Volumen ${m(fmt(v,2)+" cm³")}. Wie hoch ist er?`,
     num:h, unit:"cm", dec:2,
     sol:`h = V : (π r²) = ${fmt(v,2)} : ${fmt(Math.PI*r*r,2)} = <b>${h} cm</b>`};
 }}]});

T({id:"wsk2", kl:9, title:"Mehrstufige Zufallsversuche", desc:"Baumdiagramm und Pfadregeln.",
expl:`<p class="lead">Wird mehrmals hintereinander gezogen oder geworfen, hilft ein <b>Baumdiagramm</b>. Jeder Weg von oben nach unten ist ein Pfad.</p>
<h3>Die beiden Pfadregeln</h3>
<ol class="steps">
<li><b>Produktregel:</b> Entlang eines Pfades werden die Wahrscheinlichkeiten <b>malgenommen</b>.</li>
<li><b>Summenregel:</b> Führen mehrere Pfade zum gewünschten Ergebnis, werden ihre Wahrscheinlichkeiten <b>addiert</b>.</li>
</ol>
<div class="ex">Zweimal würfeln, zweimal eine Sechs: ${frac(1,6)} · ${frac(1,6)} = ${frac(1,36)} ≈ 2,78 %</div>
<h3>Mit oder ohne Zurücklegen?</h3>
<table class="tbl">
<tr><td class="f">mit Zurücklegen</td><td>Die Wahrscheinlichkeiten bleiben in jeder Stufe gleich.</td></tr>
<tr><td class="f">ohne Zurücklegen</td><td>Nach jedem Zug wird die Gesamtzahl kleiner — und die Anzahl der gezogenen Sorte auch.</td></tr>
</table>
<div class="ex">5 rote und 3 blaue Kugeln, zweimal rot <b>ohne</b> Zurücklegen:
${frac(5,8)} · ${frac(4,7)} = ${frac(20,56)} ≈ 35,7 %</div>
<h3>„Mindestens einmal"</h3>
<div class="rule">Fast immer schneller über das Gegenereignis:<br>
P(mindestens eine Sechs bei 3 Würfen) = 1 − P(keine Sechs) = 1 − (${frac(5,6)})³ ≈ 42,1 %</div>`,
gens:[
 {id:"mit", label:"Mit Zurücklegen", make(){
   const r = R(2,7), b = R(2,7), n = r+b;
   const p = (r/n)**2;
   return {q:`In einer Urne sind ${m(r)} rote und ${m(b)} blaue Kugeln. Es wird zweimal <b>mit</b> Zurücklegen gezogen. Wie wahrscheinlich sind zwei rote? (in Prozent, 2 Nachkommastellen)`,
     num:round(p*100,2), unit:"%", dec:2,
     sol:`${r}/${n} · ${r}/${n} = ${fmt(p,4)} = <b>${fmt(round(p*100,2))} %</b>`};
 }},
 {id:"ohne", label:"Ohne Zurücklegen", make(){
   const r = R(3,8), b = R(2,7), n = r+b;
   const p = r/n * (r-1)/(n-1);
   return {q:`In einer Urne sind ${m(r)} rote und ${m(b)} blaue Kugeln. Es wird zweimal <b>ohne</b> Zurücklegen gezogen. Wie wahrscheinlich sind zwei rote? (in Prozent, 2 Nachkommastellen)`,
     num:round(p*100,2), unit:"%", dec:2,
     sol:`${r}/${n} · ${r-1}/${n-1} = ${fmt(p,4)} = <b>${fmt(round(p*100,2))} %</b>`};
 }},
 {id:"mindestens", label:"Mindestens einmal", make(){
   const n = R(2,4);
   const p = 1 - (5/6)**n;
   return {q:`Ein Würfel wird ${m(n+"-mal")} geworfen. Wie wahrscheinlich ist <b>mindestens eine</b> Sechs? (in Prozent, 2 Nachkommastellen)`,
     num:round(p*100,2), unit:"%", dec:2,
     sol:`Gegenereignis „keine Sechs": (5/6)<sup>${n}</sup> = ${fmt((5/6)**n,4)} → 1 − ${fmt((5/6)**n,4)} = <b>${fmt(round(p*100,2))} %</b>`};
 }},
 {id:"muenze", label:"Münzwurf", make(){
   const n = R(3,6), k = R(0,n);
   const binom = (n0,k0) => { let r0 = 1; for(let i = 1; i <= k0; i++) r0 = r0*(n0-k0+i)/i; return Math.round(r0); };
   const p = binom(n,k) / 2**n;
   return {q:`Eine Münze wird ${m(n+"-mal")} geworfen. Wie wahrscheinlich ist genau ${m(k+"-mal")} Kopf? (in Prozent, 2 Nachkommastellen)`,
     num:round(p*100,2), unit:"%", dec:2,
     sol:`Günstige Pfade: ${binom(n,k)} von insgesamt 2<sup>${n}</sup> = ${2**n} → <b>${fmt(round(p*100,2))} %</b>`};
 }}]});

T({id:"strahlen", kl:9, title:"Strahlensätze & Ähnlichkeit", desc:"Verhältnisse in Figuren, Vergrößern und Verkleinern.",
expl:`<p class="lead">Zwei Figuren sind <b>ähnlich</b>, wenn sie dieselbe Form haben und sich nur in der Größe unterscheiden. Alle Seiten stehen dann im selben Verhältnis, alle Winkel sind gleich.</p>
<h3>Der 1. Strahlensatz</h3>
<div class="rule">Werden zwei sich schneidende Geraden von zwei <b>parallelen</b> Geraden geschnitten, dann verhalten sich
die Abschnitte auf der einen Geraden wie die entsprechenden Abschnitte auf der anderen:</div>
<div class="ex">${frac("ZA","ZB")} = ${frac("ZC","ZD")}</div>
<h3>So rechnet man</h3>
<ol class="steps">
<li>Verhältnisgleichung aufstellen — immer <b>entsprechende</b> Strecken zusammenbringen.</li>
<li>Über Kreuz multiplizieren.</li>
<li>Nach der gesuchten Größe auflösen.</li>
</ol>
<div class="ex">${frac(4,6)} = ${frac("x",9)} → 6x = 36 → x = <b>6</b></div>
<div class="rule"><b>Die häufigste Falle:</b> Teilstrecke und ganze Strecke verwechseln. Vom Scheitelpunkt Z aus wird
immer die <u>ganze</u> Strecke gemessen, nicht nur das Stück zwischen den Parallelen.</div>
<h3>Ähnliche Dreiecke</h3>
<p>Stimmen zwei Winkel überein, sind die Dreiecke ähnlich. Der <b>Streckfaktor k</b> ist das Verhältnis
entsprechender Seiten. Für Flächen gilt: Wird jede Länge mit k multipliziert, wächst die Fläche mit <b>k²</b>.</p>`,
gens:[
 {id:"strahl", label:"Strahlensatz", make(){
   const k = pick([1.5,2,2.5,3]), a = R(3,12), c = R(4,15);
   const b = a*k, d = c*k;
   return {q:`Es gilt ${m(`${a} : ${fmt(b)} = ${c} : x`)}. Berechne x.`, num:d, dec:2, label:"x",
     sol:`Über Kreuz: ${a} · x = ${fmt(b)} · ${c} → x = ${fmt(b*c)} : ${a} = <b>${fmt(d)}</b>`};
 }},
 {id:"schatten", label:"Anwendung", make(){
   const hs = round(R(150,200)/100,2), ss = round(R(80,300)/100,2);
   const sb = R(4,25);
   const hb = round(hs/ss*sb, 2);
   return {q:`Ein ${m(fmt(hs)+" m")} großer Mensch wirft einen Schatten von ${m(fmt(ss)+" m")}. Ein Baum wirft gleichzeitig ${m(sb+" m")} Schatten. Wie hoch ist der Baum (2 Nachkommastellen)?`,
     num:hb, unit:"m", dec:2,
     sol:`${fmt(hs)} : ${fmt(ss)} = h : ${sb} → h = ${fmt(hs)} · ${sb} : ${fmt(ss)} = <b>${fmt(hb,2)} m</b>`};
 }},
 {id:"faktor", label:"Streckfaktor", make(){
   const k = pick([2,3,4,1.5,2.5]), a = R(3,15);
   return {q:`Ein Dreieck wird mit dem Faktor ${m("k = "+fmt(k))} vergrößert. Eine Seite war ${m(a+" cm")} lang. Wie lang ist sie danach, und um welchen Faktor wächst der Flächeninhalt?`,
     fields:[{label:"neue Seite", num:a*k, unit:"cm", dec:2},{label:"Faktor der Fläche", num:k*k, dec:2}],
     sol:`Seite: ${a} · ${fmt(k)} = <b>${fmt(a*k)} cm</b>. Fläche wächst mit k² = <b>${fmt(k*k)}</b>.`};
 }}]});
